const ANALYTICS_EXPORT_FIELDS = ['Name','Email','County','Age','Sponsor','Mentor','Registered','Progress %','Modules Completed','Modules In Progress','Quiz Avg %','Quiz Attempts','OJL Hours','Logins','Last Active','Lesson Time (min)'];

function AdminDashboard({ modules, profile, onOpenModule, onApprove, onModuleUpdated, onModuleDeleted }) {
  const isApprover = profile?.role === 'approver';
  const isAdmin = profile?.role === 'admin';
  const [adminTab, setAdminTab] = useState('curriculum'); // curriculum | registrants | team | analytics
  const [filter, setFilter] = useState('all'); // all | draft | approved
  const [editingModule, setEditingModule] = useState(null);
  const [showCreateForm, setShowCreateForm] = useState(false);
  const [createTitle, setCreateTitle] = useState('');
  const [createNumber, setCreateNumber] = useState('');
  const [creating, setCreating] = useState(false);
  // Team tab
  const [apprentices, setApprentices] = useState([]);
  const [mentors, setMentors] = useState([]);
  const [teamLoading, setTeamLoading] = useState(false);
  const [savingMentor, setSavingMentor] = useState({});
  const [pendingRegistrants, setPendingRegistrants] = useState([]);
  // Registrants tab
  const [registrants, setRegistrants] = useState([]);
  const [registrantsLoading, setRegistrantsLoading] = useState(false);
  const [registrantFilter, setRegistrantFilter] = useState('all'); // all | submitted | approved | closed
  const [reviewingRegistrant, setReviewingRegistrant] = useState(null);
  const [sponsors, setSponsors] = useState([]);
  // Analytics tab
  const [analytics, setAnalytics] = useState(null);
  const [analyticsLoading, setAnalyticsLoading] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [analyticsFilters, setAnalyticsFilters] = useState({ county: '', sponsorId: '', ageMin: '', ageMax: '', progressMin: '', progressMax: '' });
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [viewingApprenticeProfile, setViewingApprenticeProfile] = useState(null);
  const [exportFields, setExportFields] = useState(new Set(ANALYTICS_EXPORT_FIELDS));
  const [showFieldPicker, setShowFieldPicker] = useState(false);

  useEffect(() => {
    if (adminTab !== 'team' || !supabase) return;
    setTeamLoading(true);
    Promise.all([
      supabase.from('profiles').select('id,full_name,email,mentor_id,created_at').eq('role', 'apprentice').order('full_name'),
      supabase.from('profiles').select('id,full_name,email').in('role', ['mentor','admin','approver']).order('full_name'),
      supabase.from('registrants').select('id,full_name,email,sponsor_id,mentor_id,reviewed_at').eq('status', 'approved').is('activated_profile_id', null),
      supabase.from('employer_sponsors').select('id,name')
    ]).then(([{ data: app }, { data: men }, { data: pending }, { data: sp }]) => {
      setApprentices(app || []);
      // Deduplicate mentors by email — keep the one with a full_name set
      const seen = new Map();
      (men || []).forEach(m => {
        const existing = seen.get(m.email);
        if (!existing || (!existing.full_name && m.full_name)) seen.set(m.email, m);
      });
      setMentors(Array.from(seen.values()));
      setPendingRegistrants(pending || []);
      setSponsors(sp || []);
      setTeamLoading(false);
    });
  }, [adminTab]);

  useEffect(() => {
    if (adminTab !== 'registrants' || !supabase) return;
    setRegistrantsLoading(true);
    Promise.all([
      supabase.from('registrants').select('*').order('created_at', { ascending: false }),
      supabase.from('employer_sponsors').select('*').eq('active', true).order('name'),
      mentors.length ? Promise.resolve({ data: mentors }) : supabase.from('profiles').select('id,full_name,email').in('role', ['mentor','admin','approver']).order('full_name')
    ]).then(([{ data: regs }, { data: sp }, { data: men }]) => {
      setRegistrants(regs || []);
      setSponsors(sp || []);
      if (!mentors.length && men) {
        const seen = new Map();
        men.forEach(m => {
          const existing = seen.get(m.email);
          if (!existing || (!existing.full_name && m.full_name)) seen.set(m.email, m);
        });
        setMentors(Array.from(seen.values()));
      }
      setRegistrantsLoading(false);
    });

    const channel = supabase
      .channel('registrants-admin')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'registrants' }, payload => {
        if (payload.eventType === 'INSERT') {
          setRegistrants(prev => [payload.new, ...prev]);
        } else if (payload.eventType === 'UPDATE') {
          setRegistrants(prev => prev.map(r => r.id === payload.new.id ? payload.new : r));
        }
      })
      .subscribe();

    return () => { supabase.removeChannel(channel); };
  }, [adminTab]);

  useEffect(() => {
    if (adminTab !== 'analytics' || !supabase || analytics) return;
    setAnalyticsLoading(true);
    (async () => {
      const [{ data: app }, { data: regs }, { data: prog }, { data: subs }, { data: logins }, { data: reads }, { data: sp }, { data: men }] = await Promise.all([
        supabase.from('profiles').select('id,full_name,email,created_at,employer_sponsor_id,mentor_id,last_active_at').eq('role', 'apprentice'),
        supabase.from('registrants').select('status,sponsor_id,sponsor_token_id,activated_profile_id,dob,county,created_at'),
        supabase.from('module_progress').select('user_id,status,best_quiz_score,quiz_attempts,updated_at'),
        supabase.from('competency_submissions').select('apprentice_id,status,ojl_hours_credited'),
        supabase.from('login_events').select('user_id,logged_in_at'),
        supabase.from('lesson_reads').select('user_id,seconds_spent'),
        supabase.from('employer_sponsors').select('id,name,seats_total'),
        mentors.length ? Promise.resolve({ data: mentors }) : supabase.from('profiles').select('id,full_name,email').in('role', ['mentor','admin','approver']).order('full_name')
      ]);

      if (!mentors.length && men) {
        const seen = new Map();
        men.forEach(m => {
          const existing = seen.get(m.email);
          if (!existing || (!existing.full_name && m.full_name)) seen.set(m.email, m);
        });
        setMentors(Array.from(seen.values()));
      }
      const mentorList = mentors.length ? mentors : (men || []);
      const mentorNameById = {}; mentorList.forEach(m => { mentorNameById[m.id] = m.full_name || m.email; });
      const sponsorNameById = {}; (sp || []).forEach(s => { sponsorNameById[s.id] = s.name; });
      const regByProfile = {}; (regs || []).forEach(r => { if (r.activated_profile_id) regByProfile[r.activated_profile_id] = r; });

      // Dashboard overview — applicant pipeline, sponsor seat usage, mentor caseload
      const pipeline = { submitted: 0, approved: 0, closed: 0, total: (regs || []).length };
      (regs || []).forEach(r => { if (pipeline[r.status] !== undefined) pipeline[r.status]++; });

      const seatsUsedBySponsor = {};
      (regs || []).forEach(r => {
        if (r.sponsor_id && r.sponsor_token_id && r.status !== 'closed') {
          seatsUsedBySponsor[r.sponsor_id] = (seatsUsedBySponsor[r.sponsor_id] || 0) + 1;
        }
      });
      const sponsorSummary = (sp || []).map(s => ({
        id: s.id, name: s.name, seatsTotal: s.seats_total, seatsUsed: seatsUsedBySponsor[s.id] || 0
      }));

      const mentorLoad = {};
      (app || []).forEach(a => {
        if (!a.mentor_id) return;
        mentorLoad[a.mentor_id] = (mentorLoad[a.mentor_id] || 0) + 1;
      });
      const mentorSummary = mentorList
        .filter(m => mentorLoad[m.id])
        .map(m => ({ id: m.id, name: m.full_name || m.email, count: mentorLoad[m.id] }))
        .sort((a, b) => b.count - a.count);

      const approvedCount = modules.filter(m => m.status === 'approved').length;
      const byUser = {};
      (app || []).forEach(a => {
        const reg = regByProfile[a.id];
        byUser[a.id] = {
          ...a, completed: 0, inProgress: 0, scores: [], quizAttempts: 0, ojlHours: 0,
          lastActive: a.last_active_at || null, loginCount: 0, secondsSpent: 0,
          county: reg?.county || null, dob: reg?.dob || null,
          registeredAt: reg?.created_at || a.created_at,
          sponsorName: a.employer_sponsor_id ? (sponsorNameById[a.employer_sponsor_id] || null) : null,
          mentorName: a.mentor_id ? (mentorNameById[a.mentor_id] || null) : null,
        };
      });
      (prog || []).forEach(p => {
        const u = byUser[p.user_id]; if (!u) return;
        if (p.status === 'completed') u.completed++;
        if (p.status === 'in_progress') u.inProgress++;
        if (p.best_quiz_score) u.scores.push(p.best_quiz_score);
        u.quizAttempts += (p.quiz_attempts || 0);
        if (!u.lastActive || p.updated_at > u.lastActive) u.lastActive = p.updated_at;
      });
      (subs || []).forEach(s => {
        if (byUser[s.apprentice_id] && s.status === 'approved') byUser[s.apprentice_id].ojlHours += (s.ojl_hours_credited || 0);
      });
      (logins || []).forEach(l => {
        const u = byUser[l.user_id]; if (!u) return;
        u.loginCount++;
        if (!u.lastActive || l.logged_in_at > u.lastActive) u.lastActive = l.logged_in_at;
      });
      (reads || []).forEach(r => {
        const u = byUser[r.user_id]; if (u) u.secondsSpent += (r.seconds_spent || 0);
      });

      setAnalytics({ rows: Object.values(byUser), approvedModules: approvedCount, pipeline, sponsorSummary, mentorSummary });
      setAnalyticsLoading(false);
    })();
  }, [adminTab, modules]);

  const ageFromDob = (dob) => {
    if (!dob) return null;
    return Math.floor((Date.now() - new Date(dob).getTime()) / (365.25 * 24 * 3600 * 1000));
  };

  const analyticsFiltered = (analytics?.rows || []).filter(r => {
    if (analyticsFilters.county && r.county !== analyticsFilters.county) return false;
    if (analyticsFilters.sponsorId && r.employer_sponsor_id !== analyticsFilters.sponsorId) return false;
    const age = ageFromDob(r.dob);
    if (analyticsFilters.ageMin && (age === null || age < parseInt(analyticsFilters.ageMin, 10))) return false;
    if (analyticsFilters.ageMax && (age === null || age > parseInt(analyticsFilters.ageMax, 10))) return false;
    const pct = analytics?.approvedModules > 0 ? Math.round((r.completed / analytics.approvedModules) * 100) : 0;
    if (analyticsFilters.progressMin && pct < parseInt(analyticsFilters.progressMin, 10)) return false;
    if (analyticsFilters.progressMax && pct > parseInt(analyticsFilters.progressMax, 10)) return false;
    return true;
  });

  const toggleSelected = (id) => setSelectedIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const assignMentor = async (apprenticeId, mentorId) => {
    setSavingMentor(prev => ({ ...prev, [apprenticeId]: true }));
    await supabase.from('profiles').update({ mentor_id: mentorId || null }).eq('id', apprenticeId);
    setApprentices(prev => prev.map(a => a.id === apprenticeId ? { ...a, mentor_id: mentorId || null } : a));
    setSavingMentor(prev => ({ ...prev, [apprenticeId]: false }));
  };

  const exportCSV = async () => {
    setExporting(true);
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const res = await fetch('/.netlify/functions/export-progress', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(session?.access_token ? { 'Authorization': 'Bearer ' + session.access_token } : {})
        },
        body: JSON.stringify({})
      });
      if (!res.ok) throw new Error('Export failed: ' + res.status);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gic-progress-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) { alert('Export failed: ' + e.message); }
    setExporting(false);
  };

  const exportAnalyticsCSV = async (userIds) => {
    setExporting(true);
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const fields = exportFields.size < ANALYTICS_EXPORT_FIELDS.length ? Array.from(exportFields) : null;
      const res = await fetch('/.netlify/functions/export-registrants-analytics', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(session?.access_token ? { 'Authorization': 'Bearer ' + session.access_token } : {})
        },
        body: JSON.stringify({ userIds, fields })
      });
      if (!res.ok) throw new Error('Export failed: ' + res.status);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gic-analytics-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) { alert('Export failed: ' + e.message); }
    setExporting(false);
  };

  const filtered = modules.filter(m => filter === 'all' ? true : m.status === filter);
  const draftCount = modules.filter(m => m.status !== 'approved').length;
  const approvedCount = modules.filter(m => m.status === 'approved').length;

  const deleteRegistrant = async (id) => {
    const { error } = await supabase.from('registrants').delete().eq('id', id);
    if (error) { alert('Delete failed: ' + error.message); return; }
    setRegistrants(prev => prev.filter(r => r.id !== id));
    setReviewingRegistrant(prev => (prev && prev.id === id) ? null : prev);
  };

  const deleteModule = async (id) => {
    const { error } = await supabase.from('modules').delete().eq('id', id);
    if (error) { alert('Delete failed: ' + error.message); return; }
    onModuleDeleted && onModuleDeleted(id);
  };

  const createModule = async (e) => {
    e.preventDefault();
    if (!createTitle.trim()) return;
    setCreating(true);
    const maxNum = modules.reduce((mx, m) => Math.max(mx, m.module_number || 0), 0);
    const moduleNumber = parseInt(createNumber) || maxNum + 1;
    const { data, error } = await supabase.from('modules').insert({
      title: createTitle.trim(),
      module_number: moduleNumber,
      short_description: '',
      learning_objectives: [],
      content: { lessons: [] },
      is_published: false
    }).select().single();
    setCreating(false);
    if (error) { alert('Failed: ' + error.message); return; }
    onModuleUpdated && onModuleUpdated(data);
    setShowCreateForm(false);
    setCreateTitle('');
    setCreateNumber('');
  };

  return (
    <main className="max-w-7xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <div className="mb-8">
        <div className="eyebrow mb-3">Admin</div>
        <h1 className="font-display text-4xl lg:text-5xl font-medium leading-tight mb-3">
          {isApprover ? <>Review and approve <em>curriculum.</em></> : <>Program <em>management.</em></>}
        </h1>
      </div>

      {/* Admin tab bar */}
      <div className="flex gap-1 mb-8 border-b" style={{ borderColor: 'var(--gic-line)' }}>
        {[['curriculum','Curriculum'],['registrants','Registrants'],['team','Team'],['analytics','Analytics']].map(([id,label]) => (
          <button key={id} onClick={() => setAdminTab(id)}
            className="px-5 py-3 text-sm font-medium flex items-center gap-1.5"
            style={{ borderBottom: adminTab===id ? '2px solid var(--gic-blue)' : '2px solid transparent',
                     color: adminTab===id ? 'var(--gic-blue)' : 'var(--gic-muted)', marginBottom: '-1px' }}>
            {label}
            {id === 'registrants' && <NavBadge count={registrants.filter(r => r.status === 'submitted').length} />}
          </button>
        ))}
      </div>

      {adminTab === 'curriculum' && <>
      <div className="grid grid-cols-3 gap-px mb-8 border" style={{ borderColor: 'var(--gic-line)', background: 'var(--gic-line)' }}>
        <Stat label="Total Modules" value={modules.length} />
        <Stat label="Approved" value={approvedCount} max={modules.length} />
        <Stat label="Awaiting Review" value={draftCount} />
      </div>
      <div className="mb-6 flex items-center gap-2 flex-wrap">
        <span className="eyebrow mr-2">Filter</span>
        {[
          { id: 'all',      label: `All (${modules.length})` },
          { id: 'draft',    label: `Awaiting Review (${draftCount})` },
          { id: 'approved', label: `Approved (${approvedCount})` }
        ].map(f => (
          <button key={f.id} onClick={() => setFilter(f.id)}
                  className={`badge ${filter === f.id ? '' : 'opacity-50'}`}
                  style={filter === f.id
                    ? { color: 'var(--gic-blue)', background: 'rgba(45,31,177,0.06)', cursor: 'pointer' }
                    : { color: 'var(--gic-warm)', cursor: 'pointer' }}>
            {f.label}
          </button>
        ))}
        <div className="flex-1" />
        <button onClick={() => setShowCreateForm(v => !v)}
          className="btn-primary flex items-center gap-2 text-sm py-2 px-4">
          <Plus size={13}/> New Module
        </button>
      </div>

      {showCreateForm && (
        <form onSubmit={createModule} className="gic-card p-5 mb-5 flex items-end gap-3 flex-wrap">
          <div className="flex-1 min-w-[200px]">
            <label className="eyebrow block mb-1">Module Title</label>
            <input value={createTitle} onChange={e=>setCreateTitle(e.target.value)}
              className="w-full border rounded-lg p-2.5 text-sm" style={{borderColor:'var(--gic-line)'}}
              placeholder="e.g. Introduction to Estate Planning" autoFocus required />
          </div>
          <div style={{width:'120px'}}>
            <label className="eyebrow block mb-1">Module #</label>
            <input type="number" value={createNumber} onChange={e=>setCreateNumber(e.target.value)}
              className="w-full border rounded-lg p-2.5 text-sm" style={{borderColor:'var(--gic-line)'}}
              placeholder={String(modules.reduce((mx, m) => Math.max(mx, m.module_number || 0), 0) + 1)} />
          </div>
          <div className="flex items-center gap-2 pb-0.5">
            <button type="submit" disabled={creating} className="btn-primary text-sm py-2.5 px-4">
              {creating ? 'Creating…' : 'Create'}
            </button>
            <button type="button" onClick={() => setShowCreateForm(false)} className="btn-ghost text-sm">Cancel</button>
          </div>
        </form>
      )}

      <div className="gic-card divide-y" style={{ borderColor: 'var(--gic-line)' }}>
        {filtered.map(m => (
          <AdminModuleRow key={m.id} module={m} onOpen={onOpenModule} onApprove={onApprove} onEdit={setEditingModule} canApprove={isApprover} onDelete={deleteModule} />
        ))}
        {filtered.length === 0 && (
          <div className="p-10 text-center text-sm" style={{ color: 'var(--gic-muted)' }}>No modules match this filter.</div>
        )}
      </div>
      </>}

      {adminTab === 'registrants' && (
        registrantsLoading ? <LoadingScreen /> : (
          <div>
            <div className="mb-6 flex items-center gap-2 flex-wrap">
              <span className="eyebrow mr-2">Filter</span>
              {[
                { id: 'all',       label: `All (${registrants.length})` },
                { id: 'submitted', label: `Submitted (${registrants.filter(r => r.status === 'submitted').length})` },
                { id: 'approved',  label: `Approved (${registrants.filter(r => r.status === 'approved').length})` },
                { id: 'closed',    label: `Closed (${registrants.filter(r => r.status === 'closed').length})` },
              ].map(f => (
                <button key={f.id} onClick={() => setRegistrantFilter(f.id)}
                        className={`badge ${registrantFilter === f.id ? '' : 'opacity-50'}`}
                        style={registrantFilter === f.id
                          ? { color: 'var(--gic-blue)', background: 'rgba(45,31,177,0.06)', cursor: 'pointer' }
                          : { color: 'var(--gic-warm)', cursor: 'pointer' }}>
                  {f.label}
                </button>
              ))}
            </div>

            {registrants.filter(r => registrantFilter === 'all' ? true : r.status === registrantFilter).length === 0 ? (
              <div className="gic-card p-10 text-center">
                <ClipboardCheck size={28} className="mx-auto mb-3" style={{ color: 'var(--gic-warm)' }}/>
                <div className="font-display text-xl font-semibold mb-2">No applications</div>
                <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>Applications appear here once someone submits the public application form.</p>
              </div>
            ) : (
              <div className="gic-card divide-y" style={{ borderColor: 'var(--gic-line)' }}>
                {registrants.filter(r => registrantFilter === 'all' ? true : r.status === registrantFilter).map(r => (
                  <div key={r.id} onClick={() => setReviewingRegistrant(r)}
                    className="w-full text-left p-5 flex items-center gap-4 hover:bg-stone-50 transition-colors cursor-pointer">
                    <div className="w-10 h-10 rounded-full flex items-center justify-center font-semibold text-sm flex-shrink-0"
                      style={{ background: 'rgba(45,31,177,0.08)', color: 'var(--gic-blue)' }}>
                      {(r.full_name || r.email || '?').slice(0,1).toUpperCase()}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-medium truncate">{r.full_name}</div>
                      <div className="text-xs truncate" style={{ color: 'var(--gic-muted)' }}>
                        {r.email} · Submitted {new Date(r.created_at).toLocaleDateString()}
                        {r.county ? ` · ${r.county} County` : ''}
                      </div>
                    </div>
                    <span className="badge flex-shrink-0" style={{
                      color:      r.status === 'approved' ? 'var(--gic-green)' : r.status === 'closed' ? 'var(--gic-warm)' : 'var(--gic-blue)',
                      background: r.status === 'approved' ? 'rgba(31,122,74,0.08)' : r.status === 'closed' ? 'rgba(138,116,94,0.08)' : 'rgba(45,31,177,0.06)'
                    }}>{r.status}</span>
                    <button onClick={(e) => { e.stopPropagation(); if (confirm(`Delete ${r.full_name}'s application? This cannot be undone.`)) deleteRegistrant(r.id); }}
                      className="btn-ghost flex-shrink-0" title="Delete application" style={{ color: 'var(--gic-rose)' }}>
                      <Trash2 size={14}/>
                    </button>
                    <ChevronRight size={16} style={{ color: 'var(--gic-warm)' }} className="flex-shrink-0" />
                  </div>
                ))}
              </div>
            )}
          </div>
        )
      )}

      {adminTab === 'team' && (
        teamLoading ? <LoadingScreen /> : (
          <div>
            {pendingRegistrants.length > 0 && (
              <div className="mb-10">
                <div className="font-display text-lg font-semibold mb-1">Approved — awaiting activation</div>
                <p className="text-sm mb-4" style={{ color: 'var(--gic-muted)' }}>
                  Approved applicants who haven't yet redeemed their sponsorship code to set up their account.
                </p>
                <div className="gic-card divide-y" style={{ borderColor: 'var(--gic-line)' }}>
                  {pendingRegistrants.map(r => (
                    <div key={r.id} className="p-5 flex items-center gap-4">
                      <div className="w-10 h-10 rounded-full flex items-center justify-center font-semibold text-sm flex-shrink-0"
                        style={{ background: 'rgba(200,132,28,0.12)', color: '#C8841C' }}>
                        {(r.full_name || r.email || '?').slice(0,1).toUpperCase()}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="font-medium truncate">{r.full_name}</div>
                        <div className="text-xs truncate" style={{ color: 'var(--gic-muted)' }}>
                          {r.email}
                          {r.sponsor_id ? ` · ${sponsors.find(s => s.id === r.sponsor_id)?.name || 'Sponsor'}` : ''}
                          {r.mentor_id ? ` · Mentor: ${mentors.find(m => m.id === r.mentor_id)?.full_name || 'Assigned'}` : ''}
                        </div>
                      </div>
                      <span className="badge flex-shrink-0" style={{ color: '#C8841C', background: 'rgba(200,132,28,0.1)' }}>
                        Code not yet redeemed
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            <p className="text-sm mb-6" style={{ color: 'var(--gic-muted)' }}>Assign a mentor to each apprentice. Mentors review OJL submissions and answer questions from their assigned apprentices.</p>
            {apprentices.length === 0 ? (
              <div className="gic-card p-10 text-center">
                <Users size={28} className="mx-auto mb-3" style={{ color: 'var(--gic-warm)' }}/>
                <div className="font-display text-xl font-semibold mb-2">No apprentices yet</div>
                <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>Apprentices appear here once they register.</p>
              </div>
            ) : (
              <div className="gic-card divide-y" style={{ borderColor: 'var(--gic-line)' }}>
                {apprentices.map(a => (
                  <div key={a.id} className="p-5 flex items-center gap-4">
                    <div className="w-10 h-10 rounded-full flex items-center justify-center font-semibold text-sm flex-shrink-0"
                      style={{ background: 'rgba(45,31,177,0.08)', color: 'var(--gic-blue)' }}>
                      {(a.full_name || a.email || '?').slice(0,1).toUpperCase()}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-medium truncate">{a.full_name || a.email}</div>
                      <div className="text-xs truncate" style={{ color: 'var(--gic-muted)' }}>{a.email}</div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <select
                        value={a.mentor_id || ''}
                        onChange={e => assignMentor(a.id, e.target.value)}
                        className="border rounded-lg px-3 py-2 text-sm"
                        style={{ borderColor: 'var(--gic-line)', minWidth: 180 }}>
                        <option value="">— No mentor assigned —</option>
                        {mentors.map(m => (
                          <option key={m.id} value={m.id}>{m.full_name || m.email}</option>
                        ))}
                      </select>
                      {savingMentor[a.id] && <Loader2 size={14} className="animate-spin" style={{ color: 'var(--gic-blue)' }}/>}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )
      )}

      {adminTab === 'analytics' && (
        analyticsLoading || !analytics ? <LoadingScreen /> : (
          <div>
            <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
              <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                Cohort overview — {analyticsFiltered.length} of {analytics.rows.length} apprentice{analytics.rows.length !== 1 ? 's' : ''} shown.
              </p>
              <div className="flex items-center gap-2">
                <button onClick={exportCSV} disabled={exporting} className="btn-secondary flex items-center gap-2 text-sm">
                  <Download size={13}/>{exporting ? 'Exporting…' : 'Export RAPIDS CSV'}
                </button>
                <button onClick={() => setShowFieldPicker(v => !v)} className="btn-ghost flex items-center gap-1.5 text-sm">
                  <ListChecks size={13}/> Fields ({exportFields.size}/{ANALYTICS_EXPORT_FIELDS.length})
                </button>
                <button onClick={() => exportAnalyticsCSV(selectedIds.size ? Array.from(selectedIds) : analyticsFiltered.map(r => r.id))} disabled={exporting || exportFields.size === 0}
                  className="btn-primary flex items-center gap-2 text-sm">
                  <Download size={13}/>{selectedIds.size ? `Export selected (${selectedIds.size})` : 'Export filtered'}
                </button>
              </div>
            </div>

            {showFieldPicker && (
              <div className="gic-card p-4 mb-6">
                <div className="flex items-center justify-between mb-3">
                  <div className="eyebrow">Which fields to include in the export</div>
                  <div className="flex gap-3">
                    <button onClick={() => setExportFields(new Set(ANALYTICS_EXPORT_FIELDS))} className="btn-ghost text-xs">Select all</button>
                    <button onClick={() => setExportFields(new Set())} className="btn-ghost text-xs">Select none</button>
                  </div>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                  {ANALYTICS_EXPORT_FIELDS.map(f => (
                    <label key={f} className="flex items-center gap-2 text-sm">
                      <input type="checkbox" checked={exportFields.has(f)} onChange={() => setExportFields(prev => {
                        const next = new Set(prev);
                        next.has(f) ? next.delete(f) : next.add(f);
                        return next;
                      })} />
                      {f}
                    </label>
                  ))}
                </div>
              </div>
            )}

            {/* Dashboard — full-picture overview: applicants, sponsors, mentors, apprentices */}
            <div className="mb-8">
              <div className="font-display text-lg font-semibold mb-4">Program dashboard</div>
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-px mb-4 border" style={{ borderColor: 'var(--gic-line)', background: 'var(--gic-line)' }}>
                <Stat label="Applicants (total)" value={analytics.pipeline.total} />
                <Stat label="Submitted — awaiting review" value={analytics.pipeline.submitted} />
                <Stat label="Approved" value={analytics.pipeline.approved} />
                <Stat label="Closed" value={analytics.pipeline.closed} />
              </div>
              <div className="grid lg:grid-cols-2 gap-4">
                <div className="gic-card p-4">
                  <div className="eyebrow mb-3">Sponsors &amp; seats</div>
                  {analytics.sponsorSummary.length === 0 ? (
                    <div className="text-sm py-2" style={{ color: 'var(--gic-muted)' }}>No sponsors yet.</div>
                  ) : (
                    <div className="space-y-2">
                      {analytics.sponsorSummary.map(s => (
                        <div key={s.id} className="flex items-center justify-between text-sm">
                          <span className="truncate">{s.name}</span>
                          <span style={{ color: 'var(--gic-muted)' }}>
                            {s.seatsTotal != null ? `${s.seatsUsed}/${s.seatsTotal} seats` : `${s.seatsUsed} seats used · unlimited`}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div className="gic-card p-4">
                  <div className="eyebrow mb-3">Mentor caseload</div>
                  {analytics.mentorSummary.length === 0 ? (
                    <div className="text-sm py-2" style={{ color: 'var(--gic-muted)' }}>No mentors assigned yet.</div>
                  ) : (
                    <div className="space-y-2">
                      {analytics.mentorSummary.map(m => (
                        <div key={m.id} className="flex items-center justify-between text-sm">
                          <span className="truncate">{m.name}</span>
                          <span style={{ color: 'var(--gic-muted)' }}>{m.count} apprentice{m.count === 1 ? '' : 's'}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Filters */}
            <div className="gic-card p-4 mb-6 grid md:grid-cols-5 gap-3">
              <div>
                <label className="eyebrow block mb-1" style={{ fontSize: 9 }}>County</label>
                <select className="gic-input text-sm" value={analyticsFilters.county} onChange={e => setAnalyticsFilters(f => ({ ...f, county: e.target.value }))}>
                  <option value="">All</option>
                  {Array.from(new Set(analytics.rows.map(r => r.county).filter(Boolean))).sort().map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <label className="eyebrow block mb-1" style={{ fontSize: 9 }}>Sponsor</label>
                <select className="gic-input text-sm" value={analyticsFilters.sponsorId} onChange={e => setAnalyticsFilters(f => ({ ...f, sponsorId: e.target.value }))}>
                  <option value="">All</option>
                  {Array.from(new Map(analytics.rows.filter(r => r.employer_sponsor_id).map(r => [r.employer_sponsor_id, r.sponsorName])).entries())
                    .map(([id, name]) => <option key={id} value={id}>{name || id}</option>)}
                </select>
              </div>
              <div>
                <label className="eyebrow block mb-1" style={{ fontSize: 9 }}>Age range</label>
                <div className="flex items-center gap-1">
                  <input type="number" className="gic-input text-sm" placeholder="Min" value={analyticsFilters.ageMin} onChange={e => setAnalyticsFilters(f => ({ ...f, ageMin: e.target.value }))} />
                  <input type="number" className="gic-input text-sm" placeholder="Max" value={analyticsFilters.ageMax} onChange={e => setAnalyticsFilters(f => ({ ...f, ageMax: e.target.value }))} />
                </div>
              </div>
              <div>
                <label className="eyebrow block mb-1" style={{ fontSize: 9 }}>Progress % range</label>
                <div className="flex items-center gap-1">
                  <input type="number" className="gic-input text-sm" placeholder="Min" value={analyticsFilters.progressMin} onChange={e => setAnalyticsFilters(f => ({ ...f, progressMin: e.target.value }))} />
                  <input type="number" className="gic-input text-sm" placeholder="Max" value={analyticsFilters.progressMax} onChange={e => setAnalyticsFilters(f => ({ ...f, progressMax: e.target.value }))} />
                </div>
              </div>
              <div className="flex items-end">
                <button onClick={() => setAnalyticsFilters({ county: '', sponsorId: '', ageMin: '', ageMax: '', progressMin: '', progressMax: '' })}
                  className="btn-ghost text-sm">Clear filters</button>
              </div>
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-px mb-8 border" style={{ borderColor: 'var(--gic-line)', background: 'var(--gic-line)' }}>
              <Stat label="Shown" value={analyticsFiltered.length} />
              <Stat label="Avg Completion" value={
                analyticsFiltered.length
                  ? Math.round(analyticsFiltered.reduce((s, r) => s + (r.completed / (analytics.approvedModules || 1)), 0) / analyticsFiltered.length * 100) + '%'
                  : '—'
              } />
              <Stat label="Fully Complete" value={analyticsFiltered.filter(r => r.completed >= analytics.approvedModules && analytics.approvedModules > 0).length} />
              <Stat label="Not Started" value={analyticsFiltered.filter(r => r.completed === 0 && r.inProgress === 0).length} />
            </div>

            <div className="gic-card divide-y" style={{ borderColor: 'var(--gic-line)' }}>
              <div className="grid grid-cols-12 px-5 py-2.5 text-xs font-semibold items-center" style={{ color: 'var(--gic-muted)' }}>
                <div className="col-span-1"></div>
                <div className="col-span-3">Apprentice</div>
                <div className="col-span-2 text-center">Progress</div>
                <div className="col-span-2 text-center">Quiz Avg</div>
                <div className="col-span-2 text-center">Logins</div>
                <div className="col-span-2 text-right">Last Active</div>
              </div>
              {analyticsFiltered.sort((a,b) => b.completed - a.completed).map(r => {

      {reviewingRegistrant && (

          profile={profile}

    </main>
  );

// RECORDER MODAL — video capture + upload to DO Spaces
// ============================================================
function RecorderModal({ module: mod, profile, onClose, onSubmitted }) {
  const [stage, setStage] = useState('ready'); // ready | recording | preview | uploading | done | error
  const [stream, setStream] = useState(null);
  const [recorder, setRecorder] = useState(null);
  const [chunks, setChunks] = useState([]);
  const [blob, setBlob] = useState(null);
  const [previewUrl, setPreviewUrl] = useState(null);
  const [duration, setDuration] = useState(0);
  const [notes, setNotes] = useState('');
  const [error, setError] = useState('');
  const [uploadPct, setUploadPct] = useState(0);
  const [camPerm, setCamPerm] = useState('unknown'); // unknown | granted | prompt | denied
  const videoRef = useRef(null);
  const timerRef = useRef(null);
  const startedAtRef = useRef(0);

  // Check camera permission state without requesting access
  useEffect(() => {
    if (!navigator.permissions) return;
    navigator.permissions.query({ name: 'camera' }).then(result => {
      setCamPerm(result.state);
      result.onchange = () => setCamPerm(result.state);
    }).catch(() => {});
  }, []);

  // Hook camera up to preview <video>
  useEffect(() => {
    if (stream && videoRef.current) {
      videoRef.current.srcObject = stream;
    }
  }, [stream]);

  // Cleanup
  useEffect(() => () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    if (timerRef.current) clearInterval(timerRef.current);
  }, []);

  const startCamera = async () => {
    setError('');
    if (!navigator.mediaDevices?.getUserMedia) {
      setError('Camera recording is not supported in this browser. Try Chrome or Edge.');
      return;
    }
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: true
      });
      setStream(s);
      setCamPerm('granted');
    } catch (e) {
      if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
        setCamPerm('denied');
        setError('Camera access was blocked. To fix: click the camera icon in your browser address bar and allow access, then refresh this page.');
      } else if (e.name === 'NotFoundError') {
        setError('No camera or microphone found. Please connect a device and try again.');
      } else {
        setError('Could not start camera: ' + (e.message || e.name));
      }
    }
  };

  const startRecording = () => {
    if (!stream) return;
    const mimeCandidates = [
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
      'video/mp4'
    ];
    const mime = mimeCandidates.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
    const r = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1_500_000 });
    const buf = [];
    r.ondataavailable = (e) => { if (e.data && e.data.size > 0) buf.push(e.data); };
    r.onstop = () => {
      const b = new Blob(buf, { type: mime });
      setBlob(b);
      setPreviewUrl(URL.createObjectURL(b));
      setChunks(buf);
      setStage('preview');
      if (stream) stream.getTracks().forEach(t => t.stop());
      setStream(null);
      if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
    };
    setRecorder(r);
    setStage('recording');
    startedAtRef.current = Date.now();
    setDuration(0);
    timerRef.current = setInterval(() => {
      setDuration(Math.floor((Date.now() - startedAtRef.current) / 1000));
    }, 250);
    r.start(1000);
  };

  const stopRecording = () => {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  };

  const reset = () => {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    setBlob(null);
    setPreviewUrl(null);
    setChunks([]);
    setDuration(0);
    setStage('ready');
  };

  const upload = async () => {
    if (!blob) return;
    setStage('uploading');
    setError('');
    setUploadPct(0);
    try {
      const ext  = blob.type.includes('mp4') ? 'mp4' : 'webm';
      const fn   = `module${mod.module_number}-${Date.now()}.${ext}`;
      const { uploadUrl, key } = await callFn('sign-upload', {
        filename:    fn,
        contentType: blob.type,
        moduleId:    mod.id
      });

      // PUT to DO Spaces with XHR for progress reporting
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', uploadUrl);
        xhr.setRequestHeader('Content-Type', blob.type);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) setUploadPct(Math.round((e.loaded / e.total) * 100));
        };
        xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error(`Upload failed (${xhr.status})`));
        xhr.onerror = () => reject(new Error('Upload network error'));
        xhr.send(blob);
      });

      // Insert submission record
      const { data, error: dbErr } = await supabase
        .from('competency_submissions')
        .insert({
          apprentice_id:    profile.id,
          module_id:        mod.id,
          video_path:       key,
          video_mime:       blob.type,
          duration_seconds: duration,
          size_bytes:       blob.size,
          apprentice_notes: notes.trim() || null,
          status:           'submitted'
        })
        .select()
        .single();
      if (dbErr) throw dbErr;
      setStage('done');
      onSubmitted && onSubmitted(data);
    } catch (e) {
      setError(e.message || 'Upload failed');
      setStage('error');
    }
  };

  const fmtTime = (s) => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.6)', backdropFilter: 'blur(6px)' }}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div className="p-6 border-b flex items-center justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1">Module {String(mod.module_number).padStart(2, '0')} · OJL Submission</div>
            <div className="font-display text-xl font-semibold">{mod.title}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>

        <div className="p-6">
          {stage === 'ready' && (
            <div className="space-y-5">
              <p className="text-sm leading-relaxed" style={{ color: 'var(--gic-muted)' }}>
                Record a short video (target: 2–10 minutes) demonstrating the competency. Show the work — a mock client conversation, a walk-through of an analysis, or a portfolio review. Your mentor will review and sign off on OJL hours.
              </p>
              <div className="p-4 rounded-lg" style={{ background: 'var(--gic-bone)' }}>
                <div className="text-xs font-semibold mb-1">Before you start:</div>
                <ul className="text-xs space-y-1" style={{ color: 'var(--gic-muted)' }}>
                  <li>· Find a quiet, well-lit space</li>
                  <li>· Do not use real client data — use anonymized or fictional scenarios</li>
                  <li>· Keep recordings under 30 minutes</li>
                </ul>
              </div>
              {camPerm === 'denied' && !stream && (
                <div className="p-4 rounded-lg border-l-4" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)' }}>
                  <div className="flex items-start gap-2 mb-2">
                    <AlertCircle size={16} className="flex-shrink-0 mt-0.5" style={{ color: 'var(--gic-rose)' }}/>
                    <div className="text-sm font-semibold" style={{ color: 'var(--gic-rose)' }}>Camera access is blocked</div>
                  </div>
                  <div className="text-sm ml-6" style={{ color: 'var(--gic-ink)' }}>
                    To record a submission:
                    <ol className="mt-1 space-y-0.5 list-decimal list-inside" style={{ color: 'var(--gic-muted)' }}>
                      <li>Click the camera/lock icon in your browser address bar</li>
                      <li>Set Camera and Microphone to <strong>Allow</strong></li>
                      <li>Reload this page and try again</li>
                    </ol>
                  </div>
                </div>
              )}
              {!stream && camPerm !== 'denied' ? (
                <div className="space-y-3">
                  <button onClick={startCamera} className="btn-primary w-full flex items-center justify-center gap-2">
                    <Video size={16}/> Enable camera & microphone
                  </button>
                  <div className="flex items-center gap-3">
                    <div className="flex-1 border-t" style={{ borderColor: 'var(--gic-line)' }}/>
                    <span className="text-xs" style={{ color: 'var(--gic-warm)' }}>or</span>
                    <div className="flex-1 border-t" style={{ borderColor: 'var(--gic-line)' }}/>
                  </div>
                  <label className="btn-secondary w-full flex items-center justify-center gap-2 cursor-pointer">
                    <Upload size={15}/> Upload a video file
                    <input type="file" accept="video/*" className="sr-only" onChange={e => {
                      const file = e.target.files?.[0];
                      if (!file) return;
                      if (file.size > 500 * 1024 * 1024) { setError('File too large. Maximum 500 MB.'); return; }
                      setBlob(file);
                      setPreviewUrl(URL.createObjectURL(file));
                      setDuration(0);
                      setStage('preview');
                    }}/>
                  </label>
                  <p className="text-xs text-center" style={{ color: 'var(--gic-warm)' }}>Mobile users: record in your camera app then upload here</p>
                </div>
              ) : stream ? (
                <>
                  <div className="aspect-video rounded-lg overflow-hidden bg-stone-900">
                    <video ref={videoRef} autoPlay muted playsInline className="w-full h-full object-cover" />
                  </div>
                  <button onClick={startRecording} className="btn-primary w-full flex items-center justify-center gap-2">
                    <Mic size={16}/> Start recording
                  </button>
                </>
              ) : null}
              {error && (
                <div className="text-sm p-3 border-l-2 flex items-start gap-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                  <AlertCircle size={16} className="flex-shrink-0 mt-0.5"/>
                  <span>{error}</span>
                </div>
              )}
            </div>
          )}

          {stage === 'recording' && (
            <div className="space-y-5">
              <div className="aspect-video rounded-lg overflow-hidden bg-stone-900 relative">
                <video ref={videoRef} autoPlay muted playsInline className="w-full h-full object-cover" />
                <div className="absolute top-4 left-4 flex items-center gap-2 px-3 py-1.5 rounded-full" style={{ background: 'rgba(184,61,92,0.95)' }}>
                  <div className="w-2 h-2 rounded-full bg-white animate-pulse" />
                  <span className="text-xs font-mono font-semibold text-white">REC {fmtTime(duration)}</span>
                </div>
              </div>
              <button onClick={stopRecording} className="btn-primary w-full flex items-center justify-center gap-2" style={{ background: 'var(--gic-rose)' }}>
                <Square size={14}/> Stop recording
              </button>
            </div>
          )}

          {stage === 'preview' && previewUrl && (
            <div className="space-y-5">
              <div className="aspect-video rounded-lg overflow-hidden bg-stone-900">
                <video src={previewUrl} controls className="w-full h-full"/>
              </div>
              <div>
                <label className="eyebrow block mb-2">Notes for your mentor</label>
                <textarea
                  className="gic-input min-h-[100px] resize-y"
                  placeholder="What did you demonstrate? What scenario? Anything you want feedback on?"
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  maxLength={2000}
                />
                <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>
                  {notes.length}/2000 · Duration {fmtTime(duration)} · {(blob.size / (1024*1024)).toFixed(1)} MB
                </div>
              </div>
              <div className="flex gap-3">
                <button onClick={reset} className="btn-secondary flex-1 flex items-center justify-center gap-2">
                  <RotateCcw size={14}/> Re-record
                </button>
                <button onClick={upload} className="btn-primary flex-1 flex items-center justify-center gap-2">
                  <Upload size={14}/> Submit for review
                </button>
              </div>
            </div>
          )}

          {stage === 'uploading' && (
            <div className="space-y-5 py-8 text-center">
              <Loader2 size={32} className="animate-spin mx-auto" style={{ color: 'var(--gic-blue)' }}/>
              <div className="font-display text-xl font-semibold">Uploading…</div>
              <div className="w-full max-w-sm mx-auto h-2 rounded-full overflow-hidden" style={{ background: 'var(--gic-line)' }}>
                <div className="h-full transition-all duration-300" style={{ width: `${uploadPct}%`, background: 'var(--gic-blue)' }}/>
              </div>
              <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>{uploadPct}%</div>
            </div>
          )}

          {stage === 'done' && (
            <div className="space-y-4 py-8 text-center">
              <div className="w-16 h-16 mx-auto rounded-full flex items-center justify-center" style={{ background: 'rgba(31,122,74,0.1)' }}>
                <CheckCircle2 size={32} style={{ color: 'var(--gic-green)' }}/>
              </div>
              <div className="font-display text-xl font-semibold">Submitted for review</div>
              <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                Your mentor has been notified. You'll see feedback here once reviewed.
              </p>
              <button onClick={onClose} className="btn-primary">Done</button>
            </div>
          )}

          {stage === 'error' && (
            <div className="space-y-4 py-4">
              <div className="text-sm p-3 border-l-2 flex items-start gap-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                <AlertCircle size={16} className="flex-shrink-0 mt-0.5"/>
                <span>{error}</span>
              </div>
              <button onClick={() => setStage('preview')} className="btn-primary w-full">Try again</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// SUBMISSION VIEWER — apprentice or mentor views one submission
// ============================================================
function SubmissionViewer({ submission, mod, profile, onClose, onUpdated }) {
  const [videoUrl, setVideoUrl] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]   = useState('');
  const [feedback, setFeedback] = useState(submission.mentor_feedback || '');
  const [hours, setHours]   = useState(submission.ojl_hours_credited || mod?.ojl_hours || 0);
  const [saving, setSaving] = useState(false);

  const canReview = profile?.role === 'mentor' || profile?.role === 'admin' || profile?.role === 'approver';

  useEffect(() => {
    (async () => {
      try {
        const { url } = await callFn('sign-read', { submissionId: submission.id });
        setVideoUrl(url);
      } catch (e) {
        setError(e.message || 'Could not load video');
      } finally {
        setLoading(false);
      }
    })();
  }, [submission.id]);

  const decide = async (status) => {
    setSaving(true);
    try {
      const updates = {
        status,
        mentor_feedback: feedback.trim() || null,
        mentor_id: profile.id,
        reviewed_at: new Date().toISOString(),
        ojl_hours_credited: status === 'approved' ? Number(hours) || 0 : 0,
        updated_at: new Date().toISOString()
      };
      const { data, error: e } = await supabase
        .from('competency_submissions')
        .update(updates)
        .eq('id', submission.id)
        .select()
        .single();
      if (e) throw e;
      onUpdated && onUpdated(data);
      // Email the apprentice
      const { data: app } = await supabase.from('profiles').select('email').eq('id', submission.apprentice_id).maybeSingle();
      if (app?.email) {
        callFn('send-notification', {
          type: 'submission_reviewed',
          to: app.email,
          data: { module: mod?.title || 'Module', status, hours: Number(hours) || 0, feedback: feedback.trim() }
        }).catch(() => {});
      }
      onClose();
    } catch (e) {
      setError(e.message || 'Update failed');
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.6)', backdropFilter: 'blur(6px)' }}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
        <div className="p-6 border-b flex items-center justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1">
              {mod ? `Module ${String(mod.module_number).padStart(2,'0')} · ` : ''}Submission
            </div>
            <div className="font-display text-xl font-semibold">{mod?.title || 'Apprentice submission'}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>

        <div className="p-6 space-y-5">
          <div className="aspect-video rounded-lg overflow-hidden bg-stone-900">
            {loading
              ? <div className="w-full h-full flex items-center justify-center text-stone-400"><Loader2 className="animate-spin"/></div>
              : videoUrl
                ? <video src={videoUrl} controls className="w-full h-full"/>
                : <div className="w-full h-full flex items-center justify-center text-stone-400 text-sm">{error || 'Video unavailable'}</div>
            }
          </div>

          <div className="grid grid-cols-3 gap-4 text-center text-sm">
            <div>
              <div className="eyebrow mb-1">Status</div>
              <div className="font-medium" style={{
                color: submission.status === 'approved' ? 'var(--gic-green)'
                     : submission.status === 'needs_revision' ? 'var(--gic-rose)'
                     : 'var(--gic-blue)'
              }}>
                {submission.status.replace('_', ' ')}
              </div>
            </div>
            <div>
              <div className="eyebrow mb-1">Submitted</div>
              <div>{fmtRelative(submission.submitted_at)}</div>
            </div>
            <div>
              <div className="eyebrow mb-1">Duration</div>
              <div>{Math.floor((submission.duration_seconds||0)/60)}m {(submission.duration_seconds||0)%60}s</div>
            </div>
          </div>

          {submission.apprentice_notes && (
            <div>
              <div className="eyebrow mb-2">Apprentice notes</div>
              <div className="text-sm leading-relaxed p-3 rounded-lg whitespace-pre-wrap" style={{ background: 'var(--gic-bone)' }}>
                {submission.apprentice_notes}
              </div>
            </div>
          )}

          {submission.mentor_feedback && !canReview && (
            <div>
              <div className="eyebrow mb-2">Mentor feedback</div>
              <div className="text-sm leading-relaxed p-3 rounded-lg whitespace-pre-wrap" style={{ background: 'rgba(31,122,74,0.05)' }}>
                {submission.mentor_feedback}
              </div>
              {submission.status === 'approved' && submission.ojl_hours_credited > 0 && (
                <div className="text-xs mt-2 flex items-center gap-1" style={{ color: 'var(--gic-green)' }}>
                  <CheckCircle2 size={12}/> {submission.ojl_hours_credited} OJL hours credited
                </div>
              )}
            </div>
          )}

          {canReview && submission.status !== 'approved' && (
            <div className="border-t pt-5" style={{ borderColor: 'var(--gic-line)' }}>
              <div className="eyebrow mb-3">Mentor review</div>
              <textarea
                className="gic-input min-h-[100px] resize-y mb-3"
                placeholder="What was strong? What should they refine? Be specific."
                value={feedback}
                onChange={e => setFeedback(e.target.value)}
                maxLength={3000}
              />
              <div className="flex items-center gap-3 mb-4">
                <label className="eyebrow">OJL hours to credit</label>
                <input
                  type="number"
                  step="0.25"
                  min="0"
                  max={mod?.ojl_hours || 24}
                  className="gic-input w-24"
                  value={hours}
                  onChange={e => setHours(e.target.value)}
                />
                <span className="text-xs" style={{ color: 'var(--gic-muted)' }}>
                  of {mod?.ojl_hours || '—'}h required
                </span>
              </div>
              {error && (
                <div className="text-sm p-3 border-l-2 mb-3" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                  {error}
                </div>
              )}
              <div className="flex gap-3">
                <button onClick={() => decide('needs_revision')} disabled={saving}
                        className="btn-secondary flex-1 flex items-center justify-center gap-2"
                        style={{ borderColor: 'var(--gic-rose)', color: 'var(--gic-rose)' }}>
                  <RotateCcw size={14}/> Request revision
                </button>
                <button onClick={() => decide('approved')} disabled={saving}
                        className="btn-primary flex-1 flex items-center justify-center gap-2"
                        style={{ background: 'var(--gic-green)' }}>
                  {saving ? <Loader2 size={14} className="animate-spin"/> : <Check size={14}/>} Approve & credit
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// COACH DRAWER — AI study coach sidebar
// ============================================================
function CoachDrawer({ open, onClose, profile, lessonContext, moduleTitle }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, busy]);

  const send = async (text) => {
    const q = (text || input).trim();
    if (!q || busy) return;
    setError('');
    const history = messages.map(m => ({ role: m.role, content: m.content }));
    setMessages(prev => [...prev, { role: 'user', content: q }]);
    setInput('');
    setBusy(true);
    try {
      const { answer } = await callFn('ai-coach', {
        question: q,
        lessonContext: lessonContext || '',
        apprenticeName: profile?.full_name || '',
        history
      });
      setMessages(prev => [...prev, { role: 'assistant', content: answer }]);
    } catch (e) {
      setError(e.message || 'Coach unavailable');
    } finally {
      setBusy(false);
    }
  };

  if (!open) return null;

  const quickPrompts = [
    'Explain this in plain English.',
    'Give me a real-world example.',
    'Quiz me on this — one question.',
    'Compare this with what we did last lesson.'
  ];

  return (
    <>
      <div className="fixed inset-0 z-40" style={{ background: 'rgba(15,22,49,0.4)', backdropFilter: 'blur(2px)' }} onClick={onClose}/>
      <div className="fixed top-0 right-0 bottom-0 z-50 w-full sm:w-[420px] bg-white shadow-2xl flex flex-col animate-fade-in">
        <div className="p-5 border-b flex items-start justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1 flex items-center gap-1.5"><Sparkles size={11}/> Study Coach</div>
            <div className="font-display text-lg font-semibold leading-tight">
              {moduleTitle || 'Ask anything about your lesson'}
            </div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={16}/></button>
        </div>

        <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 space-y-4">
          {messages.length === 0 && (
            <div className="text-sm leading-relaxed" style={{ color: 'var(--gic-muted)' }}>
              <p className="mb-4">
                I'm your study coach — I'll explain concepts, give examples, and quiz you. I'm not a financial advisor, just a learning tool.
              </p>
              <div className="space-y-2">
                {quickPrompts.map((p, i) => (
                  <button key={i} onClick={() => send(p)}
                          className="w-full text-left text-sm p-3 rounded-lg border hover:bg-stone-50 transition-colors"
                          style={{ borderColor: 'var(--gic-line)' }}>
                    {p}
                  </button>
                ))}
              </div>
            </div>
          )}

          {messages.map((m, i) => (
            <div key={i} className={m.role === 'user' ? 'flex justify-end' : 'flex justify-start'}>
              <div className={'max-w-[85%] p-3 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ' +
                (m.role === 'user' ? 'text-white' : '')}
                style={m.role === 'user'
                  ? { background: 'var(--gic-blue)' }
                  : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
                {m.content}
              </div>
            </div>
          ))}
          {busy && (
            <div className="flex justify-start">
              <div className="p-3 rounded-2xl text-sm flex items-center gap-2" style={{ background: 'var(--gic-bone)', color: 'var(--gic-muted)' }}>
                <Loader2 size={14} className="animate-spin"/> Thinking…
              </div>
            </div>
          )}
          {error && (
            <div className="text-sm p-3 border-l-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
              {error}
            </div>
          )}
        </div>

        <div className="p-4 border-t" style={{ borderColor: 'var(--gic-line)' }}>
          <form onSubmit={e => { e.preventDefault(); send(); }} className="flex gap-2">
            <input
              type="text"
              className="gic-input flex-1"
              placeholder="Ask about this lesson…"
              value={input}
              onChange={e => setInput(e.target.value)}
              disabled={busy}
            />
            <button type="submit" disabled={busy || !input.trim()} className="btn-primary px-3">
              <Send size={16}/>
            </button>
          </form>
          <div className="text-[10px] mt-2 leading-relaxed" style={{ color: 'var(--gic-warm)' }}>
            Coach is for learning support, not financial advice. Always verify against approved curriculum.
          </div>
        </div>
      </div>
    </>
  );
}

// MENTOR DASHBOARD — lists submissions to review + questions tab
// ============================================================
function MentorDashboard({ profile, modules, onViewSubmission }) {
  const [activeTab, setActiveTab] = useState('submissions'); // submissions | questions | waivers | certificates
  const [allCerts, setAllCerts] = useState([]);
  const [certsLoading, setCertsLoading] = useState(false);
  const [viewingCert, setViewingCert] = useState(null);
  const [submissions, setSubmissions] = useState([]);
  const [profilesById, setProfilesById] = useState({});
  const [filter, setFilter] = useState('pending'); // pending | all
  const [loading, setLoading] = useState(true);
  // Questions tab state
  const [questions, setQuestions] = useState([]);
  const [questionsLoading, setQuestionsLoading] = useState(false);
  const [answerTexts, setAnswerTexts] = useState({}); // question_id -> text
  const [answerSending, setAnswerSending] = useState({}); // question_id -> bool
  const [qProfilesById, setQProfilesById] = useState({});
  const [answersById, setAnswersById] = useState({}); // question_id -> answer[]
  const [openThreadId, setOpenThreadId] = useState(null); // expanded question id
  // Waivers tab state
  const [waivers, setWaivers] = useState([]);
  const [waiversLoading, setWaiversLoading] = useState(false);
  const [waiverProfilesById, setWaiverProfilesById] = useState({});
  const [waiverNotes, setWaiverNotes] = useState({});
  const [waiverDeciding, setWaiverDeciding] = useState({});

  useEffect(() => {
    if (!profile) return;
    let mounted = true;
    (async () => {
      // Mentor sees: submissions where they're the assigned mentor OR
      // submissions from apprentices whose mentor_id === their id.
      // Admin/approver sees all.
      let q = supabase.from('competency_submissions').select('*').order('submitted_at', { ascending: false });
      const { data: subs } = await q;
      if (!mounted) return;

      let visible = subs || [];
      if (profile.role === 'mentor') {
        const { data: mentees } = await supabase.from('profiles').select('id').eq('mentor_id', profile.id);
        const menteeIds = new Set((mentees || []).map(m => m.id));
        visible = visible.filter(s => menteeIds.has(s.apprentice_id) || s.mentor_id === profile.id);
      }
      setSubmissions(visible);

      // Fetch apprentice profiles for display
      const ids = Array.from(new Set(visible.map(s => s.apprentice_id)));
      if (ids.length > 0) {
        const { data: pp } = await supabase.from('profiles').select('id,full_name,email').in('id', ids);
        const map = {}; (pp || []).forEach(p => { map[p.id] = p; });
        setProfilesById(map);
      }
      setLoading(false);
    })();

    const channel = supabase
      .channel('submissions-mentor')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'competency_submissions' }, payload => {
        if (payload.eventType === 'INSERT') setSubmissions(prev => [payload.new, ...prev]);
        else if (payload.eventType === 'UPDATE') setSubmissions(prev => prev.map(s => s.id === payload.new.id ? payload.new : s));
      })
      .subscribe();

    return () => { mounted = false; supabase.removeChannel(channel); };
  }, [profile?.id, profile?.role]);

  // Load certificates when tab becomes active
  useEffect(() => {
    if (activeTab !== 'certificates' || !supabase) return;
    setCertsLoading(true);
    supabase.from('certificates').select('*').order('issued_at', { ascending: false })
      .then(({ data }) => { setAllCerts(data || []); setCertsLoading(false); });
  }, [activeTab]);

  // Load questions when tab becomes active
  useEffect(() => {
    if (activeTab !== 'questions' || !supabase) return;
    let mounted = true;
    setQuestionsLoading(true);
    (async () => {
      const { data: qs } = await supabase
        .from('questions')
        .select('*')
        .order('created_at', { ascending: false });
      if (!mounted) return;
      setQuestions(qs || []);
      const qIds = (qs || []).map(q => q.id);
      // Fetch asker profiles and all existing answers in parallel
      const [profileRes, answerRes] = await Promise.all([
        supabase.from('profiles').select('id,full_name,email').in('id', Array.from(new Set((qs||[]).map(q => q.asker_id)))),
        qIds.length ? supabase.from('question_answers').select('*').in('question_id', qIds).order('created_at', { ascending: true }) : { data: [] }
      ]);
      if (!mounted) return;
      const pmap = {}; (profileRes.data||[]).forEach(p => { pmap[p.id] = p; });
      setQProfilesById(pmap);
      const amap = {}; (answerRes.data||[]).forEach(a => { if (!amap[a.question_id]) amap[a.question_id] = []; amap[a.question_id].push(a); });
      setAnswersById(amap);
      if (mounted) setQuestionsLoading(false);
    })();
    return () => { mounted = false; };
  }, [activeTab]);

  const sendAnswer = async (q) => {
    const text = (answerTexts[q.id] || '').trim();
    if (!text || !supabase) return;
    setAnswerSending(prev => ({ ...prev, [q.id]: true }));
    const { data: newAnswer, error } = await supabase.from('question_answers').insert({
      question_id: q.id,
      responder_id: profile.id,
      responder_name: profile.full_name || profile.email || 'Mentor',
      answer_text: text
    }).select().single();
    if (!error) {
      await supabase.from('questions').update({ status: 'resolved', updated_at: new Date().toISOString() }).eq('id', q.id);
      setQuestions(prev => prev.map(x => x.id === q.id ? { ...x, status: 'resolved' } : x));
      setAnswerTexts(prev => ({ ...prev, [q.id]: '' }));
      if (newAnswer) setAnswersById(prev => ({ ...prev, [q.id]: [...(prev[q.id] || []), newAnswer] }));
      // Email the apprentice
      const asker = qProfilesById[q.asker_id];
      if (asker?.email) {
        callFn('send-notification', {
          type: 'question_answered',
          to: asker.email,
          data: { question: q.question_text, answer: text, responder: profile.full_name || profile.email }
        }).catch(() => {});
      }
    }
    setAnswerSending(prev => ({ ...prev, [q.id]: false }));
  };

  const markResolved = async (q) => {
    if (!supabase) return;
    await supabase.from('questions').update({ status: 'resolved', updated_at: new Date().toISOString() }).eq('id', q.id);
    setQuestions(prev => prev.map(x => x.id === q.id ? { ...x, status: 'resolved' } : x));
  };

  // Load waivers when tab active
  useEffect(() => {
    if (activeTab !== 'waivers' || !supabase) return;
    let mounted = true;
    setWaiversLoading(true);
    (async () => {
      const { data: ws } = await supabase.from('prerequisite_waivers').select('*').order('created_at', { ascending: false });
      if (!mounted) return;
      setWaivers(ws || []);
      const ids = Array.from(new Set((ws||[]).map(w => w.apprentice_id)));
      if (ids.length) {
        const { data: pp } = await supabase.from('profiles').select('id,full_name,email').in('id', ids);
        const map = {}; (pp||[]).forEach(p => { map[p.id] = p; });
        if (mounted) setWaiverProfilesById(map);
      }
      if (mounted) setWaiversLoading(false);
    })();
    return () => { mounted = false; };
  }, [activeTab]);

  const decideWaiver = async (w, status) => {
    setWaiverDeciding(prev => ({ ...prev, [w.id]: true }));
    const note = waiverNotes[w.id] || '';
    const { data, error } = await supabase.from('prerequisite_waivers').update({
      status,
      reviewer_note: note || null,
      reviewed_by: profile.id,
      reviewed_at: new Date().toISOString()
    }).eq('id', w.id).select().single();
    if (!error && data) {
      setWaivers(prev => prev.map(x => x.id === w.id ? data : x));
      // Email apprentice
      const apprentice = waiverProfilesById[w.apprentice_id];
      const mod = modules.find(m => m.id === w.module_id);
      if (apprentice?.email) {
        callFn('send-notification', {
          type: 'waiver_decided',
          to: apprentice.email,
          data: { module: mod?.title || 'Module', status, note }
        }).catch(() => {});
      }
    }
    setWaiverDeciding(prev => ({ ...prev, [w.id]: false }));
  };

  const grantExamAccess = async (q) => {
    if (!supabase) return;
    if (!confirm(`Grant early exam access to this apprentice?`)) return;
    const { error } = await supabase.from('profiles').update({ exam_early_access: true }).eq('id', q.asker_id);
    if (error) { alert('Failed: ' + error.message); return; }
    const noteText = (answerTexts[q.id] || '').trim() ||
      'Your request has been approved. You now have early access to the final exam. Good luck!';
    await supabase.from('question_answers').insert({
      question_id: q.id,
      responder_id: profile.id,
      responder_name: profile.full_name || profile.email || 'Mentor',
      answer_text: noteText
    });
    await supabase.from('questions').update({ status: 'resolved', updated_at: new Date().toISOString() }).eq('id', q.id);
    setQuestions(prev => prev.map(x => x.id === q.id ? { ...x, status: 'resolved' } : x));
    setAnswerTexts(prev => ({ ...prev, [q.id]: '' }));
  };

  const pending = submissions.filter(s => s.status === 'submitted' || s.status === 'under_review');
  const display = filter === 'pending' ? pending : submissions;

  if (loading) return <LoadingScreen/>;

  return (
    <main className="max-w-6xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <div className="eyebrow mb-3">Mentor Review</div>
      <h1 className="font-display text-4xl font-semibold mb-2">Apprentice submissions</h1>

      </p>

      {/* Tab bar */}
      <div className="flex gap-1 mb-8 border-b" style={{ borderColor: 'var(--gic-line)' }}>
        {[['submissions','Submissions'],['questions','Questions'],['waivers','Waivers'],['certificates','Certificates']].map(([id,label]) => (
          <button key={id} onClick={() => setActiveTab(id)}

            style={{ borderBottom: activeTab===id ? '2px solid var(--gic-blue)' : '2px solid transparent',
                     color: activeTab===id ? 'var(--gic-blue)' : 'var(--gic-muted)', marginBottom: '-1px' }}>
            {label}
            {id==='submissions' && pending.length > 0 && (
              <span className="ml-2 text-xs font-bold" style={{ color: 'var(--gic-amber)' }}>{pending.length}</span>

            {id==='questions' && questions.filter(q=>q.status==='open').length > 0 && (
              <span className="ml-2 text-xs font-bold" style={{ color: 'var(--gic-amber)' }}>{questions.filter(q=>q.status==='open').length}</span>
            )}
            {id==='waivers' && waivers.filter(w=>w.status==='pending').length > 0 && (
              <span className="ml-2 text-xs font-bold" style={{ color: 'var(--gic-amber)' }}>{waivers.filter(w=>w.status==='pending').length}</span>
            )}
          </button>
        ))}
      </div>

      {activeTab === 'submissions' && <>
        <div className="flex items-center gap-2 mb-6">
          <button onClick={() => setFilter('pending')}
                  className={'px-4 py-2 rounded-full text-sm font-medium ' + (filter === 'pending' ? 'text-white' : '')}
                  style={filter === 'pending' ? { background: 'var(--gic-blue)' } : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
            Pending review ({pending.length})
          </button>
          <button onClick={() => setFilter('all')}
                  className={'px-4 py-2 rounded-full text-sm font-medium ' + (filter === 'all' ? 'text-white' : '')}
                  style={filter === 'all' ? { background: 'var(--gic-blue)' } : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
            All ({submissions.length})
          </button>
        </div>

        {display.length === 0 ? (
          <div className="gic-card p-12 text-center">
            <ClipboardCheck size={28} className="mx-auto mb-4" style={{ color: 'var(--gic-warm)' }}/>
            <div className="font-display text-xl font-semibold mb-2">
              {filter === 'pending' ? 'Nothing pending' : 'No submissions yet'}

              {filter === 'pending'

            </p>

        ) : (
          <div className="space-y-3">
            {display.map(s => {

              return (

                                </div>
                                <span className="text-xs font-semibold" style={{ color: 'var(--gic-green)' }}>{a.responder_name || 'Mentor'}</span>

                              </div>
                              <div className="text-sm leading-relaxed">{a.answer_text}</div>
                            </div>
                          ))}
