                      )}

                      {/* Exam access grant button */}
                      {q.lesson_title === 'Exam Access Request' && q.status === 'open' && (
                        <div className="p-3 rounded-lg flex items-center justify-between" style={{ background: 'rgba(45,31,177,0.04)', border: '1px solid rgba(45,31,177,0.12)' }}>
                          <div className="text-sm" style={{ color: 'var(--gic-ink)' }}>
                            Grant early exam access to <strong>{asker?.full_name || asker?.email || 'this apprentice'}</strong>?
                          </div>
                          <button onClick={() => grantExamAccess(q)} className="btn-primary flex items-center gap-1.5 text-sm ml-4 flex-shrink-0">
                            <Award size={13}/> Grant access
                          </button>
                        </div>
                      )}

                      {/* Reply box — always visible when thread is open */}
                      <div>
                        <div className="eyebrow mb-2">{qAnswers.length > 0 ? 'Add a follow-up' : 'Write a response'}</div>
                        <textarea
                          value={answerTexts[q.id] || ''}
                          onChange={e => setAnswerTexts(prev => ({ ...prev, [q.id]: e.target.value }))}
                          placeholder="Type your response here…"
                          rows={3}
                          className="w-full border rounded-lg p-3 text-sm mb-3 resize-none"
                          style={{ borderColor: 'var(--gic-line)' }}
                        />
                        <div className="flex items-center gap-2">
                          <button onClick={() => sendAnswer(q)}
                            disabled={!(answerTexts[q.id]||'').trim() || answerSending[q.id]}
                            className="btn-primary flex items-center gap-2 text-sm">
                            <Send size={13}/>{answerSending[q.id] ? 'Sending…' : 'Send response'}
                          </button>
                          {q.status === 'open' && (
                            <button onClick={() => markResolved(q)} className="btn-ghost text-sm" style={{ color: 'var(--gic-muted)' }}>
                              Mark resolved
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </>}

      {activeTab === 'waivers' && (
        waiversLoading ? <LoadingScreen /> : waivers.length === 0 ? (
          <div className="gic-card p-12 text-center">
            <Lock size={28} className="mx-auto mb-4" style={{ color: 'var(--gic-warm)' }}/>
            <div className="font-display text-xl font-semibold mb-2">No waiver requests</div>
            <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>When apprentices request to skip a prerequisite, their requests appear here.</p>

        ) : (
          <div className="space-y-4">
            {waivers.map(w => {
              const apprentice = waiverProfilesById[w.apprentice_id];
              const mod = modules.find(m => m.id === w.module_id);
              return (
                <div key={w.id} className="gic-card p-6">
                  <div className="flex items-start justify-between gap-4 mb-3">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        {apprentice && <span className="text-sm font-semibold">{apprentice.full_name || apprentice.email}</span>}
                        <span className="eyebrow">{mod ? `Module ${String(mod.module_number).padStart(2,'0')} · ${mod.title}` : 'Unknown module'}</span>
                      </div>
                      <div className="text-xs" style={{ color: 'var(--gic-warm)' }}>{fmtRelative(w.created_at)}</div>
                    </div>
                    <span className="badge flex-shrink-0"
                      style={w.status === 'approved' ? { color: 'var(--gic-green)', background: 'rgba(31,122,74,0.08)' }
                           : w.status === 'denied'   ? { color: 'var(--gic-rose)',  background: 'rgba(184,61,92,0.08)' }
                           : { color: 'var(--gic-amber)', background: 'rgba(200,132,28,0.08)' }}>
                      {w.status === 'approved' ? 'Approved' : w.status === 'denied' ? 'Denied' : 'Pending'}
                    </span>
                  </div>
                  {w.reason && (
                    <div className="mb-3 p-3 rounded-lg text-sm" style={{ background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
                      <div className="eyebrow mb-1">Their reason</div>
                      {w.reason}
                    </div>
                  )}
                  {w.status === 'pending' && (
                    <div className="mt-3 pt-3 border-t" style={{ borderColor: 'var(--gic-line)' }}>
                      <textarea
                        value={waiverNotes[w.id] || ''}
                        onChange={e => setWaiverNotes(prev => ({ ...prev, [w.id]: e.target.value }))}
                        placeholder="Optional note to apprentice…"
                        rows={2}
                        className="w-full border rounded-lg p-3 text-sm mb-3 resize-none"
                        style={{ borderColor: 'var(--gic-line)' }}
                      />
                      <div className="flex gap-2">
                        <button onClick={() => decideWaiver(w, 'denied')} disabled={waiverDeciding[w.id]}
                          className="btn-secondary flex items-center gap-1.5 text-sm"
                          style={{ borderColor: 'var(--gic-rose)', color: 'var(--gic-rose)' }}>
                          <X size={13}/> Deny
                        </button>
                        <button onClick={() => decideWaiver(w, 'approved')} disabled={waiverDeciding[w.id]}
                          className="btn-primary flex items-center gap-1.5 text-sm"
                          style={{ background: 'var(--gic-green)' }}>
                          <Check size={13}/> Approve jump-ahead
                        </button>
                      </div>
                    </div>
                  )}
                  {w.reviewer_note && w.status !== 'pending' && (
                    <div className="mt-2 text-xs" style={{ color: 'var(--gic-muted)' }}>Note sent: {w.reviewer_note}</div>
                  )}
                </div>
              );
            })}
          </div>
        )
      )}
    </main>
  );
}

// REGISTRANT REVIEW — admin review panel for a single application

const CATHY_EMAIL = 'cathy@globalinvestmentcompanies.com';

function regFormatVal(v) {
  if (v === null || v === undefined || v === '') return '—';
  if (v === true) return 'Yes';
  if (v === false) return 'No';
  if (Array.isArray(v)) return v.length ? v.join(', ') : '—';
  return String(v);
}

function RegRow({ label, value }) {
  const [copied, setCopied] = useState(false);
  const display = regFormatVal(value);
  const copyable = display !== '—';
  const doCopy = () => {
    navigator.clipboard.writeText(display);
    setCopied(true);
    setTimeout(() => setCopied(false), 1200);
  };
  return (
    <div className="flex justify-between items-center gap-3 py-1.5 text-sm">
      <span style={{ color: 'var(--gic-muted)' }}>{label}</span>
      <span className="flex items-center gap-2 text-right">
        <span>{display}</span>
        {copyable && (
          <button type="button" onClick={doCopy} title="Copy for RAPIDS" className="flex-shrink-0"
            style={{ color: copied ? 'var(--gic-green)' : 'var(--gic-muted)' }}>
            {copied ? <Check size={12}/> : <Copy size={12}/>}
          </button>
        )}
      </span>
    </div>
  );
}

function RegSection({ title, children }) {
  return (
    <div className="mb-6">
      <div className="eyebrow mb-2">{title}</div>
      <div className="divide-y" style={{ borderColor: 'var(--gic-line)' }}>{children}</div>
    </div>
  );
}

function RegistrantReview({ registrant, sponsors, setSponsors, mentors, profile, onClose, onUpdated, onDeleted }) {
  const defaultMentorId = registrant.mentor_id || mentors.find(m => m.email === CATHY_EMAIL)?.id || '';
  const [mentorId, setMentorIdState] = useState(defaultMentorId);
  const [tokenText, setTokenText] = useState('');
  const [showSponsorForm, setShowSponsorForm] = useState(false);
  const [seatsExceededSponsor, setSeatsExceededSponsor] = useState(null);
  const [seatCounts, setSeatCounts] = useState({});
  const [generating, setGenerating] = useState(false);
  const [copied, setCopied] = useState(false);
  const [showCloseForm, setShowCloseForm] = useState(false);
  const [showEmailTemplate, setShowEmailTemplate] = useState(false);
  const [closeReason, setCloseReason] = useState('');
  const [closing, setClosing] = useState(false);
  const [approving, setApproving] = useState(false);
  const mountedRef = useRef(false);

  useEffect(() => {
    if (!registrant.sponsor_token_id) { setTokenText(''); return; }
    supabase.from('sponsorship_tokens').select('token').eq('id', registrant.sponsor_token_id).maybeSingle()
      .then(({ data }) => { if (data) setTokenText(data.token); });
  }, [registrant.sponsor_token_id]);

  useEffect(() => {
    supabase.from('registrants').select('sponsor_id').not('sponsor_token_id', 'is', null).neq('status', 'closed')
      .then(({ data }) => {
        const counts = {};
        (data || []).forEach(r => { if (r.sponsor_id) counts[r.sponsor_id] = (counts[r.sponsor_id] || 0) + 1; });
        setSeatCounts(counts);
      });
  }, [registrant.sponsor_id, registrant.sponsor_token_id]);

  // Pre-select Cathy as mentor the first time this application is opened, so
  // it's visibly the default without requiring an extra click.
  useEffect(() => {
    if (mountedRef.current) return;
    mountedRef.current = true;
    if (!registrant.mentor_id && defaultMentorId) {
      supabase.from('registrants').update({ mentor_id: defaultMentorId }).eq('id', registrant.id)
        .select().single().then(({ data }) => { if (data) onUpdated(data); });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const saveMentor = async (id) => {
    setMentorIdState(id);
    const { data, error } = await supabase.from('registrants').update({ mentor_id: id || null }).eq('id', registrant.id).select().single();
    if (!error && data) onUpdated(data);
  };

  const saveSponsor = async (id) => {
    const { data, error } = await supabase.from('registrants').update({ sponsor_id: id || null }).eq('id', registrant.id).select().single();
    if (!error && data) onUpdated(data);
  };

  const addSponsor = async (form) => {
    const { data, error } = await supabase.from('employer_sponsors').insert({ ...form, created_by: profile.id }).select().single();
    if (error) { alert('Failed: ' + error.message); return; }
    setSponsors(prev => [data, ...prev]);
    setShowSponsorForm(false);
    saveSponsor(data.id);
  };

  const generateCode = async (sponsorOverride) => {
    const sponsor = sponsorOverride || sponsors.find(s => s.id === registrant.sponsor_id);
    if (!sponsor) return;
    setGenerating(true);
    if (sponsor.seats_total != null && (seatCounts[sponsor.id] || 0) >= sponsor.seats_total) {
      setGenerating(false);
      setSeatsExceededSponsor(sponsor);
      return;
    }
    const rand = () => Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4).padEnd(4, 'X');
    const token = `GIC-${rand()}-${rand()}`;
    const { data: tok, error: tokErr } = await supabase.from('sponsorship_tokens').insert({
      token, employer_sponsor_id: sponsor.id, max_uses: 1, registrant_id: registrant.id, created_by: profile.id
    }).select().single();
    if (tokErr) { setGenerating(false); alert('Failed to generate code: ' + tokErr.message); return; }
    const { data: reg, error: regErr } = await supabase.from('registrants')
      .update({ sponsor_id: sponsor.id, sponsor_token_id: tok.id }).eq('id', registrant.id).select().single();
    setGenerating(false);
    if (regErr) { alert('Code created but failed to link: ' + regErr.message); return; }
    setTokenText(tok.token);
    setSeatCounts(prev => ({ ...prev, [sponsor.id]: (prev[sponsor.id] || 0) + 1 }));
    onUpdated(reg);
  };

  const addSeatsAndRetry = async (extra) => {
    if (!seatsExceededSponsor || !extra) return;
    const newTotal = (seatsExceededSponsor.seats_total || 0) + extra;
    const { data, error } = await supabase.from('employer_sponsors').update({ seats_total: newTotal }).eq('id', seatsExceededSponsor.id).select().single();
    if (error) { alert('Failed: ' + error.message); return; }
    setSponsors(prev => prev.map(s => s.id === data.id ? data : s));
    setSeatsExceededSponsor(null);
    generateCode(data);
  };

  const copyCode = () => {
    navigator.clipboard.writeText(tokenText);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  const canApprove = !!registrant.sponsor_id && !!registrant.sponsor_token_id && !!registrant.mentor_id && registrant.status !== 'approved';

  const approve = async () => {
    setApproving(true);
    const { data, error } = await supabase.from('registrants').update({
      status: 'approved', reviewed_by: profile.id, reviewed_at: new Date().toISOString()
    }).eq('id', registrant.id).select().single();
    setApproving(false);
    if (error) { alert('Failed: ' + error.message); return; }
    onUpdated(data);
  };

  const doClose = async () => {
    setClosing(true);
    const { data, error } = await supabase.from('registrants').update({
      status: 'closed', closed_reason: closeReason.trim() || null, reviewed_by: profile.id, reviewed_at: new Date().toISOString()
    }).eq('id', registrant.id).select().single();
    setClosing(false);
    if (error) { alert('Failed: ' + error.message); return; }
    setShowCloseForm(false);
    onUpdated(data);
  };

  const eligibilityDocsChecked = ELIGIBILITY_DOCS_LIST.filter(([k]) => registrant.eligibility_docs?.[k]).map(([,l]) => l);
  const supportNeeds = [
    ['support_childcare','Childcare'],['support_transportation','Transportation'],['support_tutoring','Tutoring'],
    ['support_mental_health','Mental health support'],['support_tech_access','Technology access']
  ].filter(([k]) => registrant[k]).map(([,l]) => l);

  return (
    <>
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.6)', backdropFilter: 'blur(6px)' }}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] overflow-hidden flex flex-col">
        <div className="p-5 border-b flex items-center justify-between flex-shrink-0" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1">Application · {registrant.status}</div>
            <div className="font-display text-xl font-semibold">{registrant.full_name}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>

        <div className="flex-1 min-h-0 grid lg:grid-cols-[1fr_340px]">
          {/* Application detail — scrolls independently of the action panel */}
          <div className="p-6 border-r overflow-y-auto" style={{ borderColor: 'var(--gic-line)' }}>
            <RegSection title="Personal">
              <RegRow label="Full name" value={registrant.full_name} />
              <RegRow label="Date of birth" value={registrant.dob} />
              <RegRow label="Email" value={registrant.email} />
              <RegRow label="Phone" value={registrant.phone} />
              <RegRow label="Address" value={[registrant.address, registrant.city, registrant.state, registrant.zip].filter(Boolean).join(', ')} />
              <RegRow label="County" value={registrant.county} />
              <RegRow label="Emergency contact" value={registrant.emergency_contact_name} />
              <RegRow label="Emergency contact phone" value={registrant.emergency_contact_phone} />
            </RegSection>

            <RegSection title="Eligibility">
              <RegRow label="16 years or older" value={registrant.age_16_plus} />
              <RegRow label="Eligible to work in the U.S." value={registrant.work_eligible_us} />
              <RegRow label="Can attend training + work hours" value={registrant.can_attend_training} />
              <RegRow label="Reliable transportation" value={registrant.reliable_transportation} />
              <RegRow label="Willing to complete OJT hours" value={registrant.willing_ojt} />
            </RegSection>

            <RegSection title="Education">
              <RegRow label="Highest level completed" value={registrant.education_level} />
              <RegRow label="School" value={registrant.school_name} />
              <RegRow label="Graduation year" value={registrant.graduation_year} />
              <RegRow label="Other" value={registrant.education_other} />
            </RegSection>

            <RegSection title="Wealth planning experience">
              <RegRow label="Years of experience" value={registrant.experience_years} />
              <RegRow label="Experience level" value={registrant.experience_level} />
              <RegRow label="Explanation" value={registrant.experience_explain} />
              <RegRow label="Budgeting" value={registrant.exp_budgeting} />
              <RegRow label="Credit repair / building" value={registrant.exp_credit} />
              <RegRow label="Debt management" value={registrant.exp_debt} />
              <RegRow label="Banking / investment institutions" value={registrant.exp_banking} />
              <RegRow label="Customer service / client interaction" value={registrant.exp_customer_service} />
            </RegSection>

            <RegSection title="Employment history">
              <RegRow label="Current employer" value={registrant.current_employer} />
              <RegRow label="Current position" value={registrant.current_position} />
              <RegRow label="Current dates" value={registrant.current_employment_dates} />
              <RegRow label="Previous employer" value={registrant.previous_employer} />
              <RegRow label="Previous position" value={registrant.previous_position} />
              <RegRow label="Previous dates" value={registrant.previous_employment_dates} />
            </RegSection>

            <RegSection title="Career goals">
              <RegRow label="Why interested" value={registrant.goal_why} />
              <RegRow label="Skills hoped to gain" value={registrant.goal_skills} />
              <RegRow label="Long-term goals" value={registrant.goal_longterm} />
            </RegSection>

            <RegSection title="Skills self-rating (1–5)">
              {SKILLS_LIST.map(([key, label]) => (
                <RegRow key={key} label={label} value={registrant.skills?.[key] ? `${registrant.skills[key]}/5` : null} />
              ))}
            </RegSection>

            <RegSection title="Client interaction">
              <RegRow label="Helped someone with financial decisions" value={registrant.helped_financial_decisions} />
              <RegRow label="Explanation" value={registrant.helped_financial_decisions_explain} />
              <RegRow label="Comfortable with diverse communities" value={registrant.comfortable_diverse_communities} />
              <RegRow label="Comfortable with sensitive topics" value={registrant.comfortable_sensitive_topics} />
            </RegSection>

            <RegSection title="Training, documents & supportive services">
              <RegRow label="Workshops/trainings completed" value={registrant.workshops_completed} />
              <RegRow label="Eligibility documents ready" value={eligibilityDocsChecked} />
              <RegRow label="Supportive services needed" value={supportNeeds} />
              <RegRow label="Other support needed" value={registrant.support_other} />
            </RegSection>

            <RegSection title="Demographics (optional, DOL reporting)">
              <RegRow label="Sex" value={registrant.sex} />
              <RegRow label="Ethnicity" value={registrant.ethnicity} />
              <RegRow label="Race" value={registrant.race} />
              <RegRow label="Disability" value={registrant.disability} />
              <RegRow label="Veteran status" value={registrant.veteran_status} />
              <RegRow label="Education level (DOL)" value={registrant.education_level_dol} />
              <RegRow label="Employment status" value={registrant.employment_status} />
              <RegRow label="Completed pre-apprenticeship program" value={registrant.pre_apprenticeship_program} />
            </RegSection>

            <RegSection title="Commitment agreement">
              <RegRow label="Agreed" value={registrant.agreed_to_commitment} />
              <RegRow label="Signature" value={registrant.signature_name} />
              <RegRow label="Signed at" value={registrant.signed_at ? new Date(registrant.signed_at).toLocaleString() : null} />
            </RegSection>
          </div>

          {/* Admin action panel — scrolls independently, stays usable while the left side is read */}
          <div className="p-6 space-y-6 overflow-y-auto">
            <div>
              <label className="eyebrow block mb-2">Sponsor</label>
              <select className="gic-input mb-2" value={registrant.sponsor_id || ''}
                onChange={e => saveSponsor(e.target.value)} disabled={registrant.status === 'closed'}>
                <option value="">— Select sponsor —</option>
                {sponsors.map(s => (
                  <option key={s.id} value={s.id}>
                    {s.name} {s.seats_total != null ? `(${seatCounts[s.id] || 0}/${s.seats_total} seats used)` : ''}
                  </option>
                ))}
              </select>
              <button onClick={() => setShowSponsorForm(true)} className="btn-ghost text-xs flex items-center gap-1" style={{ color: 'var(--gic-blue)' }}>
                <Plus size={12}/> Add sponsor
              </button>
            </div>

            <div>
              <label className="eyebrow block mb-2">Sponsor code</label>
              {tokenText ? (
                <>
                  <div className="flex items-center justify-between text-sm p-2.5 rounded-lg border mb-2" style={{ borderColor: 'var(--gic-line)' }}>
                    <code className="font-mono">{tokenText}</code>
                    <button onClick={copyCode} className="btn-ghost flex items-center gap-1 text-xs">
                      {copied ? <><Check size={12}/> Copied</> : <><Copy size={12}/> Copy</>}
                    </button>
                  </div>
                  <button onClick={() => setShowEmailTemplate(true)} className="btn-secondary w-full flex items-center justify-center gap-2 text-sm">
                    <Mail size={14}/> Email applicant their code
                  </button>
                </>
              ) : (
                <button onClick={() => generateCode()} disabled={!registrant.sponsor_id || generating || registrant.status === 'closed'}
                  className="btn-secondary w-full flex items-center justify-center gap-2 disabled:opacity-40">
                  {generating ? <Loader2 size={14} className="animate-spin"/> : <KeySquare size={14}/>}
                  {generating ? 'Generating…' : 'Generate code'}
                </button>
              )}
            </div>

            <div>
              <label className="eyebrow block mb-2">Mentor</label>
              <select className="gic-input" value={mentorId} onChange={e => saveMentor(e.target.value)} disabled={registrant.status === 'closed'}>
                <option value="">— No mentor assigned —</option>
                {mentors.map(m => (
                  <option key={m.id} value={m.id}>{m.full_name || m.email}{m.email === CATHY_EMAIL ? ' (default)' : ''}</option>
                ))}
              </select>
            </div>

            <div className="border-t pt-5 space-y-2" style={{ borderColor: 'var(--gic-line)' }}>
              {registrant.status === 'submitted' && (
                <>
                  <button onClick={approve} disabled={!canApprove || approving} className="btn-primary w-full flex items-center justify-center gap-2 disabled:opacity-40">
                    {approving ? <Loader2 size={14} className="animate-spin"/> : <CheckCircle2 size={14}/>} Approve
                  </button>
                  {!canApprove && (
                    <div className="text-xs" style={{ color: 'var(--gic-warm)' }}>Assign a sponsor, generate a code, and assign a mentor before approving.</div>
                  )}
                  {!showCloseForm ? (
                    <button onClick={() => setShowCloseForm(true)} className="btn-ghost w-full text-sm" style={{ color: 'var(--gic-rose)' }}>Close application</button>
                  ) : (
                    <div className="space-y-2 pt-2">
                      <textarea className="gic-input min-h-[60px] text-sm" placeholder="Reason (optional)" value={closeReason} onChange={e => setCloseReason(e.target.value)} />
                      <div className="flex gap-2">
                        <button onClick={doClose} disabled={closing} className="btn-secondary flex-1 text-sm">{closing ? 'Closing…' : 'Confirm close'}</button>
                        <button onClick={() => setShowCloseForm(false)} className="btn-ghost flex-1 text-sm">Cancel</button>
                      </div>
                    </div>
                  )}
                </>
              )}
              {registrant.status === 'approved' && (
                <div className="text-sm p-3 rounded-lg" style={{ background: 'rgba(31,122,74,0.06)', color: 'var(--gic-green)' }}>
                  Approved {registrant.reviewed_at ? new Date(registrant.reviewed_at).toLocaleDateString() : ''}.
                  {registrant.activated_profile_id ? ' Account activated.' : ' Awaiting code redemption.'}
                </div>
              )}
              {registrant.status === 'closed' && (
                <div className="text-sm p-3 rounded-lg" style={{ background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                  Closed{registrant.closed_reason ? `: ${registrant.closed_reason}` : '.'}
                </div>
              )}
              {onDeleted && (
                <button onClick={() => { if (confirm(`Permanently delete ${registrant.full_name}'s application? This cannot be undone.`)) onDeleted(registrant.id); }}
                  className="btn-ghost w-full flex items-center justify-center gap-2 text-sm mt-2" style={{ color: 'var(--gic-rose)' }}>
                  <Trash2 size={13}/> Delete application
                </button>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>

    {showSponsorForm && (
      <SponsorForm onSave={addSponsor} onClose={() => setShowSponsorForm(false)} />
    )}
    {seatsExceededSponsor && (
      <SeatsExceededModal
        sponsor={seatsExceededSponsor}
        onAddSeats={addSeatsAndRetry}
        onChooseDifferent={() => setSeatsExceededSponsor(null)}
        onCancel={() => setSeatsExceededSponsor(null)}
      />
    )}
    {showEmailTemplate && (
      <EmailTemplateModal
        registrant={registrant}
        tokenText={tokenText}
        sponsorName={sponsors.find(s => s.id === registrant.sponsor_id)?.name}
        onClose={() => setShowEmailTemplate(false)}
      />
    )}
    </>
  );
}

// EMAIL TEMPLATE MODAL — editable, copy-to-clipboard activation email
// ============================================================
function EmailTemplateModal({ registrant, tokenText, sponsorName, onClose }) {
  const defaultSubject = 'Your GIC Apprenticeship enrollment code';
  const defaultBody = `Hi ${registrant.full_name || ''},

Congratulations — your application to the Wealth Solutions Counselor Apprenticeship Program has been approved${sponsorName ? ` and sponsored by ${sponsorName}` : ''}.

To finish setting up your account:
1. Go to https://gic-apprentice.netlify.app/
2. Click "Have a sponsorship code?"
3. Enter this code: ${tokenText || ''}
4. Enter your email and create a password

Welcome aboard!
GIC Apprenticeship Team`;

  const [subject, setSubject] = useState(defaultSubject);
  const [body, setBody] = useState(defaultBody);
  const [copiedField, setCopiedField] = useState(null);

  const copy = (text, field) => {
    navigator.clipboard.writeText(text);
    setCopiedField(field);
    setTimeout(() => setCopiedField(null), 1500);
  };

  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.6)', backdropFilter: 'blur(6px)' }}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div className="p-5 border-b flex items-center justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1">Email template</div>
            <div className="font-display text-lg font-semibold">{registrant.email}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={16}/></button>
        </div>
        <div className="p-5 space-y-4">
          <p className="text-xs" style={{ color: 'var(--gic-muted)' }}>
            Edit anything below if you'd like, then copy it into your own email client and send.
          </p>

          <div>
            <label className="eyebrow block mb-2">To</label>
            <div className="flex items-center justify-between text-sm p-2.5 rounded-lg border" style={{ borderColor: 'var(--gic-line)' }}>
              <span>{registrant.email}</span>
              <button onClick={() => copy(registrant.email, 'to')} className="btn-ghost flex items-center gap-1 text-xs">
                {copiedField === 'to' ? <><Check size={12}/> Copied</> : <><Copy size={12}/> Copy</>}
              </button>
            </div>
          </div>

          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="eyebrow">Subject</label>
              <button onClick={() => copy(subject, 'subject')} className="btn-ghost flex items-center gap-1 text-xs">
                {copiedField === 'subject' ? <><Check size={12}/> Copied</> : <><Copy size={12}/> Copy</>}
              </button>
            </div>
            <input className="gic-input" value={subject} onChange={e => setSubject(e.target.value)} />
          </div>

          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="eyebrow">Message</label>
              <button onClick={() => copy(body, 'body')} className="btn-ghost flex items-center gap-1 text-xs">
                {copiedField === 'body' ? <><Check size={12}/> Copied</> : <><Copy size={12}/> Copy</>}
              </button>
            </div>
            <textarea className="gic-input min-h-[260px] font-mono text-xs leading-relaxed" value={body} onChange={e => setBody(e.target.value)} />
          </div>

          <button onClick={() => copy(`Subject: ${subject}\n\n${body}`, 'all')} className="btn-primary w-full flex items-center justify-center gap-2 text-sm">
            {copiedField === 'all' ? <><Check size={14}/> Copied subject + message</> : <><Copy size={14}/> Copy subject + message</>}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// APPRENTICE PROFILE MODAL — admin read-only view (Analytics "view profile")
// ============================================================
function ApprenticeProfileModal({ profileId, onClose }) {
  const [loading, setLoading] = useState(true);
  const [profileRow, setProfileRow] = useState(null);
  const [registrant, setRegistrant] = useState(null);
  const [progressRows, setProgressRows] = useState([]);
  const [submissions, setSubmissions] = useState([]);
  const [loginCount, setLoginCount] = useState(0);
  const [lessonTimes, setLessonTimes] = useState([]);

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [{ data: p }, { data: reg }, { data: prog }, { data: subs }, { count }, { data: reads }, { data: mods }] = await Promise.all([
        supabase.from('profiles').select('*').eq('id', profileId).maybeSingle(),
        supabase.from('registrants').select('*').eq('activated_profile_id', profileId).maybeSingle(),
        supabase.from('module_progress').select('module_number,status,best_quiz_score,quiz_attempts').eq('user_id', profileId).order('module_number'),
        supabase.from('competency_submissions').select('id,status,mentor_feedback,submitted_at,ojl_hours_credited').eq('apprentice_id', profileId).order('submitted_at', { ascending: false }),
        supabase.from('login_events').select('id', { count: 'exact', head: true }).eq('user_id', profileId),
        supabase.from('lesson_reads').select('module_id,lesson_index,seconds_spent').eq('user_id', profileId).gt('seconds_spent', 0),
        supabase.from('modules').select('id,module_number,title,content')
      ]);
      if (!mounted) return;
      setProfileRow(p || null);
      setRegistrant(reg || null);
      setProgressRows(prog || []);
      setSubmissions(subs || []);
      setLoginCount(count || 0);

      const modById = {}; (mods || []).forEach(m => { modById[m.id] = m; });
      const times = (reads || []).map(r => {
        const mod = modById[r.module_id];
        const lessonTitle = mod?.content?.lessons?.[r.lesson_index]?.title || `Lesson ${r.lesson_index + 1}`;
        return {
          key: `${r.module_id}-${r.lesson_index}`,
          moduleLabel: mod ? `Module ${mod.module_number} — ${mod.title}` : 'Unknown module',
          lessonTitle,
          moduleNumber: mod?.module_number ?? 999,
          lessonIndex: r.lesson_index,
          seconds: r.seconds_spent
        };
      }).sort((a, b) => a.moduleNumber - b.moduleNumber || a.lessonIndex - b.lessonIndex);
      setLessonTimes(times);
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, [profileId]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.6)', backdropFilter: 'blur(6px)' }}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
        <div className="p-5 border-b flex items-center justify-between sticky top-0 bg-white" style={{ borderColor: 'var(--gic-line)' }}>
          <div className="font-display text-lg font-semibold">{profileRow?.full_name || 'Apprentice profile'}</div>
          <button onClick={onClose} className="btn-ghost"><X size={16}/></button>
        </div>
        {loading ? (
          <div className="p-16"><LoadingScreen/></div>
        ) : (
          <div className="p-6">
            <RegSection title="Account">
              <RegRow label="Email" value={profileRow?.email} />
              <RegRow label="Enrolled" value={profileRow?.created_at ? new Date(profileRow.created_at).toLocaleDateString() : null} />
              <RegRow label="Logins" value={loginCount} />
              <RegRow label="Last active" value={profileRow?.last_active_at ? fmtRelative(profileRow.last_active_at) : null} />
            </RegSection>

// ============================================================
// SPONSORS ADMIN — manage employer sponsors + tokens
// ============================================================
function SponsorsAdmin({ profile }) {
  const [sponsors, setSponsors] = useState([]);
  const [tokens, setTokens]     = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showSponsorForm, setShowSponsorForm] = useState(false);
  const [showTokenForm, setShowTokenForm]     = useState(null); // sponsor object
  const [copiedId, setCopiedId] = useState(null);

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [{ data: s }, { data: t }] = await Promise.all([
        supabase.from('employer_sponsors').select('*').order('created_at', { ascending: false }),
        supabase.from('sponsorship_tokens').select('*').order('created_at', { ascending: false })
      ]);
      if (!mounted) return;
      setSponsors(s || []);
      setTokens(t || []);
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, []);

  const addSponsor = async (form) => {
    const { data, error } = await supabase
      .from('employer_sponsors')
      .insert({ ...form, created_by: profile.id })
      .select()
      .single();
    if (error) { alert('Failed: ' + error.message); return; }
    setSponsors(prev => [data, ...prev]);
    setShowSponsorForm(false);
  };

  const addToken = async (sponsor, form) => {
    // Generate token: GIC-XXXX-XXXX (random base32)
    const rand = () => Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4).padEnd(4, 'X');
    const token = `GIC-${rand()}-${rand()}`;
    const { data, error } = await supabase
      .from('sponsorship_tokens')
      .insert({
        token,
        employer_sponsor_id: sponsor.id,
        max_uses: form.max_uses,
        expires_at: form.expires_at || null,
        created_by: profile.id
      })
      .select()
      .single();
    if (error) { alert('Failed: ' + error.message); return; }
    setTokens(prev => [data, ...prev]);
    setShowTokenForm(null);
  };

  const copyToken = (t) => {
    navigator.clipboard.writeText(t.token);
    setCopiedId(t.id);
    setTimeout(() => setCopiedId(null), 1500);
  };

  const deleteSponsor = async (sponsor) => {
    // Deleting a sponsor cascade-deletes its sponsorship_tokens — including any
    // code already issued to an approved applicant who hasn't activated yet.
    // That would silently brick their code with no way for them to know why,
    // so block the delete outright if any such applicant exists.
    const [{ count: pendingCount }, { count: activeCount }] = await Promise.all([
      supabase.from('registrants').select('id', { count: 'exact', head: true })
        .eq('sponsor_id', sponsor.id).eq('status', 'approved').is('activated_profile_id', null),
      supabase.from('profiles').select('id', { count: 'exact', head: true })
        .eq('employer_sponsor_id', sponsor.id)
    ]);

    if (pendingCount > 0) {
      alert(`Can't delete "${sponsor.name}" — ${pendingCount} approved applicant${pendingCount === 1 ? ' has' : 's have'} an unredeemed sponsorship code tied to this sponsor. Deleting it would destroy ${pendingCount === 1 ? 'that code' : 'those codes'} and lock ${pendingCount === 1 ? 'them' : 'them'} out of activating.\n\nReassign ${pendingCount === 1 ? 'that applicant' : 'those applicants'} to a different sponsor in the Registrants tab first, then delete.`);
      return;
    }

    const activeWarning = activeCount > 0
      ? ` ${activeCount} already-active apprentice${activeCount === 1 ? '' : 's'} will lose the sponsor label on their profile (their account and access are unaffected).`
      : '';
    if (!confirm(`Delete sponsor "${sponsor.name}"? This also removes its enrollment codes.${activeWarning} This cannot be undone.`)) return;

    const { error } = await supabase.from('employer_sponsors').delete().eq('id', sponsor.id);
    if (error) { alert('Delete failed: ' + error.message); return; }
    setSponsors(prev => prev.filter(s => s.id !== sponsor.id));
    setTokens(prev => prev.filter(t => t.employer_sponsor_id !== sponsor.id));
  };

  if (loading) return <LoadingScreen/>;

  return (
    <main className="max-w-6xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <div className="eyebrow mb-3">Administration</div>
      <h1 className="font-display text-4xl font-semibold mb-2">Employer sponsors</h1>
      <p className="text-base mb-10" style={{ color: 'var(--gic-muted)' }}>
        Manage sponsoring organizations and generate enrollment codes for their apprentices.
      </p>

      {/* Sponsors */}
      <div className="mb-12">
        <div className="flex items-center justify-between mb-5">
          <div className="font-display text-xl font-semibold">Sponsoring organizations</div>
          <button onClick={() => setShowSponsorForm(true)} className="btn-primary flex items-center gap-2">
            <Plus size={14}/> Add sponsor
          </button>
        </div>

        {sponsors.length === 0 ? (
          <div className="gic-card p-10 text-center text-sm" style={{ color: 'var(--gic-muted)' }}>
            No sponsors yet. Add the first organization to begin generating enrollment codes.
          </div>
        ) : (
          <div className="space-y-3">
            {sponsors.map(s => {
              const sponsorTokens = tokens.filter(t => t.employer_sponsor_id === s.id);
              return (
                <div key={s.id} className="gic-card p-5">
                  <div className="flex items-start justify-between mb-4">
                    <div>
                      <div className="font-display text-lg font-semibold">{s.name}</div>
                      <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                        {[s.contact_name, s.contact_email, s.contact_phone].filter(Boolean).join(' · ')}
                      </div>
                      {s.address && <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>{s.address}</div>}
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <button onClick={() => setShowTokenForm(s)} className="btn-secondary flex items-center gap-2 text-sm">
                        <KeySquare size={12}/> Generate code
                      </button>
                      <button onClick={() => deleteSponsor(s)}
                        className="btn-ghost" title="Delete sponsor" style={{ color: 'var(--gic-rose)' }}>
                        <Trash2 size={14}/>
                      </button>
                    </div>
                  </div>
                  {sponsorTokens.length > 0 && (
                    <div className="space-y-1.5 pt-3 border-t" style={{ borderColor: 'var(--gic-line)' }}>
                      {sponsorTokens.map(t => (
                        <div key={t.id} className="flex items-center justify-between text-sm py-1">
                          <code className="font-mono px-2 py-1 rounded" style={{ background: 'var(--gic-bone)' }}>{t.token}</code>
                          <div className="flex items-center gap-3 text-xs" style={{ color: 'var(--gic-muted)' }}>
                            <span>{t.uses}/{t.max_uses} used</span>
                            {t.expires_at && <span>· expires {new Date(t.expires_at).toLocaleDateString()}</span>}
                            <button onClick={() => copyToken(t)} className="btn-ghost flex items-center gap-1">
                              {copiedId === t.id ? <><Check size={12}/> Copied</> : <><Copy size={12}/> Copy</>}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showSponsorForm && (
        <SponsorForm onSave={addSponsor} onClose={() => setShowSponsorForm(false)}/>
      )}
      {showTokenForm && (
        <TokenForm sponsor={showTokenForm} onSave={(form) => addToken(showTokenForm, form)} onClose={() => setShowTokenForm(null)}/>
      )}
    </main>
  );
}

// SELECTION READER — floating "Read selection" button on highlight
// ============================================================
function SelectionReader() {
  const [selText, setSelText] = useState('');
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const [show, setShow] = useState(false);

  useEffect(() => {
    const onUp = () => {
      const sel = window.getSelection();
      const selected = sel?.toString().trim();
      if (selected && selected.length > 3) {
        try {
          const rect = sel.getRangeAt(0).getBoundingClientRect();
          setPos({ x: rect.left + rect.width / 2, y: rect.top + window.scrollY - 48 });
          setSelText(selected);
          setShow(true);
        } catch {}
      } else {
        setShow(false);
      }
    };
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
    return () => { document.removeEventListener('mouseup', onUp); document.removeEventListener('touchend', onUp); };
  }, []);

  if (!show) return null;
  return (
    <div style={{ position: 'absolute', left: pos.x, top: pos.y, transform: 'translateX(-50%)', zIndex: 999 }}>
      <button
        onClick={() => {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(selText), { rate: 1 }));
          setShow(false);
        }}
        onMouseDown={e => e.preventDefault()}
        className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-white shadow-lg"
        style={{ background: 'var(--gic-blue)', whiteSpace: 'nowrap' }}>
        <Headphones size={11}/> Read selection
      </button>
    </div>
  );
}

// ============================================================
// LESSON PLAYER — block-by-block TTS with controls
// ============================================================
function LessonPlayer({ blocks, activeBlock, setActiveBlock }) {
  const [open, setOpen]       = useState(false);
  const [playing, setPlaying] = useState(false);
  const [paused, setPaused]   = useState(false);
  const [rate, setRate]       = useState(1);
  const [words, setWords]     = useState([]);
  const [wordIdx, setWordIdx] = useState(-1);
  const synth = window.speechSynthesis;

  const blockText = useCallback((b) => {
    if (!b) return '';
    const clean = h => (h||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    switch (b.type) {
      case 'paragraph': case 'heading': case 'subheading': return clean(b.text);
      case 'list': case 'numbered': return (b.items||[]).map(clean).join('. ');
      case 'callout': return [b.title, clean(b.text)].filter(Boolean).join('. ');
      case 'glossary': return (b.terms||[]).map(t=>`${t.term}: ${t.definition}`).join('. ');
      case 'activity': return [b.title, b.prompt, ...(b.steps||[])].filter(Boolean).map(clean).join('. ');
      case 'case_study': return [b.title, b.scenario, b.discussion].filter(Boolean).map(clean).join('. ');
      default: return '';
    }
  }, []);

  const speakFrom = useCallback((startIdx, r) => {
    const spRate = r ?? rate;
    synth.cancel(); setPaused(false);
    let idx = startIdx;
    while (idx < blocks.length && !blockText(blocks[idx])) idx++;
    if (idx >= blocks.length) { setPlaying(false); setActiveBlock(-1); setWordIdx(-1); return; }
    setActiveBlock(idx);
    const text = blockText(blocks[idx]);
    const ws = text.split(/\s+/).filter(Boolean);
    setWords(ws); setWordIdx(0);
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = spRate;
    let wi = 0;
    utt.onboundary = e => { if (e.name === 'word') setWordIdx(wi++); };
    utt.onend = () => { setWordIdx(-1); speakFrom(idx + 1, spRate); };
    utt.onerror = () => { setPlaying(false); setWordIdx(-1); };
    setPlaying(true);
    synth.speak(utt);
    // Scroll active block into view
    setTimeout(() => document.getElementById(`tts-block-${idx}`)?.scrollIntoView({ behavior:'smooth', block:'center' }), 80);
  }, [blocks, rate, blockText]);

  const handlePlay   = () => paused ? (synth.resume(), setPlaying(true), setPaused(false)) : speakFrom(activeBlock >= 0 ? activeBlock : 0);
  const handlePause  = () => { synth.pause(); setPlaying(false); setPaused(true); };
  const handleStop   = () => { synth.cancel(); setPlaying(false); setPaused(false); setWordIdx(-1); setActiveBlock(-1); };
  const handlePrev   = () => speakFrom(Math.max(0, (activeBlock > 0 ? activeBlock : 0) - 1));
  const handleNext   = () => speakFrom((activeBlock >= 0 ? activeBlock : 0) + 1);
  const handleRate   = r  => { setRate(r); if (playing || paused) speakFrom(activeBlock >= 0 ? activeBlock : 0, r); };

  useEffect(() => () => synth.cancel(), []);

  const readable = blocks.filter(b => blockText(b)).length;

  if (!open) return (
    <button onClick={() => setOpen(true)}
      className="mb-6 flex items-center gap-2 text-sm font-medium px-4 py-2 rounded-full border transition hover:opacity-80"
      style={{ borderColor:'var(--gic-blue)', color:'var(--gic-blue)', background:'rgba(45,31,177,0.04)' }}>
      <Headphones size={14}/> Listen to this lesson
    </button>
  );

  return (
    <div className="mb-6 rounded-xl border overflow-hidden" style={{ borderColor:'var(--gic-blue)', background:'rgba(45,31,177,0.03)' }}>
      <div className="flex items-center gap-2 px-4 py-3">
        {/* Prev */}
        <button onClick={handlePrev} disabled={activeBlock <= 0} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-stone-100 disabled:opacity-30 transition">
          <SkipBack size={14}/>
        </button>
        {/* Play / Pause */}
        {playing
          ? <button onClick={handlePause} className="w-10 h-10 rounded-full flex items-center justify-center text-white flex-shrink-0" style={{ background:'var(--gic-blue)' }}><Pause size={16}/></button>
          : <button onClick={handlePlay}  className="w-10 h-10 rounded-full flex items-center justify-center text-white flex-shrink-0" style={{ background:'var(--gic-blue)' }}><Play  size={16}/></button>
        }
        {/* Next */}
        <button onClick={handleNext} disabled={activeBlock >= blocks.length - 1} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-stone-100 disabled:opacity-30 transition">
          <SkipForward size={14}/>
        </button>

        {/* Caption / status */}
        <div className="flex-1 min-w-0 ml-1">
          {playing && wordIdx >= 0 && words.length > 0 ? (
            <div className="text-xs leading-relaxed truncate" style={{ color:'var(--gic-ink)' }}>
              {words.slice(Math.max(0, wordIdx - 3), wordIdx + 8).map((w, i) => {
                const cur = Math.max(0, wordIdx - 3) + i === wordIdx;
                return <span key={i} style={cur ? { background:'rgba(45,31,177,0.2)', borderRadius:'3px', padding:'1px 3px', fontWeight:600 } : {}}>{w} </span>;
              })}
            </div>
          ) : (
            <div className="text-xs" style={{ color:'var(--gic-muted)' }}>
              {paused ? 'Paused — press play to continue' : `${readable} sections · Press play to listen`}
            </div>
          )}
        </div>

        {/* Block counter + speed + close */}
        <div className="flex items-center gap-2 flex-shrink-0">
          {activeBlock >= 0 && (
            <span className="text-xs font-mono" style={{ color:'var(--gic-warm)' }}>{activeBlock + 1}/{blocks.length}</span>
          )}
          <select value={rate} onChange={e => handleRate(parseFloat(e.target.value))}
            className="text-xs border rounded px-1.5 py-1" style={{ borderColor:'var(--gic-line)' }}>
            <option value={0.75}>0.75×</option>
            <option value={1}>1×</option>
            <option value={1.25}>1.25×</option>
            <option value={1.5}>1.5×</option>
            <option value={2}>2×</option>
          </select>
          <button onClick={() => { handleStop(); setOpen(false); }}
            className="w-6 h-6 flex items-center justify-center rounded hover:bg-stone-100" style={{ color:'var(--gic-muted)' }}>
            <X size={12}/>
          </button>
        </div>
      </div>

      {/* Block progress dots — click any to jump */}
      <div className="flex gap-1.5 px-4 pb-3 flex-wrap">
        {blocks.map((b, i) => {
          const has = !!blockText(b);
          const isActive = i === activeBlock;
          return (
            <button key={i} onClick={() => speakFrom(i)} title={b.title || b.type}
              style={{ width:8, height:8, borderRadius:'50%', flexShrink:0, transition:'all 0.2s',
                background: isActive ? 'var(--gic-blue)' : has ? 'var(--gic-line)' : 'rgba(0,0,0,0.06)',
                transform: isActive ? 'scale(1.4)' : 'scale(1)' }} />
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// ASK QUESTION BUTTON — submit a question from within a lesson
// ============================================================
function AskQuestionButton({ profile, moduleNumber, lessonIndex, lessonTitle }) {
  const [open, setOpen] = useState(false);
  const [text, setText] = useState('');
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);

  const submit = async () => {
    if (!text.trim() || !supabase) return;
    setSending(true);
    const { error } = await supabase.from('questions').insert({
      asker_id: profile.id,
      module_number: moduleNumber,
      lesson_index: lessonIndex,
      lesson_title: lessonTitle,
      question_text: text.trim()
    });
    setSending(false);
    if (!error) {
      setSent(true); setText(''); setTimeout(() => { setSent(false); setOpen(false); }, 2000);
      // Email mentor/admin
      callFn('send-notification', {
        type: 'new_question',
        to: 'admin@globalinvestmentcompanies.com',
        data: { apprentice: profile.full_name || profile.email, module: moduleNumber, lessonTitle, question: text.trim() }
      }).catch(() => {});
    }
  };

  return (
    <div className="mt-10 mb-6">
      <div className="gic-rule mb-6"><span className="font-display italic text-sm">?</span></div>
      {!open && !sent && (
        <button onClick={() => setOpen(true)} className="btn-ghost flex items-center gap-2 text-sm" style={{ color: 'var(--gic-blue)' }}>
          <MessageSquare size={14} /> Have a question about this lesson?
        </button>
      )}
      {sent && <div className="text-sm text-green-700">✓ Question sent to your mentor. You'll see the response in My Progress.</div>}
      {open && (
        <div className="gic-card p-6">
          <div className="eyebrow mb-3 flex items-center gap-1.5"><MessageSquare size={11}/> Ask your mentor</div>
          <div className="font-display text-lg font-semibold mb-1">Have a question?</div>
          <p className="text-sm mb-4" style={{ color: 'var(--gic-muted)' }}>Your question will be sent to your instructor or mentor for review.</p>
          <textarea
            value={text} onChange={e => setText(e.target.value)}
            placeholder="Type your question here..."
            rows={4}
            className="w-full border rounded-lg p-3 text-sm mb-4 resize-none"
            style={{ borderColor: 'var(--gic-line)' }}
          />
          <div className="flex items-center gap-3">
            <button onClick={submit} disabled={!text.trim() || sending} className="btn-primary flex items-center gap-2 text-sm">
              <Send size={13}/> {sending ? 'Sending…' : 'Send question'}
            </button>
            <button onClick={() => { setOpen(false); setText(''); }} className="btn-ghost text-sm">Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// QUESTIONS PAGE — apprentice view of their questions & answers
// ============================================================
function QuestionsPage({ profile }) {
  const [questions, setQuestions] = useState([]);
  const [answers, setAnswers] = useState({});
  const [loading, setLoading] = useState(true);
  const [deleting, setDeleting] = useState(null);

  const loadAnswers = async (ids) => {
    if (!ids.length) return;
    const { data: ans } = await supabase.from('question_answers').select('*').in('question_id', ids);
    if (ans) {
      const map = {};
      ans.forEach(a => { if (!map[a.question_id]) map[a.question_id] = []; map[a.question_id].push(a); });
      setAnswers(map);
    }
  };

  useEffect(() => {
    if (!supabase || !profile?.id) return;
    let mounted = true;
    (async () => {
      const { data: qs } = await supabase
        .from('questions')
        .select('*')
        .eq('asker_id', profile.id)
        .order('created_at', { ascending: false });
      if (!mounted || !qs) return;
      setQuestions(qs);
      await loadAnswers(qs.map(q => q.id));
      if (mounted) setLoading(false);
    })();

    // Real-time: new answers to my questions
    const answerChannel = supabase
      .channel('my-question-answers-' + profile.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'question_answers' }, async (payload) => {
        const qid = payload.new.question_id;
        setAnswers(prev => ({
          ...prev,
          [qid]: [...(prev[qid] || []), payload.new]
        }));
        // Also mark question as resolved
        setQuestions(prev => prev.map(q => q.id === qid ? { ...q, status: 'resolved' } : q));
      })
      .subscribe();

    return () => { mounted = false; supabase.removeChannel(answerChannel); };
  }, [profile?.id]);

  const deleteQuestion = async (q) => {
    if (!confirm('Delete this question thread? This cannot be undone.')) return;
    setDeleting(q.id);
    await supabase.from('question_answers').delete().eq('question_id', q.id);
    await supabase.from('questions').delete().eq('id', q.id);
    setQuestions(prev => prev.filter(x => x.id !== q.id));
    setAnswers(prev => { const next = { ...prev }; delete next[q.id]; return next; });
    setDeleting(null);
  };

  if (loading) return <div className="py-12 text-center"><LoadingScreen /></div>;

  return (
    <div className="animate-fade-in">
      <div className="eyebrow mb-3">My Questions</div>
      <h2 className="font-display text-2xl font-semibold mb-2">Questions & Responses</h2>
      <p className="text-sm mb-8" style={{ color: 'var(--gic-muted)' }}>Questions you've sent to your mentors and their responses.</p>
      {questions.length === 0 ? (
        <div className="gic-card p-10 text-center">
          <MessageSquare size={28} className="mx-auto mb-3" style={{ color: 'var(--gic-warm)' }} />
          <div className="font-display text-xl font-semibold mb-2">No questions yet</div>
          <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>When you have questions during a lesson, use the "Ask your mentor" button at the bottom of each lesson.</p>
        </div>
      ) : (
        <div className="space-y-4">
          {questions.map(q => {
            const qAnswers = answers[q.id] || [];
            const hasAnswer = qAnswers.length > 0;
            return (
              <div key={q.id} className="gic-card p-6" style={hasAnswer ? { borderColor: 'rgba(31,122,74,0.3)' } : {}}>
                <div className="flex items-start justify-between gap-4 mb-2">
                  <div className="flex-1">
                    {q.lesson_title && q.lesson_title !== 'Exam Access Request' && (
                      <div className="eyebrow mb-1">{q.lesson_title}</div>
                    )}
                    {q.lesson_title === 'Exam Access Request' && (
                      <div className="eyebrow mb-1" style={{ color: 'var(--gic-blue)' }}>Early Exam Access Request</div>
                    )}
                    <div className="font-semibold text-sm leading-relaxed">{q.question_text}</div>
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <span className="badge"
                      style={q.status === 'resolved'
                        ? { color: 'var(--gic-green)', background: 'rgba(31,122,74,0.08)' }
                        : { color: 'var(--gic-amber)', background: 'rgba(200,132,28,0.08)' }}>
                      {q.status === 'resolved' ? 'Answered' : 'Pending'}
                    </span>
                    <button onClick={() => deleteQuestion(q)} disabled={deleting === q.id}
                      className="btn-ghost p-1 rounded" title="Delete question"
                      style={{ color: 'var(--gic-warm)', opacity: deleting === q.id ? 0.4 : 1 }}>
                      <Trash2 size={14}/>
                    </button>
                  </div>
                </div>
                <div className="text-xs mb-3" style={{ color: 'var(--gic-warm)' }}>{fmtRelative(q.created_at)}</div>

                {hasAnswer ? (
                  <div className="mt-3 space-y-3">
                    {qAnswers.map(a => (
                      <div key={a.id} className="p-4 rounded-lg" style={{ background: 'rgba(31,122,74,0.05)', borderLeft: '3px solid var(--gic-green)' }}>
                        <div className="flex items-center gap-2 mb-1.5">
                          <div className="w-5 h-5 rounded-full flex items-center justify-center" style={{ background: 'var(--gic-green)', color: 'white' }}>
                            <CheckCircle2 size={11}/>
                          </div>
                          <span className="text-xs font-semibold" style={{ color: 'var(--gic-green)' }}>{a.responder_name || 'Mentor'}</span>
                          <span className="text-xs" style={{ color: 'var(--gic-warm)' }}>{fmtRelative(a.created_at)}</span>
                        </div>
                        <div className="text-sm leading-relaxed">{a.answer_text}</div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-xs mt-2 italic flex items-center gap-1.5" style={{ color: 'var(--gic-muted)' }}>
                    <Clock size={11}/> Awaiting response from your mentor…
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
