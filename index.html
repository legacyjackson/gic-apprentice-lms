function BlockFields({ block, onUpdate }) {
  const fs = { borderColor: 'var(--gic-line)' };
  const ic = 'w-full border rounded p-2 text-sm';
  const tc = 'w-full border rounded p-2 text-sm resize-none';

  switch (block.type) {
    case 'paragraph':
      return (
        <div>
          <div className="text-xs mb-1" style={{ color:'var(--gic-muted)' }}>Supports basic HTML: &lt;strong&gt;, &lt;em&gt;, &lt;a href=""&gt;</div>
          <textarea value={block.text||''} onChange={e=>onUpdate({text:e.target.value})} rows={3} className={tc} style={fs} placeholder="Write your paragraph here..." />
        </div>
      );
    case 'heading':
    case 'subheading':
      return <input value={block.text||''} onChange={e=>onUpdate({text:e.target.value})} className={ic} style={fs} placeholder="Heading text..." />;
    case 'list':
    case 'numbered':
      return (
        <div>
          <div className="text-xs mb-1" style={{ color:'var(--gic-muted)' }}>One item per line</div>
          <textarea value={(block.items||[]).join('\n')} onChange={e=>onUpdate({items:e.target.value.split('\n')})}
            rows={4} className={tc} style={fs} placeholder={"First item\nSecond item\nThird item"} />
        </div>
      );
    case 'callout':
      return (
        <div className="space-y-2">
          <div className="flex items-center gap-2">
            <select value={block.kind||'key'} onChange={e=>onUpdate({kind:e.target.value})} className="border rounded p-2 text-sm flex-shrink-0" style={fs}>
              <option value="key">💡 Key Concept</option>
              <option value="warn">⚠️ Warning</option>
              <option value="do">✅ Best Practice</option>
              <option value="note">📝 Note</option>
            </select>
            <input value={block.title||''} onChange={e=>onUpdate({title:e.target.value})} className={ic} style={fs} placeholder="Title (optional)" />
          </div>
          <textarea value={block.text||''} onChange={e=>onUpdate({text:e.target.value})} rows={3} className={tc} style={fs} placeholder="Callout content..." />
        </div>
      );
    case 'video':
      return (
        <div className="space-y-2">
          <div className="flex items-center gap-2 mb-1">
            <label className="text-xs px-2 py-1 rounded border cursor-pointer hover:bg-stone-50 flex items-center gap-1"
              style={{ borderColor: 'var(--gic-line)', color: 'var(--gic-blue)' }}>
              <Upload size={11}/> Upload video
              <input type="file" accept="video/*" className="sr-only" onChange={async e => {
                const file = e.target.files?.[0]; if (!file) return;
                const path = `videos/${Date.now()}-${file.name}`;
                const { error } = await supabase.storage.from('media').upload(path, file, { upsert: true });
                if (!error) {
                  const { data: u } = supabase.storage.from('media').getPublicUrl(path);
                  onUpdate({ url: u.publicUrl });
                }
              }}/>
            </label>
            <span className="text-xs" style={{ color: 'var(--gic-muted)' }}>or paste URL below</span>
          </div>
          <input value={block.url||''} onChange={e=>onUpdate({url:e.target.value})} className={ic} style={fs} placeholder="YouTube URL, Vimeo URL, or direct video link" />
          <div className="grid grid-cols-2 gap-2">
            <input value={block.title||''} onChange={e=>onUpdate({title:e.target.value})} className={ic} style={fs} placeholder="Title (optional)" />
            <input value={block.watch_time||''} onChange={e=>onUpdate({watch_time:e.target.value})} className={ic} style={fs} placeholder='Watch time, e.g. "12 min"' />
          </div>
          <input value={block.caption||''} onChange={e=>onUpdate({caption:e.target.value})} className={ic} style={fs} placeholder="Caption (optional)" />
        </div>
      );
    case 'image':
      return (
        <div className="space-y-2">
          <div className="flex items-center gap-2 mb-1">
            <label className="text-xs px-2 py-1 rounded border cursor-pointer hover:bg-stone-50 flex items-center gap-1"
              style={{ borderColor: 'var(--gic-line)', color: 'var(--gic-blue)' }}>
              <Upload size={11}/> Upload image
              <input type="file" accept="image/*" className="sr-only" onChange={async e => {
                const file = e.target.files?.[0]; if (!file) return;
                const path = `images/${Date.now()}-${file.name}`;
                const { error } = await supabase.storage.from('media').upload(path, file, { upsert: true });
                if (!error) {
                  const { data: u } = supabase.storage.from('media').getPublicUrl(path);
                  onUpdate({ url: u.publicUrl });
                }
              }}/>
            </label>
            <span className="text-xs" style={{ color: 'var(--gic-muted)' }}>or paste URL below</span>
          </div>
          <input value={block.url||''} onChange={e=>onUpdate({url:e.target.value})} className={ic} style={fs} placeholder="Image URL (paste any image link)" />
          <input value={block.caption||''} onChange={e=>onUpdate({caption:e.target.value})} className={ic} style={fs} placeholder="Caption (optional)" />
          {block.url && <img src={block.url} alt="preview" style={{maxHeight:'100px',borderRadius:'6px',objectFit:'cover'}} onError={e=>e.target.style.display='none'} />}
        </div>
      );
    case 'audio':
      return (
        <div className="space-y-2">
          <div className="flex items-center gap-2 mb-1">
            <label className="text-xs px-2 py-1 rounded border cursor-pointer hover:bg-stone-50 flex items-center gap-1"
              style={{ borderColor: 'var(--gic-line)', color: 'var(--gic-blue)' }}>
              <Upload size={11}/> Upload audio
              <input type="file" accept="audio/*" className="sr-only" onChange={async e => {
                const file = e.target.files?.[0]; if (!file) return;
                const path = `audios/${Date.now()}-${file.name}`;
                const { error } = await supabase.storage.from('media').upload(path, file, { upsert: true });
                if (!error) {
                  const { data: u } = supabase.storage.from('media').getPublicUrl(path);
                  onUpdate({ url: u.publicUrl });
                }
              }}/>
            </label>
            <span className="text-xs" style={{ color: 'var(--gic-muted)' }}>or paste URL below</span>
          </div>
          <input value={block.url||''} onChange={e=>onUpdate({url:e.target.value})} className={ic} style={fs} placeholder="Audio file URL (MP3, WAV, etc.)" />
          <div className="grid grid-cols-2 gap-2">
            <input value={block.title||''} onChange={e=>onUpdate({title:e.target.value})} className={ic} style={fs} placeholder="Title (optional)" />
            <input value={block.listen_time||''} onChange={e=>onUpdate({listen_time:e.target.value})} className={ic} style={fs} placeholder='Listen time, e.g. "8 min"' />
          </div>
        </div>
      );
    case 'glossary':
      return (
        <div className="space-y-2">
          {(block.terms||[]).map((t,i) => (
            <div key={i} className="flex items-start gap-2">
              <input value={t.term||''} onChange={e=>{const terms=[...(block.terms||[])];terms[i]={...t,term:e.target.value};onUpdate({terms});}}
                className="border rounded p-2 text-sm" style={{...fs, width:'140px', flexShrink:0}} placeholder="Term" />
              <textarea value={t.definition||''} onChange={e=>{const terms=[...(block.terms||[])];terms[i]={...t,definition:e.target.value};onUpdate({terms});}}
                rows={2} className={tc+' flex-1'} style={fs} placeholder="Definition" />
              <button onClick={()=>{const terms=(block.terms||[]).filter((_,j)=>j!==i);onUpdate({terms});}}
                className="p-1 mt-1 rounded hover:bg-red-50 flex-shrink-0" style={{color:'var(--gic-rose)'}}><X size={11}/></button>
            </div>
          ))}
          <button onClick={()=>onUpdate({terms:[...(block.terms||[]),{term:'',definition:''}]})}
            className="text-xs flex items-center gap-1" style={{color:'var(--gic-blue)'}}>
            <Plus size={11}/> Add term
          </button>
        </div>
      );
    case 'activity':
      return (
        <div className="space-y-2">
          <input value={block.title||''} onChange={e=>onUpdate({title:e.target.value})} className={ic} style={fs} placeholder="Activity title" />
          <textarea value={block.prompt||''} onChange={e=>onUpdate({prompt:e.target.value})} rows={2} className={tc} style={fs} placeholder="Instructions / prompt for the student..." />
          <div>
            <div className="text-xs mb-1" style={{color:'var(--gic-muted)'}}>Steps — one per line</div>
            <textarea value={(block.steps||[]).join('\n')} onChange={e=>onUpdate({steps:e.target.value.split('\n')})}
              rows={4} className={tc} style={fs} placeholder={"Step one\nStep two\nStep three"} />
          </div>
        </div>
      );
    case 'case_study':
      return (
        <div className="space-y-2">
          <input value={block.title||''} onChange={e=>onUpdate({title:e.target.value})} className={ic} style={fs} placeholder="Case study title" />
          <textarea value={block.scenario||''} onChange={e=>onUpdate({scenario:e.target.value})} rows={3} className={tc} style={fs} placeholder="Scenario description..." />
          <textarea value={block.discussion||''} onChange={e=>onUpdate({discussion:e.target.value})} rows={3} className={tc} style={fs} placeholder="Discussion / analysis..." />
        </div>
      );
    case 'divider':
      return <div className="text-xs text-center py-1" style={{color:'var(--gic-muted)'}}>— section break —</div>;
    default:
      return <div className="text-xs" style={{color:'var(--gic-muted)'}}>Unknown block type: {block.type}</div>;
  }
}

function BlockEditor({ block, onUpdate, onDelete, onMove, isFirst, isLast, bIdx, onReorder }) {
  const [isDragging, setIsDragging] = useState(false);
  const label = { paragraph:'Text', heading:'Heading', subheading:'Subheading', list:'Bullet List',
    numbered:'Numbered List', callout:'Callout', video:'Video', image:'Image',
    audio:'Audio', glossary:'Glossary', activity:'Activity', case_study:'Case Study', divider:'Divider' }[block.type] || block.type;
  const color = BLOCK_COLORS[block.type] || '#6b7280';

  return (
    <div className="border rounded-lg overflow-hidden"
      style={{borderColor:'rgba(0,0,0,0.1)', opacity: isDragging ? 0.5 : 1, cursor:'grab'}}
      draggable="true"
      onDragStart={e => { e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', String(bIdx)); setIsDragging(true); }}
      onDragEnd={() => setIsDragging(false)}
      onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; }}
      onDrop={e => { e.preventDefault(); const from = parseInt(e.dataTransfer.getData('text/plain')); if (from !== bIdx && onReorder) onReorder(from, bIdx); }}
    >
      <div className="flex items-center gap-2 px-3 py-2" style={{background:'rgba(0,0,0,0.02)'}}>
        <span className="text-xs select-none" style={{color:'var(--gic-warm)',letterSpacing:'0.05em'}}>⠿</span>
        <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{background:color+'18', color}}>{label}</span>
        <div className="flex-1" />
        <button onClick={()=>onMove(-1)} disabled={isFirst} className="w-5 h-5 flex items-center justify-center rounded hover:bg-stone-100 disabled:opacity-25 text-xs">↑</button>
        <button onClick={()=>onMove(1)} disabled={isLast} className="w-5 h-5 flex items-center justify-center rounded hover:bg-stone-100 disabled:opacity-25 text-xs">↓</button>
        <button onClick={onDelete} className="w-5 h-5 flex items-center justify-center rounded hover:bg-red-50" style={{color:'var(--gic-rose)'}}><X size={11}/></button>
      </div>
      <div className="p-3">
        <BlockFields block={block} onUpdate={onUpdate} />
      </div>
    </div>
  );
}

function ModuleEditor({ mod, onClose, onSaved }) {
  const [title, setTitle] = useState(mod.title || '');
  const [desc, setDesc] = useState(mod.short_description || '');
  const [objectives, setObjectives] = useState((mod.learning_objectives || []).join('\n'));
  const [activeTab, setActiveTab] = useState('meta');
  const [lessonMode, setLessonMode] = useState('visual'); // visual | json
  const [lessonsData, setLessonsData] = useState(() => JSON.parse(JSON.stringify(mod.content?.lessons || [])));
  const [lessonsJson, setLessonsJson] = useState(() => JSON.stringify(mod.content?.lessons || [], null, 2));
  const [jsonError, setJsonError] = useState('');
  const [expandedLesson, setExpandedLesson] = useState(0);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  const switchToJson = () => { setLessonsJson(JSON.stringify(lessonsData, null, 2)); setJsonError(''); setLessonMode('json'); };
  const switchToVisual = () => {
    try { setLessonsData(JSON.parse(lessonsJson)); setJsonError(''); setLessonMode('visual'); }
    catch(e) { setJsonError('Fix the JSON error before switching: ' + e.message); }
  };

  // Lesson-level helpers
  const updateLesson = (idx, patch) => setLessonsData(prev => prev.map((l,i) => i===idx ? {...l,...patch} : l));
  const addLesson = () => {
    setLessonsData(prev => [...prev, {title:'New Lesson', summary:'', read_time:'', blocks:[]}]);
    setExpandedLesson(lessonsData.length);
  };
  const deleteLesson = (idx) => {
    if (!confirm('Delete this lesson and all its content?')) return;
    setLessonsData(prev => prev.filter((_,i) => i!==idx));
    setExpandedLesson(prev => Math.max(0, prev > idx ? prev-1 : prev));
  };
  const moveLesson = (idx, dir) => {
    setLessonsData(prev => { const a=[...prev], to=idx+dir; if(to<0||to>=a.length)return a; [a[idx],a[to]]=[a[to],a[idx]]; return a; });
    setExpandedLesson(idx+dir);
  };

  // Block-level helpers
  const updateBlock = (lIdx, bIdx, patch) =>
    updateLesson(lIdx, { blocks: lessonsData[lIdx].blocks.map((b,i) => i===bIdx ? {...b,...patch} : b) });
  const deleteBlock = (lIdx, bIdx) =>
    updateLesson(lIdx, { blocks: lessonsData[lIdx].blocks.filter((_,i) => i!==bIdx) });
  const moveBlock = (lIdx, bIdx, dir) => {
    const blocks = [...lessonsData[lIdx].blocks];
    const to = bIdx+dir;
    if (to<0||to>=blocks.length) return;
    [blocks[bIdx],blocks[to]] = [blocks[to],blocks[bIdx]];
    updateLesson(lIdx, { blocks });
  };
  const addBlock = (lIdx, type) =>
    updateLesson(lIdx, { blocks: [...lessonsData[lIdx].blocks, {...(BLOCK_DEFAULTS[type]||{type})}] });

  const save = async () => {
    setSaving(true); setError('');
    let finalLessons = lessonsData;
    if (lessonMode === 'json') {
      try { finalLessons = JSON.parse(lessonsJson); }
      catch(e) { setError('JSON is invalid: ' + e.message); setSaving(false); return; }
    }
    const objs = objectives.split('\n').map(s=>s.trim()).filter(Boolean);
    const { data, error: err } = await supabase.from('modules').update({
      title, short_description: desc, learning_objectives: objs,
      content: { ...(mod.content||{}), lessons: finalLessons },
      status: 'draft',
      approved_by: null,
      approved_by_email: null,
      approved_at: null,
      updated_at: new Date().toISOString()
    }).eq('id', mod.id).select().single();
    setSaving(false);
    if (err) { setError(err.message); return; }
    if (data) onSaved(data);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center" style={{background:'rgba(15,22,49,0.6)',overflowY:'auto',paddingTop:'40px',paddingBottom:'40px'}}>
      <div className="gic-card w-full max-w-3xl mx-4 animate-fade-in">

        {/* Header */}
        <div className="flex items-center justify-between p-6 border-b" style={{borderColor:'var(--gic-line)'}}>
          <div>
            <div className="eyebrow mb-1">Admin · Module Editor</div>
            <div className="font-display text-xl font-semibold">Module {String(mod.module_number).padStart(2,'0')} — {mod.title}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>

        {/* Tab bar */}
        <div className="flex border-b" style={{borderColor:'var(--gic-line)'}}>
          {[['meta','Overview'],['lessons','Lesson Content']].map(([id,label]) => (
            <button key={id} onClick={() => setActiveTab(id)} className="px-6 py-3 text-sm font-medium"
              style={{borderBottom: activeTab===id ? '2px solid var(--gic-blue)' : '2px solid transparent',
                      color: activeTab===id ? 'var(--gic-blue)' : 'var(--gic-muted)'}}>
              {label}
            </button>
          ))}
        </div>

        <div className="p-6">

          {/* ── OVERVIEW TAB ── */}
          {activeTab === 'meta' && (
            <div className="space-y-5">
              <div>
                <label className="eyebrow mb-1 block">Module Title</label>
                <input value={title} onChange={e=>setTitle(e.target.value)} className="w-full border rounded-lg p-3 text-sm" style={{borderColor:'var(--gic-line)'}} />
              </div>
              <div>
                <label className="eyebrow mb-1 block">Short Description <span style={{color:'var(--gic-muted)',fontWeight:'normal'}}>— shown on the modules page</span></label>
                <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={3} className="w-full border rounded-lg p-3 text-sm resize-none" style={{borderColor:'var(--gic-line)'}} />
              </div>
              <div>
                <label className="eyebrow mb-1 block">Learning Objectives <span style={{color:'var(--gic-muted)',fontWeight:'normal'}}>— one per line</span></label>
                <textarea value={objectives} onChange={e=>setObjectives(e.target.value)} rows={8} className="w-full border rounded-lg p-3 text-sm resize-none" style={{borderColor:'var(--gic-line)'}}
                  placeholder={"Explain the difference between gross and net income\nIdentify fixed, variable, and periodic expenses\nConstruct a household net worth statement"} />
              </div>
            </div>
          )}

          {/* ── LESSONS TAB ── */}
          {activeTab === 'lessons' && (
            <div>
              {/* Mode toggle pill */}
              <div className="flex items-center justify-between mb-5">
                <div className="text-sm font-medium" style={{color:'var(--gic-ink)'}}>
                  {lessonMode==='visual' ? `${lessonsData.length} lesson${lessonsData.length!==1?'s':''}` : 'Editing raw JSON'}
                </div>
                <div className="flex items-center p-1 rounded-lg" style={{background:'var(--gic-ink)'}}>
                  <button onClick={() => lessonMode==='json' ? switchToVisual() : null}
                    className="px-3 py-1.5 rounded text-xs font-semibold transition"
                    style={{background: lessonMode==='visual'?'white':'transparent',
                            color: lessonMode==='visual'?'var(--gic-blue)':'rgba(255,255,255,0.5)',
                            boxShadow: lessonMode==='visual'?'0 1px 3px rgba(0,0,0,0.15)':'none'}}>
                    Visual Editor
                  </button>
                  <button onClick={() => lessonMode==='visual' ? switchToJson() : null}
                    className="px-3 py-1.5 rounded text-xs font-semibold transition"
                    style={{background: lessonMode==='json'?'white':'transparent',
                            color: lessonMode==='json'?'var(--gic-blue)':'rgba(255,255,255,0.5)',
                            boxShadow: lessonMode==='json'?'0 1px 3px rgba(0,0,0,0.15)':'none'}}>
                    JSON
                  </button>
                </div>
              </div>

              {jsonError && <div className="text-xs p-3 mb-4 rounded" style={{background:'rgba(184,61,92,0.08)',color:'var(--gic-rose)'}}>{jsonError}</div>}

              {/* JSON MODE */}
              {lessonMode === 'json' && (
                <textarea value={lessonsJson} onChange={e=>setLessonsJson(e.target.value)} rows={24}
                  className="w-full border rounded-lg p-3 text-xs font-mono resize-none"
                  style={{borderColor:'var(--gic-line)',lineHeight:'1.5'}} />
              )}

              {/* VISUAL MODE */}
              {lessonMode === 'visual' && (
                <div className="space-y-2">
                  {lessonsData.map((lesson, lIdx) => (
                    <div key={lIdx} className="border rounded-lg overflow-hidden" style={{borderColor:'var(--gic-line)'}}>
                      {/* Lesson row */}
                      <div className="flex items-center gap-2 p-3 cursor-pointer select-none hover:bg-stone-50 transition"
                           style={{background: expandedLesson===lIdx ? 'rgba(45,31,177,0.03)' : 'white'}}
                           onClick={() => setExpandedLesson(expandedLesson===lIdx ? -1 : lIdx)}>
                        <span className="font-mono text-xs w-6 text-center flex-shrink-0" style={{color:'var(--gic-warm)'}}>{String(lIdx+1).padStart(2,'0')}</span>
                        <span className="flex-1 font-semibold text-sm truncate">{lesson.title || 'Untitled lesson'}</span>
                        <span className="text-xs mr-1" style={{color:'var(--gic-muted)'}}>{(lesson.blocks||[]).length} block{(lesson.blocks||[]).length!==1?'s':''}</span>
                        <button onClick={e=>{e.stopPropagation();moveLesson(lIdx,-1);}} disabled={lIdx===0} className="w-6 h-6 flex items-center justify-center rounded hover:bg-stone-100 disabled:opacity-25 text-xs">↑</button>
                        <button onClick={e=>{e.stopPropagation();moveLesson(lIdx,1);}} disabled={lIdx===lessonsData.length-1} className="w-6 h-6 flex items-center justify-center rounded hover:bg-stone-100 disabled:opacity-25 text-xs">↓</button>
                        <button onClick={e=>{e.stopPropagation();deleteLesson(lIdx);}} className="w-6 h-6 flex items-center justify-center rounded hover:bg-red-50" style={{color:'var(--gic-rose)'}}><X size={12}/></button>
                        <span className="text-xs" style={{color:'var(--gic-muted)'}}>{expandedLesson===lIdx ? '▲' : '▼'}</span>
                      </div>

                      {/* Lesson detail */}
                      {expandedLesson === lIdx && (
                        <div className="border-t p-4 space-y-4 bg-stone-50" style={{borderColor:'var(--gic-line)'}}>
                          {/* Lesson metadata */}
                          <div className="grid grid-cols-2 gap-3 p-4 bg-white rounded-lg border" style={{borderColor:'var(--gic-line)'}}>
                            <div className="col-span-2">
                              <label className="text-xs font-semibold block mb-1" style={{color:'var(--gic-warm)'}}>Lesson Title</label>
                              <input value={lesson.title||''} onChange={e=>updateLesson(lIdx,{title:e.target.value})}
                                className="w-full border rounded p-2 text-sm" style={{borderColor:'var(--gic-line)'}} />
                            </div>
                            <div className="col-span-2">
                              <label className="text-xs font-semibold block mb-1" style={{color:'var(--gic-warm)'}}>One-line summary <span style={{fontWeight:'normal',opacity:0.7}}>(shown in the lesson list)</span></label>
                              <input value={lesson.summary||''} onChange={e=>updateLesson(lIdx,{summary:e.target.value})}
                                className="w-full border rounded p-2 text-sm" style={{borderColor:'var(--gic-line)'}} />
                            </div>
                            <div>
                              <label className="text-xs font-semibold block mb-1" style={{color:'var(--gic-warm)'}}>Read time</label>
                              <input value={lesson.read_time||''} onChange={e=>updateLesson(lIdx,{read_time:e.target.value})}
                                className="w-full border rounded p-2 text-sm" style={{borderColor:'var(--gic-line)'}} placeholder='e.g. "8 min read"' />
                            </div>
                            <div>
                              <label className="text-xs font-semibold block mb-1" style={{color:'var(--gic-warm)'}}>Watch / listen time</label>
                              <input value={lesson.watch_time||lesson.listen_time||''} onChange={e=>updateLesson(lIdx,{watch_time:e.target.value})}
                                className="w-full border rounded p-2 text-sm" style={{borderColor:'var(--gic-line)'}} placeholder='e.g. "12 min"' />
                            </div>
                          </div>

                          {/* Blocks */}
                          <div>
                            <div className="text-xs font-semibold mb-2" style={{color:'var(--gic-warm)'}}>Content Blocks</div>
                            <div className="space-y-2">
                              {(lesson.blocks||[]).map((block, bIdx) => (
                                <BlockEditor key={bIdx} block={block}
                                  bIdx={bIdx}
                                  onUpdate={patch => updateBlock(lIdx,bIdx,patch)}
                                  onDelete={() => deleteBlock(lIdx,bIdx)}
                                  onMove={dir => moveBlock(lIdx,bIdx,dir)}
                                  isFirst={bIdx===0} isLast={bIdx===(lesson.blocks||[]).length-1}
                                  onReorder={(from, to) => {
                                    const blocks = [...lessonsData[lIdx].blocks];
                                    const [moved] = blocks.splice(from, 1);
                                    blocks.splice(to, 0, moved);
                                    updateLesson(lIdx, { blocks });
                                  }} />
                              ))}
                            </div>
                            <AddBlockMenu onAdd={type => addBlock(lIdx,type)} />
                          </div>
                        </div>
                      )}
                    </div>
                  ))}

                  <button onClick={addLesson}
                    className="w-full p-3 border-2 border-dashed rounded-lg text-sm font-medium flex items-center justify-center gap-2 hover:bg-stone-50 transition"
                    style={{borderColor:'var(--gic-line)',color:'var(--gic-muted)'}}>
                    <Plus size={14}/> Add lesson
                  </button>
                </div>
              )}
            </div>
          )}

          {error && <div className="text-sm p-3 mt-4 rounded" style={{background:'rgba(184,61,92,0.08)',color:'var(--gic-rose)'}}>{error}</div>}
        </div>

        {/* Footer */}
        <div className="flex items-center justify-between p-6 border-t" style={{borderColor:'var(--gic-line)'}}>
          <button onClick={onClose} className="btn-ghost">Cancel</button>
          <button onClick={save} disabled={saving} className="btn-primary flex items-center gap-2">
            <Save size={14}/> {saving ? 'Saving…' : 'Save changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

function SiteSettings({ profile, onClose, onBrandingSaved }) {
  const [primary, setPrimary]   = useState('#2D1FB1');
  const [secondary, setSecondary] = useState('#1A1080');
  const [logoUrl, setLogoUrl]   = useState('');
  const [orgName, setOrgName]   = useState('Global Investment Company');
  const [loading, setLoading]   = useState(true);
  const [saving, setSaving]     = useState(false);
  const [uploading, setUploading] = useState(false);
  const [cropFile, setCropFile] = useState(null);
  const [ok, setOk] = useState('');
  const [err, setErr] = useState('');

  useEffect(() => {
    supabase.from('site_config').select('*').eq('id',1).single().then(({data}) => {
      if (data) {
        setPrimary(data.primary_color||'#2D1FB1');
        setSecondary(data.secondary_color||'#1A1080');
        setLogoUrl(data.logo_url||'');
        setOrgName(data.org_name||'Global Investment Company');
      }
      setLoading(false);
    });
  }, []);

  const save = async () => {
    setSaving(true); setErr(''); setOk('');
    const { error } = await supabase.from('site_config').upsert({
      id: 1, primary_color: primary, secondary_color: secondary,
      logo_url: logoUrl, org_name: orgName,
      updated_by: profile.id, updated_at: new Date().toISOString()
    });
    setSaving(false);
    if (error) { setErr(error.message); return; }
    // Apply colors immediately
    document.documentElement.style.setProperty('--gic-blue', primary);

// useBranding — fetches site_config / sponsor brand, applies CSS vars
// ============================================================
function useBranding(profile) {
  const [logo, setLogo]             = useState(null);
  const [refreshKey, setRefreshKey] = useState(0);

  const refresh = useCallback(() => setRefreshKey(k => k + 1), []);

  const applyBranding = useCallback((branding) => {
    if (!branding) return;
    if (branding.primary_color) {
      document.documentElement.style.setProperty('--gic-blue', branding.primary_color);
      document.documentElement.style.setProperty('--gic-blue-2', branding.secondary_color || branding.primary_color);
    }
    setLogo(branding.logo_url || null);
  }, []);

  // Fetch on mount / profile change / manual refresh
  useEffect(() => {
    if (!supabase || !profile) return;
    let mounted = true;
    (async () => {
      const { data: cfg } = await supabase.from('site_config').select('*').eq('id', 1).single();
      let branding = cfg ? { primary_color: cfg.primary_color, secondary_color: cfg.secondary_color, logo_url: cfg.logo_url } : null;
      if (profile.sponsor_id) {
        const { data: sp } = await supabase.from('employer_sponsors')
          .select('brand_primary,brand_secondary,brand_logo_url')
          .eq('id', profile.sponsor_id).single();
        if (sp?.brand_primary) branding = { primary_color: sp.brand_primary, secondary_color: sp.brand_secondary, logo_url: sp.brand_logo_url };
      }
      if (mounted) applyBranding(branding);
    })();
    return () => { mounted = false; };
  }, [profile?.id, profile?.sponsor_id, refreshKey, applyBranding]);

  // Realtime: update instantly when site_config is saved by any admin
  useEffect(() => {
    if (!supabase) return;
    const channel = supabase.channel('branding-live')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'site_config' }, payload => {
        if (!profile?.sponsor_id && payload.new) {
          applyBranding({ primary_color: payload.new.primary_color, secondary_color: payload.new.secondary_color, logo_url: payload.new.logo_url });
        }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'employer_sponsors' }, payload => {
        if (profile?.sponsor_id && payload.new?.id === profile.sponsor_id && payload.new?.brand_primary) {
          applyBranding({ primary_color: payload.new.brand_primary, secondary_color: payload.new.brand_secondary, logo_url: payload.new.brand_logo_url });
        }
      })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [profile?.id, profile?.sponsor_id, applyBranding]);

  return { logo, refresh, setLogo };
}

function IndustryUpdates({ profile }) {
  const [updates, setUpdates] = useState([]);
  const [loading, setLoading] = useState(true);
  const [checking, setChecking] = useState(false);

  const load = async () => {
    const { data } = await supabase.from('industry_updates').select('*')
      .eq('dismissed', false).order('created_at', { ascending: false }).limit(50);
    setUpdates(data || []);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const dismiss = async (id) => {
    await supabase.from('industry_updates').update({ dismissed: true }).eq('id', id);
    setUpdates(prev => prev.filter(u => u.id !== id));
  };

  const runCheck = async () => {
    setChecking(true);
    try {
      const r = await fetch('/.netlify/functions/industry-check');
      await r.json();
      await load();

  const catColor = { regulatory:'var(--gic-rose)', tax:'var(--gic-amber)', market:'var(--gic-blue)', compliance:'var(--gic-green)', general:'var(--gic-warm)' };

// MAIN APP
// ============================================================
function App({ profile, signOut }) {
  const [view, setView]         = useState('dashboard'); // dashboard | admin | module | mentor | sponsors | apprentice | updates
  const [modules, setModules]   = useState([]);
  const [progress, setProgress] = useState([]);
  const [submissions, setSubmissions]               = useState([]);
  const [openModule, setOpenModule]                 = useState(null);
  const [recordingModule, setRecordingModule]       = useState(null);
  const [viewingSubmission, setViewingSubmission]   = useState(null);
  const [viewingSubmissionMod, setViewingSubmissionMod] = useState(null);
  const [coachOpen, setCoachOpen]                   = useState(false);
  const [loading, setLoading]   = useState(true);
  const [profileData, setProfileData]               = useState(profile);
  const [showProfile, setShowProfile]               = useState(false);
  const [showSiteSettings, setShowSiteSettings]     = useState(false);
  const [earnedCert, setEarnedCert]                 = useState(null);
  const [showExamAccessRequest, setShowExamAccessRequest] = useState(false);
  const [mentorBadge, setMentorBadge]               = useState(0);
  const [progressBadge, setProgressBadge]           = useState(0);
  const [waivers, setWaivers]                       = useState([]); // prerequisite waivers for current user
  const [waiverRequestMod, setWaiverRequestMod]     = useState(null); // module user is trying to jump-ahead to
  const { logo: brandLogo, refresh: refreshBranding, setLogo: setBrandLogo } = useBranding(profileData);

  // Record last-active timestamp once per app load (analytics)
  useEffect(() => {
    if (!supabase || !profile?.id) return;
    supabase.from('profiles').update({ last_active_at: new Date().toISOString() }).eq('id', profile.id).then(() => {}, () => {});
  }, [profile?.id]);

  // Load modules
  useEffect(() => {
    if (!supabase) return;
    let mounted = true;
    (async () => {
      const { data, error } = await supabase
        .from('modules')
        .select('*')
        .order('module_number', { ascending: true });
      if (!mounted) return;
      if (data) setModules(data);
      setLoading(false);
    })();

    const channel = supabase
      .channel('modules-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'modules' }, payload => {
        if (payload.eventType === 'INSERT') {
          setModules(prev => [...prev, payload.new].sort((a, b) => a.module_number - b.module_number));
        } else if (payload.eventType === 'UPDATE') {
          setModules(prev => prev.map(m => m.id === payload.new.id ? payload.new : m));
          setOpenModule(o => o && o.id === payload.new.id ? payload.new : o);
        } else if (payload.eventType === 'DELETE') {
          setModules(prev => prev.filter(m => m.id !== payload.old.id));
        }
      })
      .subscribe();

    return () => { mounted = false; supabase.removeChannel(channel); };
  }, []);

  // Load my progress
  useEffect(() => {
    if (!supabase || !profile?.id) return;
    let mounted = true;
    (async () => {
      const { data } = await supabase
        .from('module_progress')
        .select('*')
        .eq('user_id', profile.id);
      if (mounted && data) setProgress(data);
    })();

    const channel = supabase
      .channel('progress-' + profile.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'module_progress', filter: `user_id=eq.${profile.id}` }, payload => {
        if (payload.eventType === 'INSERT') {
          setProgress(prev => [...prev, payload.new]);
        } else if (payload.eventType === 'UPDATE') {
          setProgress(prev => prev.map(p => p.id === payload.new.id ? payload.new : p));
        }
      })
      .subscribe();

    return () => { mounted = false; supabase.removeChannel(channel); };
  }, [profile?.id]);

  // Load my submissions (apprentice perspective; mentors load via MentorDashboard)
  useEffect(() => {
    if (!supabase || !profile?.id) return;
    let mounted = true;
    (async () => {
      const { data } = await supabase
        .from('competency_submissions')
        .select('*')
        .eq('apprentice_id', profile.id)
        .order('submitted_at', { ascending: false });
      if (mounted && data) setSubmissions(data);
    })();

    const channel = supabase
      .channel('submissions-self-' + profile.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'competency_submissions', filter: `apprentice_id=eq.${profile.id}` }, payload => {
        if (payload.eventType === 'INSERT') setSubmissions(prev => [payload.new, ...prev]);
        else if (payload.eventType === 'UPDATE') setSubmissions(prev => prev.map(s => s.id === payload.new.id ? payload.new : s));
        else if (payload.eventType === 'DELETE') setSubmissions(prev => prev.filter(s => s.id !== payload.old.id));
      })
      .subscribe();

    return () => { mounted = false; supabase.removeChannel(channel); };
  }, [profile?.id]);

  // Load prerequisite waivers for apprentice
  useEffect(() => {
    if (!supabase || !profile?.id || profile.role !== 'apprentice') return;
    supabase.from('prerequisite_waivers').select('*').eq('apprentice_id', profile.id)
      .then(({ data }) => { if (data) setWaivers(data); });
  }, [profile?.id, profile?.role]);

  // Notification badge counts — lightweight, no joins
  useEffect(() => {
    if (!supabase || !profile?.id) return;
    let mounted = true;
    const isMentorOrAdmin = profile.role === 'mentor' || profile.role === 'admin' || profile.role === 'approver';
    const isApprentice = profile.role === 'apprentice';

    const fetchCounts = async () => {
      if (isMentorOrAdmin) {
        // Pending submissions + open questions
        const [{ count: subCount }, { count: qCount }] = await Promise.all([
          supabase.from('competency_submissions').select('*', { count: 'exact', head: true }).in('status', ['submitted', 'under_review']),
          supabase.from('questions').select('*', { count: 'exact', head: true }).eq('status', 'open')
        ]);
        if (mounted) setMentorBadge((subCount || 0) + (qCount || 0));
      }
      if (isApprentice) {
        // Unanswered questions for this user
        const { data: myQs } = await supabase.from('questions').select('id').eq('asker_id', profile.id).eq('status', 'open');
        if (mounted) setProgressBadge((myQs || []).length);
      }
    };

    fetchCounts();
    // Re-check every 60s for lightweight live-ish updates
    const interval = setInterval(fetchCounts, 60000);
    return () => { mounted = false; clearInterval(interval); };
  }, [profile?.id, profile?.role]);

  const updateProgress = async (moduleId, updates) => {
    if (!supabase || !profile) return;
    const existing = progress.find(p => p.module_id === moduleId);
    const now = new Date().toISOString();
    if (existing) {
      const { data } = await supabase
        .from('module_progress')
        .update({ ...updates, updated_at: now })
        .eq('id', existing.id)
        .select()
        .single();
      if (data) setProgress(prev => prev.map(p => p.id === data.id ? data : p));
    } else {
      const { data } = await supabase
        .from('module_progress')
        .insert({
          user_id: profile.id,
          module_id: moduleId,
          started_at: now,
          updated_at: now,
          ...updates
        })
        .select()
        .single();
      if (data) setProgress(prev => [...prev, data]);
    }
  };

  const approveModule = async (mod) => {
    if (!supabase || !profile) return;
    if (profile.role !== 'approver') {
      alert('Only the designated Curriculum Approver can approve modules.');
      return;
    }
    if (!confirm(`Approve "${mod.title}" for publication to apprentices?\n\nYour name and email will be permanently attached to this module as the reviewing fiduciary expert.`)) return;
    const { data, error } = await supabase
      .from('modules')
      .update({
        status: 'approved',
        approved_by: profile.id,
        approved_by_email: profile.email,
        approved_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      })
      .eq('id', mod.id)
      .select()
      .single();
    if (error) {
      alert('Approval failed: ' + error.message);
      return;
    }
    if (data) {
      setModules(prev => prev.map(m => m.id === data.id ? data : m));
      setOpenModule(o => o && o.id === data.id ? data : o);
    }
  };

  const handleOpen = (mod) => {
    if (mod?.__examAccessRequest) { setShowExamAccessRequest(true); return; }
    // Prerequisite check — apprentices only
    if (profile?.role === 'apprentice' && mod.module_number > 1) {
      const approvedMods = modules.filter(m => m.status === 'approved').sort((a,b) => a.module_number - b.module_number);
      const prevMod = approvedMods.filter(m => m.module_number < mod.module_number).slice(-1)[0];
      if (prevMod) {
        const prevDone = progress.find(p => p.module_id === prevMod.id && p.status === 'completed');
        const waiver = waivers.find(w => w.module_id === mod.id && w.status === 'approved');
        if (!prevDone && !waiver) {
          setWaiverRequestMod(mod);
          return;
        }
      }
    }
    setOpenModule(mod);
    setView('module');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleNav = (v) => {
    setView(v);
    setOpenModule(null);
    setCoachOpen(false);
    if (v === 'mentor') setMentorBadge(0);
    if (v === 'apprentice') setProgressBadge(0);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleViewSubmission = (s, mod) => {
    const m = mod || modules.find(x => x.id === s.module_id);
    setViewingSubmission(s);
    setViewingSubmissionMod(m);
  };

  // Lesson context for AI coach — module-level for now
  const coachContext = openModule
    ? `Module ${openModule.module_number}: ${openModule.title}\n\n` +
      (openModule.outcome ? `Outcome: ${openModule.outcome}\n\n` : '') +
      (Array.isArray(openModule.learning_objectives) && openModule.learning_objectives.length > 0
        ? `Learning objectives:\n${openModule.learning_objectives.map(o => '- ' + o).join('\n')}`
        : '')
    : '';

  if (loading) return <LoadingScreen />;

  const submissionsForCurrentModule = openModule
    ? submissions.filter(s => s.module_id === openModule.id)
    : [];

  return (
    <div className="min-h-screen flex flex-col">
      <Header
        profile={profileData}
        onSignOut={signOut}
        currentView={view}
        onNavigate={handleNav}
        onOpenCoach={() => setCoachOpen(true)}
        coachAvailable={true}
        logo={brandLogo}
        onOpenProfile={() => setShowProfile(true)}
        onOpenSiteSettings={() => setShowSiteSettings(true)}
        mentorBadge={mentorBadge}
        progressBadge={progressBadge}
      />

      <div className="flex-1">
        {view === 'module' && openModule && (
          <ModuleView
            module={openModule}
            progress={progress.find(p => p.module_id === openModule.id)}
            profile={profile}
            onBack={() => handleNav('dashboard')}
            onProgressUpdate={updateProgress}
            submissions={submissionsForCurrentModule}
            onOpenRecorder={(mod) => setRecordingModule(mod)}
            onViewSubmission={(s) => handleViewSubmission(s, openModule)}
          />
        )}
        {view === 'admin' && (
          <AdminDashboard
            modules={modules}
            profile={profile}
            onOpenModule={handleOpen}
            onApprove={approveModule}
            onModuleUpdated={(updated) => {
              setModules(prev => {
                const exists = prev.find(m => m.id === updated.id);
                if (exists) return prev.map(m => m.id === updated.id ? updated : m).sort((a,b) => a.module_number - b.module_number);
                return [...prev, updated].sort((a,b) => a.module_number - b.module_number);
              });
              setOpenModule(o => o?.id === updated.id ? updated : o);
            }}
            onModuleDeleted={(id) => setModules(prev => prev.filter(m => m.id !== id))}
          />
        )}
        {view === 'mentor' && (
          <MentorDashboard
            profile={profile}
            modules={modules}
            onViewSubmission={handleViewSubmission}
          />
        )}
        {view === 'sponsors' && (
          <SponsorsAdmin profile={profile} />
        )}
        {view === 'dashboard' && (
          <ApprenticeDashboard
            modules={modules}
            progress={progress}
            profile={profile}
            onOpenModule={handleOpen}
            waivers={waivers}
          />
        )}
        {view === 'apprentice' && (
          <ApprenticeView
            profile={profile}
            modules={modules}
            submissions={submissions}
            onOpenModule={handleOpen}
            onViewSubmission={handleViewSubmission}
          />
        )}
        {view === 'updates' && (
          <IndustryUpdates profile={profile} />
        )}
      </div>

      <Footer />

      {recordingModule && (
        <RecorderModal
          module={recordingModule}
          profile={profile}
          onClose={() => setRecordingModule(null)}
          onSubmitted={() => setRecordingModule(null)}
        />
      )}
      {viewingSubmission && (
        <SubmissionViewer
          submission={viewingSubmission}
          mod={viewingSubmissionMod}
          profile={profile}
          onClose={() => { setViewingSubmission(null); setViewingSubmissionMod(null); }}
          onUpdated={(updated) => {
            setSubmissions(prev => prev.map(s => s.id === updated.id ? updated : s));
          }}
        />
      )}
      <CoachDrawer
        open={coachOpen}
        onClose={() => setCoachOpen(false)}
        profile={profileData}
        lessonContext={coachContext}
        moduleTitle={openModule?.title}
      />
      {showProfile && (
        <ProfileModal
          profile={profileData}
          onClose={() => setShowProfile(false)}
          onUpdated={updated => setProfileData(updated)}
        />
      )}
      {showSiteSettings && (
        <SiteSettings
          profile={profileData}
          onClose={() => setShowSiteSettings(false)}
          onBrandingSaved={(newLogoUrl) => {
            setBrandLogo(newLogoUrl || null);
            refreshBranding();
          }}
        />
      )}
      {earnedCert && (
        <CertificateView cert={earnedCert} onClose={() => setEarnedCert(null)} />
      )}
      {showExamAccessRequest && (
        <ExamAccessRequestModal
          profile={profileData}
          onClose={() => setShowExamAccessRequest(false)}
          onSubmitted={() => setShowExamAccessRequest(false)}
        />
      )}
      {waiverRequestMod && (
        <WaiverRequestModal
          module={waiverRequestMod}
          profile={profileData}
          existingWaiver={waivers.find(w => w.module_id === waiverRequestMod.id) || null}
          onClose={() => setWaiverRequestMod(null)}
          onSubmitted={(w) => {
            setWaivers(prev => {
              const exists = prev.find(x => x.id === w.id);
              return exists ? prev.map(x => x.id === w.id ? w : x) : [...prev, w];
            });
            setWaiverRequestMod(null);
          }}
        />
      )}
    </div>
  );
}

// ============================================================
// AVATAR CROP — drag-to-reposition circular crop canvas
// ============================================================
function AvatarCrop({ file, onSave, onClose }) {
  const canvasRef = useRef(null);
  const imgRef    = useRef(null);
  const [scale, setScale]       = useState(1);
  const [offset, setOffset]     = useState({x:0,y:0});
  const [dragging, setDragging] = useState(false);
  const [dragStart, setDragStart] = useState({x:0,y:0});
  const [bgWhite, setBgWhite]   = useState(false);
  const SIZE = 240;

  useEffect(() => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        imgRef.current = img;
        const s = SIZE / Math.min(img.width, img.height);
        setScale(s);
        setOffset({ x: -(img.width*s - SIZE)/2, y: -(img.height*s - SIZE)/2 });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }, [file]);

  useEffect(() => {
    const img = imgRef.current;
    const canvas = canvasRef.current;
    if (!img || !canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, SIZE, SIZE);

    // Checkerboard or white inside circle
    ctx.save();
    ctx.beginPath(); ctx.arc(SIZE/2,SIZE/2,SIZE/2,0,Math.PI*2); ctx.clip();
    if (bgWhite) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, SIZE, SIZE);
    } else {
      const sq = 12;
      for (let row = 0; row < Math.ceil(SIZE/sq); row++)
        for (let col = 0; col < Math.ceil(SIZE/sq); col++) {
          ctx.fillStyle = (row+col)%2===0 ? '#e5e7eb' : '#ffffff';
          ctx.fillRect(col*sq, row*sq, sq, sq);
        }
    }
    ctx.drawImage(img, offset.x, offset.y, img.width*scale, img.height*scale);
    ctx.restore();

    // Dim ring outside circle
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0,0,SIZE,SIZE);
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(SIZE/2,SIZE/2,SIZE/2,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // Redraw image inside cleanly
    ctx.save();
    ctx.beginPath(); ctx.arc(SIZE/2,SIZE/2,SIZE/2,0,Math.PI*2); ctx.clip();
    if (bgWhite) { ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,SIZE,SIZE); }
    ctx.drawImage(img, offset.x, offset.y, img.width*scale, img.height*scale);
    ctx.restore();

    // White ring
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(SIZE/2,SIZE/2,SIZE/2-1,0,Math.PI*2); ctx.stroke();
  }, [scale, offset, bgWhite]);

  const onMouseDown  = e => { setDragging(true); setDragStart({x:e.clientX-offset.x, y:e.clientY-offset.y}); };
  const onMouseMove  = e => { if(!dragging) return; setOffset({x:e.clientX-dragStart.x, y:e.clientY-dragStart.y}); };
  const onMouseUp    = () => setDragging(false);
  const onTouchStart = e => { const t=e.touches[0]; setDragging(true); setDragStart({x:t.clientX-offset.x,y:t.clientY-offset.y}); };
  const onTouchMove  = e => { if(!dragging)return; const t=e.touches[0]; setOffset({x:t.clientX-dragStart.x,y:t.clientY-dragStart.y}); e.preventDefault(); };

  const apply = () => {
    const img = imgRef.current;
    if (!img) return;
    const out = document.createElement('canvas');
    out.width=200; out.height=200;
    const ctx=out.getContext('2d');
    const r=200/SIZE;
    ctx.clearRect(0, 0, 200, 200);
    ctx.save();
    ctx.beginPath(); ctx.arc(100,100,100,0,Math.PI*2); ctx.clip();
    if (bgWhite) { ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,200,200); }
    ctx.drawImage(img, offset.x*r, offset.y*r, img.width*scale*r, img.height*scale*r);
    ctx.restore();
    // PNG preserves transparency; white fill used if bgWhite selected
    out.toBlob(blob=>onSave(blob), 'image/png');
  };

  return (
    <div className="fixed inset-0 z-60 flex items-center justify-center p-4" style={{background:'rgba(15,22,49,0.85)'}}>
      <div className="gic-card p-6 w-full max-w-xs">
        <div className="font-display text-lg font-semibold mb-1">Crop photo</div>
        <p className="text-xs mb-4" style={{color:'var(--gic-muted)'}}>Drag to reposition · Use slider to zoom</p>
        <div className="flex justify-center mb-4">
          <canvas ref={canvasRef} width={SIZE} height={SIZE}
            style={{borderRadius:'50%',cursor:dragging?'grabbing':'grab',touchAction:'none',userSelect:'none'}}
            onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
            onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onMouseUp} />
        </div>
        <div className="mb-3">
          <label className="text-xs block mb-1" style={{color:'var(--gic-muted)'}}>Zoom</label>
          <input type="range" min={0.1} max={5} step={0.01} value={scale} onChange={e=>setScale(parseFloat(e.target.value))} className="w-full" />
        </div>
        <label className="flex items-center gap-2 text-xs mb-4 cursor-pointer">
          <input type="checkbox" checked={bgWhite} onChange={e=>setBgWhite(e.target.checked)} />
          <span style={{color:'var(--gic-muted)'}}>White background <span style={{opacity:0.6}}>(leave unchecked to keep transparent)</span></span>
        </label>
        <div className="flex gap-3">
          <button onClick={onClose} className="btn-ghost flex-1">Cancel</button>
          <button onClick={apply} disabled={!imgRef.current} className="btn-primary flex-1">Save photo</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// LOGO CROP — square crop for site/sponsor logos
// ============================================================
function LogoCrop({ file, onSave, onClose }) {
  const canvasRef = useRef(null);
  const imgRef    = useRef(null);
  const [scale, setScale]     = useState(1);
  const [offset, setOffset]   = useState({ x: 0, y: 0 });
  const [dragging, setDragging] = useState(false);
  const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
  const [bgWhite, setBgWhite] = useState(false);
  const SIZE = 260;

  useEffect(() => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        imgRef.current = img;
        // Fit the whole image inside the crop area by default
        const s = Math.min(SIZE / img.width, SIZE / img.height) * 0.9;
        setScale(s);
        setOffset({ x: (SIZE - img.width * s) / 2, y: (SIZE - img.height * s) / 2 });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }, [file]);

  useEffect(() => {
    const img = imgRef.current;
    const canvas = canvasRef.current;
    if (!img || !canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, SIZE, SIZE);
    // Draw checkerboard so transparent PNG areas are visible (not black)
    if (!bgWhite) {
      const sq = 12;
      for (let row = 0; row < Math.ceil(SIZE / sq); row++) {
        for (let col = 0; col < Math.ceil(SIZE / sq); col++) {
          ctx.fillStyle = (row + col) % 2 === 0 ? '#e5e7eb' : '#ffffff';
          ctx.fillRect(col * sq, row * sq, sq, sq);
        }
      }
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, SIZE, SIZE);
    }
    ctx.drawImage(img, offset.x, offset.y, img.width * scale, img.height * scale);
    // Border
    ctx.strokeStyle = '#2D1FB1';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, SIZE - 2, SIZE - 2);
  }, [scale, offset, bgWhite]);

  const onMouseDown = e => { setDragging(true); setDragStart({ x: e.clientX - offset.x, y: e.clientY - offset.y }); };
  const onMouseMove = e => { if (!dragging) return; setOffset({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y }); };
  const onMouseUp   = () => setDragging(false);
  const onTouchStart = e => { const t = e.touches[0]; setDragging(true); setDragStart({ x: t.clientX - offset.x, y: t.clientY - offset.y }); };
  const onTouchMove  = e => { if (!dragging) return; const t = e.touches[0]; setOffset({ x: t.clientX - dragStart.x, y: t.clientY - dragStart.y }); e.preventDefault(); };

  const apply = () => {
    const out = document.createElement('canvas');
    out.width = 400; out.height = 400;
    const ctx = out.getContext('2d');
    // Explicitly clear to transparent — prevents any black fill
    ctx.clearRect(0, 0, 400, 400);
    if (bgWhite) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 400, 400);
    }
    const r = 400 / SIZE;
    ctx.drawImage(imgRef.current, offset.x * r, offset.y * r, imgRef.current.width * scale * r, imgRef.current.height * scale * r);
    out.toBlob(blob => onSave(blob), 'image/png');
  };

  return (
    <div className="fixed inset-0 z-60 flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.85)' }}>
      <div className="gic-card p-6 w-full max-w-sm">
        <div className="font-display text-lg font-semibold mb-1">Crop logo</div>
        <p className="text-xs mb-4" style={{ color: 'var(--gic-muted)' }}>Drag to reposition · Slider to zoom · It will auto-size in the app</p>

        <div className="flex justify-center mb-3">
          <canvas ref={canvasRef} width={SIZE} height={SIZE}
            style={{ borderRadius: '8px', cursor: dragging ? 'grabbing' : 'grab', touchAction: 'none', userSelect: 'none', display: 'block' }}
            onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
            onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onMouseUp} />
        </div>

        <div className="mb-3">
          <label className="text-xs block mb-1" style={{ color: 'var(--gic-muted)' }}>Zoom</label>
          <input type="range" min={0.05} max={4} step={0.01} value={scale}
            onChange={e => setScale(parseFloat(e.target.value))} className="w-full" />
        </div>

        <label className="flex items-center gap-2 text-xs mb-4 cursor-pointer">
          <input type="checkbox" checked={bgWhite} onChange={e => setBgWhite(e.target.checked)} />
          <span style={{ color: 'var(--gic-muted)' }}>Fill background white <span style={{opacity:0.6}}>(leave unchecked to keep transparent)</span></span>
        </label>

        <div className="flex gap-3">
          <button onClick={onClose} className="btn-ghost flex-1">Cancel</button>
          <button onClick={apply} disabled={!imgRef.current} className="btn-primary flex-1">Use this logo</button>
        </div>
      </div>
    </div>
  );
}

// PROFILE MODAL — edit name, avatar, password
// ============================================================
function ProfileModal({ profile, onClose, onUpdated }) {
  const [tab, setTab] = useState('profile'); // profile | password
  const [fullName, setFullName] = useState(profile.full_name || '');
  const [cropFile, setCropFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const [ok, setOk] = useState('');
  const [sponsor, setSponsor] = useState(null);

  useEffect(() => {
    if (!supabase || !profile.sponsor_id) return;
    supabase.from('employer_sponsors').select('name').eq('id', profile.sponsor_id).single()
      .then(({data}) => { if (data) setSponsor(data.name); });
  }, [profile.sponsor_id]);

  const saveProfile = async () => {
    setSaving(true); setErr(''); setOk('');
    const { error } = await supabase.from('profiles').update({ full_name: fullName, updated_at: new Date().toISOString() }).eq('id', profile.id);
    setSaving(false);
    if (error) { setErr(error.message); return; }
    setOk('Profile updated.');
    onUpdated({ ...profile, full_name: fullName });
  };

  const handleAvatarSelect = (e) => {
    const file = e.target.files?.[0];
    if (file) setCropFile(file);
  };

  const handleCropSave = async (blob) => {
    setCropFile(null);
    setUploading(true); setErr('');
    const fileName = `avatars/${profile.id}-${Date.now()}.jpg`;
    const { error } = await supabase.storage.from('media').upload(fileName, blob, { upsert: true, contentType: 'image/jpeg' });
    if (error) { setErr('Upload failed: ' + error.message + ' | bucket: media | path: ' + fileName); setUploading(false); return; }
    const { data: urlData } = supabase.storage.from('media').getPublicUrl(fileName);
    const url = urlData?.publicUrl;
    if (url) {
      await supabase.from('profiles').update({ avatar_url: url }).eq('id', profile.id);
      onUpdated({ ...profile, avatar_url: url });
    }
    setUploading(false);
    setOk('Profile photo updated.');
  };

  const changePassword = async (e) => {
    e.preventDefault();
    setErr(''); setOk('');
    if (pw.length < 8) { setErr('Password must be at least 8 characters.'); return; }
    if (pw !== pw2) { setErr('Passwords do not match.'); return; }
    setSaving(true);
    const { error } = await supabase.auth.updateUser({ password: pw });
    setSaving(false);
    if (error) { setErr(error.message); return; }
    setPw(''); setPw2('');
    setOk('Password changed successfully.');
  };

  return (
    <>
      <div className="fixed inset-0 z-50 flex items-start justify-center" style={{background:'rgba(15,22,49,0.6)',overflowY:'auto',paddingTop:'40px',paddingBottom:'40px'}}>
        <div className="gic-card w-full max-w-md mx-4 animate-fade-in">
          <div className="flex items-center justify-between p-6 border-b" style={{borderColor:'var(--gic-line)'}}>
            <div className="font-display text-xl font-semibold">My Profile</div>
            <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
          </div>

          <div className="flex border-b" style={{borderColor:'var(--gic-line)'}}>
            {[['profile','Profile'],['password','Password']].map(([id,label]) => (
              <button key={id} onClick={()=>{setErr('');setOk('');setTab(id);}} className="px-6 py-3 text-sm font-medium"
                style={{borderBottom:tab===id?'2px solid var(--gic-blue)':'2px solid transparent',
                        color:tab===id?'var(--gic-blue)':'var(--gic-muted)'}}>
                {label}
              </button>
            ))}
          </div>

          <div className="p-6 space-y-5">
            {tab === 'profile' && (
              <>
                {/* Avatar */}
                <div className="flex items-center gap-4">
                  <div className="relative">
                    {profile.avatar_url
                      ? <img src={profile.avatar_url} alt="" className="w-16 h-16 rounded-full object-cover" />
                      : <div className="w-16 h-16 rounded-full flex items-center justify-center text-xl font-semibold text-white" style={{background:'var(--gic-blue)'}}>{(profile.full_name||profile.email||'?')[0].toUpperCase()}</div>
                    }
                    <label className="absolute -bottom-1 -right-1 w-6 h-6 rounded-full flex items-center justify-center cursor-pointer" style={{background:'var(--gic-blue)',color:'white'}}>
                      <Camera size={12}/>
                      <input type="file" accept="image/*" className="sr-only" onChange={handleAvatarSelect} />
                    </label>
                  </div>
                  <div>
                    <div className="font-semibold">{profile.full_name || profile.email}</div>
                    <div className="text-xs mt-0.5" style={{color:'var(--gic-muted)'}}>{profile.email}</div>
                    {sponsor && <div className="text-xs mt-1 font-medium" style={{color:'var(--gic-blue)'}}>Sponsored by {sponsor}</div>}
                    {uploading && <div className="text-xs mt-1" style={{color:'var(--gic-muted)'}}>Uploading photo…</div>}
                  </div>
                </div>

                <div>
                  <label className="eyebrow block mb-2">Full Name</label>
                  <input value={fullName} onChange={e=>setFullName(e.target.value)} className="gic-input" />
                </div>

                <div className="p-3 rounded-lg text-sm" style={{background:'rgba(45,31,177,0.04)'}}>
                  <div className="font-semibold mb-0.5" style={{color:'var(--gic-blue)'}}>Role</div>
                  <div style={{color:'var(--gic-ink)'}}>{profile.role === 'approver' ? 'Curriculum Approver' : profile.role === 'admin' ? 'Administrator' : profile.role === 'mentor' ? 'Mentor' : 'Apprentice'}</div>
                </div>

                {err && <div className="text-sm p-3 rounded" style={{background:'rgba(184,61,92,0.08)',color:'var(--gic-rose)'}}>{err}</div>}
                {ok && <div className="text-sm p-3 rounded" style={{background:'rgba(31,122,74,0.08)',color:'var(--gic-green)'}}>{ok}</div>}
                <button onClick={saveProfile} disabled={saving} className="btn-primary w-full">{saving?'Saving…':'Save changes'}</button>
              </>
            )}

            {tab === 'password' && (
              <form onSubmit={changePassword} className="space-y-4">
                <div>
                  <label className="eyebrow block mb-2">New password</label>
                  <div className="relative">
                    <input type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} className="gic-input pr-10" placeholder="At least 8 characters" required />
                    <button type="button" onClick={()=>setShowPw(!showPw)} className="absolute right-3 top-1/2 -translate-y-1/2" style={{color:'var(--gic-warm)'}}>
                      {showPw ? <EyeOff size={15}/> : <Eye size={15}/>}
                    </button>
                  </div>
                </div>
                <div>
                  <label className="eyebrow block mb-2">Confirm password</label>
                  <input type={showPw?'text':'password'} value={pw2} onChange={e=>setPw2(e.target.value)} className="gic-input" placeholder="Repeat password" required />
                </div>
                {err && <div className="text-sm p-3 rounded" style={{background:'rgba(184,61,92,0.08)',color:'var(--gic-rose)'}}>{err}</div>}
                {ok && <div className="text-sm p-3 rounded" style={{background:'rgba(31,122,74,0.08)',color:'var(--gic-green)'}}>{ok}</div>}
                <button type="submit" disabled={saving} className="btn-primary w-full">{saving?'Changing password…':'Change password'}</button>
              </form>
            )}
          </div>
        </div>
      </div>

      {cropFile && <AvatarCrop file={cropFile} onSave={handleCropSave} onClose={()=>setCropFile(null)} />}
    </>
  );
}

// ============================================================
// FORCE PASSWORD CHANGE — shown when must_change_password flag is set
// ============================================================
function ForcePasswordChange({ profile, onDone }) {
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const submit = async (e) => {
    e.preventDefault();
    setErr('');
    if (pw.length < 8) { setErr('Password must be at least 8 characters.'); return; }
    if (pw !== pw2) { setErr('Passwords do not match.'); return; }
    setBusy(true);
    const { error } = await supabase.auth.updateUser({ password: pw });
    if (error) { setErr(error.message); setBusy(false); return; }
    // Clear the flag
    await supabase.from('profiles').update({ metadata: { ...(profile.metadata||{}), must_change_password: false } }).eq('id', profile.id);
    setBusy(false);
    onDone();
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{background:'var(--gic-bone)'}}>
      <div className="gic-card p-8 w-full max-w-md">
        <div className="eyebrow mb-3">Account Setup</div>
        <h1 className="font-display text-3xl font-semibold mb-2">Set your password</h1>
        <p className="text-sm mb-6" style={{color:'var(--gic-muted)'}}>Welcome! Before you get started, please set a secure password for your account.</p>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="eyebrow block mb-2">New password</label>
            <div className="relative">
              <input type={show?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} className="gic-input pr-10" placeholder="At least 8 characters" required />
              <button type="button" onClick={()=>setShow(!show)} className="absolute right-3 top-1/2 -translate-y-1/2" style={{color:'var(--gic-warm)'}}>
                {show ? <EyeOff size={15}/> : <Eye size={15}/>}
              </button>
            </div>
          </div>
          <div>
            <label className="eyebrow block mb-2">Confirm password</label>
            <input type={show?'text':'password'} value={pw2} onChange={e=>setPw2(e.target.value)} className="gic-input" placeholder="Repeat password" required />
          </div>
          {err && <div className="text-sm p-3 rounded" style={{background:'rgba(184,61,92,0.08)',color:'var(--gic-rose)'}}>{err}</div>}
          <button type="submit" disabled={busy} className="btn-primary w-full">{busy?'Saving…':'Set password & continue'}</button>
        </form>
      </div>
    </div>
  );
}

// ============================================================
// AUTH GATE — wraps App, shows LoginScreen if not signed in
// ============================================================
function AuthGate() {
  const { session, profile, loading, signOut } = useAuth();
  const [showApply, setShowApply] = useState(false);

  if (!SUPABASE_READY) return <SetupNeeded />;
  if (loading)        return <LoadingScreen />;
  if (!session) {
    return showApply
      ? <ApplicationForm onDone={() => setShowApply(false)} />
      : <LoginScreen onApply={() => setShowApply(true)} />;
  }
  if (!profile)       return <LoadingScreen />;

  if (profile.metadata?.must_change_password) {
    return <ForcePasswordChange profile={profile} onDone={() => window.location.reload()} />;
  }

  return <App profile={profile} signOut={signOut} />;
}

// ============================================================
// MOUNT
// ============================================================
const root = createRoot(document.getElementById('root'));
root.render(<AuthGate />);
</script>
</body>
</html>
