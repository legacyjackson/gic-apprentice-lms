<script type="text/babel" data-type="module" data-presets="env,react">
import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
import { createRoot } from 'react-dom/client';
import { createClient } from '@supabase/supabase-js';
import {
  BookOpen, GraduationCap, ShieldCheck, CheckCircle2, Circle, Clock,
  Lock, LogOut, ChevronRight, ChevronLeft, ChevronDown, User as UserIcon,
  Award, AlertCircle, FileText, ArrowRight, ArrowLeft, Sparkles,

  ListChecks, MessageSquare, Bookmark, AlertTriangle,
  Mic, Square, Send, Building2, Video, Play, Pause, Upload,
  Plus, Edit3, Trash2, Copy, UserCheck, Users, KeySquare,
  ClipboardCheck, RotateCcw, ExternalLink
} from 'lucide-react';

// ============================================================
// SUPABASE CLIENT
// ============================================================
const CFG = window.GIC_CONFIG || {};
const SUPABASE_READY =
  CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes('PASTE') &&
  CFG.SUPABASE_ANON_KEY && !CFG.SUPABASE_ANON_KEY.includes('PASTE');

const supabase = SUPABASE_READY
  ? createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    })
  : null;

// ============================================================
// UTILITIES
// ============================================================
const formatHours = (h) => h == null ? '—' : `${h}h`;
const moduleIcon = (n) => {
  const icons = [BookOpen, BarChart3, FileText, Layers, Brain, ShieldCheck, Target, MessageSquare, Briefcase,
                 UserIcon, FileText, BarChart3, Award, FileText, FileText, ListChecks, MessageSquare,
                 ShieldCheck, BarChart3, Search, Globe, FileText, ShieldCheck, BarChart3, FileText,
                 CheckCircle2, FileText, FileText, ListChecks, ShieldCheck];
  return icons[(n - 1) % icons.length] || BookOpen;
};

const competencyColor = (n) => {
  if (n <= 9)  return 'core';        // CORE-1 through CORE-9
  if (n <= 18) return 'ojl-a';       // OJL-1 through OJL-9
  return 'ojl-b';                    // OJL-10 through OJL-21
};

const COLOR_BANDS = {
  'core':  { label: 'Core Instruction',     accent: 'var(--gic-blue)',  pale: 'rgba(45,31,177,0.06)' },
  'ojl-a': { label: 'On-the-Job Learning',  accent: 'var(--gic-ink)',   pale: 'rgba(15,22,49,0.05)' },
  'ojl-b': { label: 'Advanced OJL',         accent: 'var(--gic-amber)', pale: 'rgba(200,132,28,0.06)' }
};

// ============================================================
// API HELPER — call Netlify Functions with current session JWT
// ============================================================
async function callFn(name, body) {
  const { data: { session } } = await supabase.auth.getSession();
  const r = await fetch(`/.netlify/functions/${name}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(session?.access_token ? { 'Authorization': 'Bearer ' + session.access_token } : {})
    },
    body: JSON.stringify(body || {})
  });
  const text = await r.text();
  let json; try { json = JSON.parse(text); } catch { json = { raw: text }; }
  if (!r.ok) throw new Error(json.error || text || `HTTP ${r.status}`);
  return json;
}

async function callPublicFn(name, body) {
  const r = await fetch(`/.netlify/functions/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const text = await r.text();
  let json; try { json = JSON.parse(text); } catch { json = { raw: text }; }
  if (!r.ok) throw new Error(json.error || text || `HTTP ${r.status}`);
  return json;
}

const fmtRelative = (ts) => {
  if (!ts) return '';
  const d = new Date(ts);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  if (diff < 604800)return `${Math.floor(diff/86400)}d ago`;
  return d.toLocaleDateString();
};

// ============================================================
// AUTH HOOK
// ============================================================
function useAuth() {
  const [session, setSession]   = useState(null);
  const [profile, setProfile]   = useState(null);
  const [loading, setLoading]   = useState(true);

  useEffect(() => {
    if (!supabase) { setLoading(false); return; }
    let mounted = true;

    supabase.auth.getSession().then(({ data }) => {
      if (!mounted) return;
      setSession(data.session || null);
      if (!data.session) setLoading(false);
    });

    const { data: sub } = supabase.auth.onAuthStateChange((_event, sess) => {
      if (!mounted) return;
      setSession(sess || null);
      if (!sess) { setProfile(null); setLoading(false); }
    });

    return () => { mounted = false; sub.subscription.unsubscribe(); };
  }, []);

  useEffect(() => {
    if (!session) return;
    let mounted = true;
    (async () => {
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', session.user.id)
        .maybeSingle();
      if (!mounted) return;
      if (data) setProfile(data);
      else setProfile({ id: session.user.id, email: session.user.email, role: 'apprentice', full_name: session.user.email.split('@')[0] });
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, [session]);

  const signOut = useCallback(async () => {
    if (supabase) await supabase.auth.signOut();
  }, []);

  return { session, profile, loading, signOut };
}

// LOGIN SCREEN

function LoginScreen() {
  const [email, setEmail]       = useState('');
  const [password, setPassword] = useState('');
  const [fullName, setFullName] = useState('');
  const [token, setToken]       = useState('');
  const [tokenPreview, setTokenPreview] = useState(null); // { valid, sponsor_name, reason }
  const [showPw, setShowPw]     = useState(false);
  const [mode, setMode]         = useState('signin'); // signin | reset | enroll
  const [busy, setBusy]         = useState(false);
  const [error, setError]       = useState('');
  const [info, setInfo]         = useState('');

  // Live token validation (debounced)
  useEffect(() => {
    if (mode !== 'enroll') return;
    const t = token.trim();
    if (t.length < 4) { setTokenPreview(null); return; }
    const id = setTimeout(async () => {
      try {
        const { data, error } = await supabase.rpc('peek_token_validity', { p_token: t });
        if (error) { setTokenPreview({ valid: false, reason: 'Could not check code.' }); return; }
        if (data && data.length > 0) setTokenPreview(data[0]);
      } catch (e) {
        setTokenPreview({ valid: false, reason: 'Could not check code.' });
      }
    }, 400);
    return () => clearTimeout(id);
  }, [token, mode]);

  const onSubmit = async (e) => {
    e.preventDefault();
    setError(''); setInfo(''); setBusy(true);
    try {
      if (mode === 'reset') {
        const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), {
          redirectTo: window.location.origin
        });
        if (error) throw error;
        setInfo('Check your inbox for a password reset link.');
      } else if (mode === 'enroll') {
        await callPublicFn('enroll-apprentice', {
          token: token.trim(),
          email: email.trim().toLowerCase(),
          password,
          fullName: fullName.trim()
        });
        // Auto sign-in
        const { error } = await supabase.auth.signInWithPassword({
          email: email.trim().toLowerCase(),
          password
        });
        if (error) throw error;
      } else {
        const { error } = await supabase.auth.signInWithPassword({
          email:    email.trim().toLowerCase(),
          password
        });
        if (error) throw error;
      }
    } catch (err) {
      setError(err.message || 'Something went wrong.');
    } finally {

  return (

        </div>

        <div className="max-w-md">
          <div className="eyebrow mb-4" style={{ color: 'rgba(255,255,255,0.5)' }}>{CFG.PROGRAM_NAME}</div>
          <h1 className="font-display text-5xl font-medium leading-tight mb-6">
            Your money made simple <em className="font-medium" style={{ color: '#C8841C' }}>when you have a system.</em>
          </h1>
          <p className="text-base leading-relaxed" style={{ color: 'rgba(255,255,255,0.7)' }}>
            A federally registered apprenticeship preparing the next generation of Wealth Solutions Counselors. Thirty competencies. One practitioner-track curriculum. Designed for the work.
          </p>
        </div>

        <div>
          <div className="gic-rule mb-4" style={{ '--gic-line': 'rgba(255,255,255,0.15)' }}>
            <span className="font-display italic text-sm" style={{ color: 'rgba(255,255,255,0.5)' }}>{CFG.ORG_VALUES}</span>
          </div>
          <div className="text-xs" style={{ color: 'rgba(255,255,255,0.5)' }}>{CFG.PROGRAM_RAPIDS}</div>
        </div>
      </div>

      {/* RIGHT — Form */}
      <div className="flex items-center justify-center p-8 lg:p-16">
        <div className="w-full max-w-md animate-fade-in">
          <div className="lg:hidden flex items-center gap-3 mb-10">

          <div className="eyebrow mb-3">

                <Mail size={16} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: 'var(--gic-muted)' }} />
                <input
                  type="email"
                  className="gic-input pl-10"
                  placeholder={mode === 'enroll' ? "you@employer.com" : "you@globalinvestmentcompanies.com"}
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  required
                  autoComplete="email"
                />
              </div>
            </div>

            {(mode === 'signin' || mode === 'enroll') && (
              <div>
                <label className="eyebrow block mb-2">{mode === 'enroll' ? 'Create a password' : 'Password'}</label>
                <div className="relative">
                  <KeyRound size={16} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: 'var(--gic-muted)' }} />
                  <input
                    type={showPw ? 'text' : 'password'}
                    className="gic-input pl-10 pr-10"
                    placeholder={mode === 'enroll' ? 'At least 8 characters' : '••••••••'}
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    required
                    minLength={mode === 'enroll' ? 8 : undefined}
                    autoComplete={mode === 'enroll' ? 'new-password' : 'current-password'}
                  />
                  <button type="button" onClick={() => setShowPw(!showPw)} className="absolute right-3 top-1/2 -translate-y-1/2" style={{ color: 'var(--gic-muted)' }}>
                    {showPw ? <EyeOff size={16} /> : <Eye size={16} />}
                  </button>
                </div>
              </div>
            )}

            {error && (
              <div className="text-sm p-3 border-l-2 flex items-start gap-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                <AlertCircle size={16} className="flex-shrink-0 mt-0.5" />
                <span>{error}</span>
              </div>
            )}
            {info && (
              <div className="text-sm p-3 border-l-2 flex items-start gap-2" style={{ borderColor: 'var(--gic-green)', background: 'rgba(31,122,74,0.06)', color: 'var(--gic-green)' }}>
                <Check size={16} className="flex-shrink-0 mt-0.5" />
                <span>{info}</span>
              </div>
            )}

            <button type="submit"
                    disabled={busy || (mode === 'enroll' && tokenPreview && !tokenPreview.valid)}
                    className="btn-primary w-full flex items-center justify-center gap-2">
              {busy ? <Loader2 size={16} className="animate-spin" /> : null}
              {mode === 'reset'  ? 'Send reset link'
               : mode === 'enroll' ? 'Create account & sign in'
               : 'Sign in'}
              {!busy && mode === 'signin' && <ArrowRight size={16} />}
            </button>

            <div className="flex items-center justify-between pt-2 text-sm">
              <button type="button" onClick={() => { setMode(mode === 'signin' ? 'reset' : 'signin'); setError(''); setInfo(''); }}
                className="btn-ghost">
                {mode === 'signin' ? 'Forgot password?' : mode === 'reset' ? 'Back to sign in' : ''}
              </button>
              <button type="button" onClick={() => { setMode(mode === 'enroll' ? 'signin' : 'enroll'); setError(''); setInfo(''); setTokenPreview(null); }}
                className="btn-ghost flex items-center gap-1" style={{ color: 'var(--gic-blue)' }}>
                {mode === 'enroll' ? 'Have an account? Sign in' : <><KeySquare size={12}/> Have a sponsorship code?</>}
              </button>
            </div>
          </form>

          <div className="mt-12 pt-6 border-t text-xs leading-relaxed" style={{ borderColor: 'var(--gic-line)', color: 'var(--gic-warm)' }}>
            This platform is restricted to enrolled apprentices and Global Investment Company staff. Unauthorized access is prohibited. For account assistance contact <span style={{ color: 'var(--gic-blue)' }}>{CFG.APPROVER_EMAIL}</span>.
          </div>
        </div>
      </div>
    </div>
  );
}

function ApprenticeDashboard({ modules, progress, profile, onOpenModule }) {

  const ojlB    = modules.filter(m => m.module_number > 18);

  const progressBy = useMemo(() => {
    const map = {};
    progress.forEach(p => { map[p.module_id] = p; });
    return map;
  }, [progress]);

  const totalCompleted = progress.filter(p => p.status === 'completed').length;
  const totalInProgress = progress.filter(p => p.status === 'in_progress').length;

  const visibleModules = isAdmin ? modules : modules.filter(m => m.status === 'approved');

  return (
    <main className="max-w-7xl mx-auto px-6 lg:px-10 py-12 lg:py-16 animate-fade-in">

        <div className="eyebrow mb-3">Welcome, {(profile?.full_name || profile?.email || '').split('@')[0]}</div>
        <h1 className="font-display text-4xl lg:text-6xl font-medium leading-tight mb-6 max-w-3xl">
          The work of an advisor begins with <em>understanding.</em>
        </h1>
        <p className="text-lg leading-relaxed max-w-2xl" style={{ color: 'var(--gic-muted)' }}>
          Your apprenticeship is structured around thirty competencies — drawn from our DOL-registered work process. Move through them at your pace; some live in the classroom, others on the job.
        </p>
      </section>

      {/* Stats strip */}
      <section className="grid grid-cols-2 lg:grid-cols-4 gap-px mb-16 border" style={{ borderColor: 'var(--gic-line)', background: 'var(--gic-line)' }}>
        <Stat label="Modules Completed" value={totalCompleted} max={visibleModules.length} />
        <Stat label="In Progress" value={totalInProgress} />
        <Stat label="Core Competencies" value={`${core.filter(m => m.status === 'approved').length}/${core.length}`} />
        <Stat label="Avg. Quiz Score" value={
          progress.filter(p => p.best_quiz_score).length
            ? Math.round(progress.filter(p => p.best_quiz_score).reduce((a, p) => a + p.best_quiz_score, 0) / progress.filter(p => p.best_quiz_score).length) + '%'
            : '—'
        } />
      </section>

      {/* Module sections */}
      <ModuleSection
        eyebrow="Core Instruction · 144 Related Instruction Hours"
        title="Foundations"
        subtitle="The shared body of knowledge every Wealth Solutions Counselor draws from."
        modules={core.filter(m => isAdmin || m.status === 'approved')}
        progressBy={progressBy}
        onOpen={onOpenModule}
        isAdmin={isAdmin}
      />

      <ModuleSection
        eyebrow="On-the-Job Learning · Client-Facing"
        title="Working with Clients"
        subtitle="Discovery, documents, planning, and the practitioner skills that turn knowledge into service."
        modules={ojlA.filter(m => isAdmin || m.status === 'approved')}
        progressBy={progressBy}
        onOpen={onOpenModule}
        isAdmin={isAdmin}
      />

      <ModuleSection
        eyebrow="On-the-Job Learning · Operations &amp; Investment"
        title="Investment, Compliance &amp; Operations"
        subtitle="The technical work that supports a firm: research, reporting, reconciliation, and audit-readiness."
        modules={ojlB.filter(m => isAdmin || m.status === 'approved')}
        progressBy={progressBy}
        onOpen={onOpenModule}
        isAdmin={isAdmin}
      />

      {/* Curriculum-in-development notice */}
      {!isAdmin && modules.filter(m => m.status !== 'approved').length > 0 && (
        <section className="mt-12 gic-card p-8 max-w-3xl">
          <div className="flex items-start gap-4">
            <Clock size={20} style={{ color: 'var(--gic-amber)' }} className="flex-shrink-0 mt-1" />
            <div>
              <div className="font-display text-xl font-semibold mb-2">More modules unlock as they're approved</div>
              <p className="text-sm leading-relaxed" style={{ color: 'var(--gic-muted)' }}>

function ModuleView({ module: mod, progress, profile, onBack, onProgressUpdate, submissions, onOpenRecorder, onViewSubmission }) {
  const [view, setView]               = useState('overview'); // overview | lesson | quiz | results
  const [currentLesson, setCurrentLesson] = useState(progress?.current_lesson || 0);
  const [completedLessons, setCompletedLessons] = useState(progress?.lessons_completed || []);
  const isAdmin = profile?.role === 'admin' || profile?.role === 'approver';
  const isApproved = mod.status === 'approved';
  const content = mod.content || {};
  const lessons = content.lessons || [];
  const quiz = content.quiz || null;
  const hasContent = lessons.length > 0;

  const markLessonComplete = async (idx) => {
    const next = Array.from(new Set([...completedLessons, idx]));
    setCompletedLessons(next);
    await onProgressUpdate(mod.id, {
      status: 'in_progress',
      current_lesson: idx,
      lessons_completed: next
    });
  };

  if (!hasContent) {
    return (
      <main className="max-w-4xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
        <button onClick={onBack} className="btn-ghost flex items-center gap-1.5 mb-8">
          <ArrowLeft size={14} /> All modules
        </button>

        <div className="eyebrow mb-3">{mod.competency_id} · Module {String(mod.module_number).padStart(2, '0')}</div>
        <h1 className="font-display text-4xl font-semibold mb-4">{mod.title}</h1>
        <p className="text-lg leading-relaxed mb-8" style={{ color: 'var(--gic-muted)' }}>
          {mod.short_description}
        </p>

        <div className="gic-card p-10 text-center">
          <Clock size={28} style={{ color: 'var(--gic-amber)' }} className="mx-auto mb-4" />
          <div className="font-display text-2xl font-semibold mb-2">Curriculum in development</div>
          <p className="text-sm leading-relaxed max-w-md mx-auto" style={{ color: 'var(--gic-muted)' }}>
            This module is currently being authored. It will be reviewed and approved by Cathy Jackson-Gent before being made available to apprentices.
          </p>
        </div>
      </main>
    );
  }

  // OVERVIEW SCREEN
  if (view === 'overview') {
    const completedCount = completedLessons.length;
    const allLessonsComplete = lessons.length > 0 && completedCount >= lessons.length;
    return (
      <main className="max-w-5xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
        <button onClick={onBack} className="btn-ghost flex items-center gap-1.5 mb-8">
          <ArrowLeft size={14} /> All modules
        </button>

  // QUIZ SCREEN

          status: passed ? 'completed' : 'in_progress',

          attempt_count: (progress?.attempt_count || 0) + 1,

  return null;
}

// ============================================================
// LESSON BLOCK RENDERER
// ============================================================
function LessonBlock({ block }) {
  switch (block.type) {
    case 'heading':
      return <h2>{block.text}</h2>;
    case 'subheading':
      return <h3>{block.text}</h3>;
    case 'paragraph':
      return <p dangerouslySetInnerHTML={{ __html: block.text }} />;
    case 'list':
      return (
        <ul>{(block.items || []).map((item, i) => <li key={i} dangerouslySetInnerHTML={{ __html: item }} />)}</ul>
      );
    case 'numbered':
      return (
        <ol>{(block.items || []).map((item, i) => <li key={i} dangerouslySetInnerHTML={{ __html: item }} />)}</ol>
      );
    case 'callout': {
      const colors = {
        key:    { border: 'var(--gic-blue)',  bg: 'rgba(45,31,177,0.04)', icon: Sparkles },
        warn:   { border: 'var(--gic-amber)', bg: 'rgba(200,132,28,0.06)', icon: AlertTriangle },
        do:     { border: 'var(--gic-green)', bg: 'rgba(31,122,74,0.06)', icon: CheckCircle2 },
        note:   { border: 'var(--gic-warm)',  bg: 'rgba(138,116,94,0.06)', icon: Bookmark }
      };
      const c = colors[block.kind] || colors.note;
      const Icon = c.icon;
      return (
        <div className="my-6 p-5 border-l-2 flex items-start gap-3" style={{ borderColor: c.border, background: c.bg }}>
          <Icon size={18} className="flex-shrink-0 mt-0.5" style={{ color: c.border }} />
          <div className="flex-1">
            {block.title && <div className="font-semibold mb-1" style={{ color: c.border }}>{block.title}</div>}
            <div className="text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: block.text }} />
          </div>
        </div>
      );
    }
    case 'glossary':
      return (
        <div className="my-8 gic-card p-6">
          <div className="eyebrow mb-4">Glossary</div>
          <dl className="space-y-3">
            {(block.terms || []).map((t, i) => (
              <div key={i} className="grid md:grid-cols-[180px_1fr] gap-2 md:gap-4 pb-3 border-b last:border-0" style={{ borderColor: 'var(--gic-line)' }}>
                <dt className="font-semibold" style={{ color: 'var(--gic-blue)' }}>{t.term}</dt>
                <dd className="text-sm leading-relaxed" style={{ color: 'var(--gic-ink)' }}>{t.definition}</dd>
              </div>
            ))}
          </dl>
        </div>
      );
    case 'activity':
      return (
        <div className="my-8 gic-card p-6" style={{ background: 'rgba(45,31,177,0.03)', borderColor: 'var(--gic-blue)' }}>
          <div className="eyebrow mb-2" style={{ color: 'var(--gic-blue)' }}>Activity</div>
          <div className="font-display text-xl font-semibold mb-3">{block.title}</div>
          <div className="text-sm leading-relaxed mb-4" dangerouslySetInnerHTML={{ __html: block.prompt || '' }} />
          {block.steps && (
            <ol className="text-sm space-y-2 pl-0 list-none">
              {block.steps.map((step, i) => (
                <li key={i} className="flex gap-3">
                  <span className="font-mono text-xs flex-shrink-0 w-6" style={{ color: 'var(--gic-blue)' }}>{String(i + 1).padStart(2, '0')}</span>
                  <span dangerouslySetInnerHTML={{ __html: step }} />
                </li>
              ))}
            </ol>
          )}
        </div>
      );
    case 'case_study':
      return (
        <div className="my-8 border-l-2 pl-6" style={{ borderColor: 'var(--gic-ink)' }}>
          <div className="eyebrow mb-2">Case Study</div>
          <div className="font-display text-xl font-semibold mb-3">{block.title}</div>
          <div className="text-sm leading-relaxed italic mb-4" style={{ color: 'var(--gic-muted)' }} dangerouslySetInnerHTML={{ __html: block.scenario || '' }} />
          {block.discussion && (
            <div className="text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: block.discussion }} />
          )}
        </div>
      );
    case 'divider':
      return <div className="gic-rule my-12"><span className="font-display italic text-sm">§</span></div>;
    default:
      return null;
  }
}

// ============================================================
// QUIZ RUNNER
// ============================================================
function QuizRunner({ mod, quiz, profile, onClose, onComplete }) {
  const [idx, setIdx]           = useState(0);
  const [answers, setAnswers]   = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore]       = useState(0);

  const questions = quiz.questions || [];
  const passingScore = quiz.passing_score || 80;

  const select = (qIdx, choiceIdx) => {
    if (submitted) return;
    setAnswers(a => ({ ...a, [qIdx]: choiceIdx }));
  };

  const submit = async () => {
    let correct = 0;
    questions.forEach((q, i) => {
      if (answers[i] === q.correct) correct++;
    });
    const finalScore = Math.round((correct / questions.length) * 100);
    setScore(finalScore);
    setSubmitted(true);
    const passed = finalScore >= passingScore;

    // Log attempt
    if (supabase && profile) {
      await supabase.from('quiz_attempts').insert({
        user_id: profile.id,
        module_id: mod.id,
        quiz_type: 'module_exam',
        score: correct,
        max_score: questions.length,
        passed,
        answers
      });
    }

    await onComplete(finalScore, passed);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  if (submitted) {
    const passed = score >= passingScore;
    return (
      <main className="max-w-2xl mx-auto px-6 lg:px-10 py-16 text-center animate-fade-in">
        <div className="mb-8">
          {passed ? (
            <div className="w-20 h-20 mx-auto rounded-full flex items-center justify-center"
                 style={{ background: 'rgba(31,122,74,0.1)', color: 'var(--gic-green)' }}>
              <Award size={36} />
            </div>
          ) : (
            <div className="w-20 h-20 mx-auto rounded-full flex items-center justify-center"
                 style={{ background: 'rgba(184,61,92,0.1)', color: 'var(--gic-rose)' }}>
              <RefreshCw size={32} />
            </div>
          )}
        </div>

        <div className="eyebrow mb-3">{passed ? 'Competency Demonstrated' : 'Not Yet'}</div>
        <h1 className="font-display text-4xl font-semibold mb-3">
          {passed ? 'Module complete.' : 'Close — but not yet.'}
        </h1>
        <p className="text-base mb-2" style={{ color: 'var(--gic-muted)' }}>
          You scored <strong style={{ color: 'var(--gic-ink)' }}>{score}%</strong> on this assessment.
        </p>
        <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>
          Passing threshold: {passingScore}%
        </p>

        <div className="mt-10 flex items-center justify-center gap-3">
          <button onClick={onClose} className="btn-secondary">
            {passed ? 'Return to module' : 'Review lessons'}
          </button>
          {!passed && (
            <button onClick={() => { setSubmitted(false); setAnswers({}); setIdx(0); }}
                    className="btn-primary">Try again</button>
          )}
        </div>
      </main>
    );
  }

  const q = questions[idx];
  const totalAnswered = Object.keys(answers).length;
  const allAnswered = totalAnswered === questions.length;

  return (
    <main className="max-w-2xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <button onClick={onClose} className="btn-ghost flex items-center gap-1.5 mb-8">
        <ArrowLeft size={14} /> Leave assessment
      </button>

      <div className="mb-6 flex items-center justify-between">
        <div className="eyebrow">Question {idx + 1} of {questions.length}</div>
        <div className="text-xs" style={{ color: 'var(--gic-warm)' }}>{totalAnswered} answered</div>
      </div>

      {/* Progress bar */}
      <div className="h-1 mb-10" style={{ background: 'var(--gic-line)' }}>
        <div className="h-full transition-all"
             style={{ width: `${((idx + 1) / questions.length) * 100}%`, background: 'var(--gic-blue)' }} />
      </div>

      <h2 className="font-display text-2xl leading-snug mb-8">{q.prompt}</h2>

      <div className="space-y-3 mb-10">
        {q.options.map((opt, i) => {
          const isSelected = answers[idx] === i;
          return (
            <button
              key={i}
              onClick={() => select(idx, i)}
              className={`quiz-option ${isSelected ? 'selected' : ''}`}>
              <div className="flex items-start gap-3">
                <div className="font-mono text-xs mt-1 flex-shrink-0"
                     style={{ color: isSelected ? 'var(--gic-blue)' : 'var(--gic-warm)' }}>
                  {String.fromCharCode(65 + i)}
                </div>
                <div className="text-sm leading-relaxed">{opt}</div>
              </div>
            </button>
          );
        })}
      </div>

      <div className="flex items-center justify-between">
        <button
          onClick={() => setIdx(Math.max(0, idx - 1))}
          disabled={idx === 0}
          className="btn-ghost flex items-center gap-1.5 disabled:opacity-30">
          <ArrowLeft size={14} /> Previous
        </button>

        {idx < questions.length - 1 ? (
          <button
            onClick={() => setIdx(idx + 1)}
            disabled={answers[idx] == null}
            className="btn-primary flex items-center gap-2 disabled:opacity-30">
            Next <ArrowRight size={16} />
          </button>
        ) : (
          <button
            onClick={submit}
            disabled={!allAnswered}
            className="btn-primary flex items-center gap-2 disabled:opacity-30">
            Submit assessment <Check size={16} />
          </button>
        )}
      </div>
    </main>
  );
}

  const [filter, setFilter] = useState('all'); // all | draft | approved

  const filtered = modules.filter(m => filter === 'all' ? true : m.status === filter);
  const draftCount = modules.filter(m => m.status !== 'approved').length;
  const approvedCount = modules.filter(m => m.status === 'approved').length;

  return (
    <main className="max-w-7xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <div className="mb-12">
        <div className="eyebrow mb-3">Admin · Curriculum Review</div>
        <h1 className="font-display text-4xl lg:text-5xl font-medium leading-tight mb-4">
          {isApprover
            ? <>Review and approve <em>curriculum.</em></>
            : <>Curriculum status <em>at a glance.</em></>}
        </h1>
        <p className="text-base max-w-2xl" style={{ color: 'var(--gic-muted)' }}>
          {isApprover
            ? 'As Curriculum Approver, you are the final sign-off on each module. Apprentices see modules only after you approve them. Your approval replaces the AI-drafted disclosure with your reviewed-and-approved attestation.'
            : 'Track which modules are ready for apprentices and which are still in development. Only Cathy Jackson-Gent can approve modules for publication.'}
        </p>
      </div>

      <div className="grid grid-cols-3 gap-px mb-12 border" style={{ borderColor: 'var(--gic-line)', background: 'var(--gic-line)' }}>
        <Stat label="Total Modules" value={modules.length} />
        <Stat label="Approved" value={approvedCount} max={modules.length} />
        <Stat label="Awaiting Review" value={draftCount} />
      </div>

      <div className="mb-6 flex items-center gap-2">
        <span className="eyebrow mr-2">Filter</span>
        {[
          { id: 'all',      label: `All (${modules.length})` },
          { id: 'draft',    label: `Awaiting Review (${draftCount})` },
          { id: 'approved', label: `Approved (${approvedCount})` }

          <button key={f.id} onClick={() => setFilter(f.id)}
                  className={`badge ${filter === f.id ? '' : 'opacity-50'}`}
                  style={filter === f.id
                    ? { color: 'var(--gic-blue)', background: 'rgba(45,31,177,0.06)', cursor: 'pointer' }
                    : { color: 'var(--gic-warm)', cursor: 'pointer' }}>
            {f.label}
          </button>
        ))}
      </div>

      <div className="gic-card divide-y" style={{ borderColor: 'var(--gic-line)' }}>
        {filtered.map(m => (
          <AdminModuleRow key={m.id} module={m} onOpen={onOpenModule} onApprove={onApprove} canApprove={isApprover} />
        ))}

// RECORDER MODAL — video capture + upload to DO Spaces
// ============================================================
function RecorderModal({ module: mod, profile, onClose, onSubmitted }) {
  const [stage, setStage] = useState('ready'); // ready | recording | preview | uploading | done | error
  const [stream, setStream] = useState(null);
  const [recorder, setRecorder] = useState(null);
  const [chunks, setChunks] = useState([]);
  const [blob, setBlob] = useState(null);
  const [previewUrl, setPreviewUrl] = useState(null);
  const [duration, setDuration] = useState(0);
  const [notes, setNotes] = useState('');
  const [error, setError] = useState('');
  const [uploadPct, setUploadPct] = useState(0);
  const videoRef = useRef(null);
  const timerRef = useRef(null);
  const startedAtRef = useRef(0);

  // Hook camera up to preview <video>
  useEffect(() => {
    if (stream && videoRef.current) {
      videoRef.current.srcObject = stream;
    }
  }, [stream]);

  // Cleanup
  useEffect(() => () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    if (timerRef.current) clearInterval(timerRef.current);
  }, []);

  const startCamera = async () => {
    setError('');
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: true
      });
      setStream(s);
    } catch (e) {
      setError('Camera/microphone access denied. Check browser permissions.');
    }
  };

  const startRecording = () => {
    if (!stream) return;
    const mimeCandidates = [
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
      'video/mp4'
    ];
    const mime = mimeCandidates.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
    const r = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1_500_000 });
    const buf = [];
    r.ondataavailable = (e) => { if (e.data && e.data.size > 0) buf.push(e.data); };
    r.onstop = () => {
      const b = new Blob(buf, { type: mime });
      setBlob(b);
      setPreviewUrl(URL.createObjectURL(b));
      setChunks(buf);
      setStage('preview');
      if (stream) stream.getTracks().forEach(t => t.stop());
      setStream(null);
      if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
    };
    setRecorder(r);
    setStage('recording');
    startedAtRef.current = Date.now();
    setDuration(0);
    timerRef.current = setInterval(() => {
      setDuration(Math.floor((Date.now() - startedAtRef.current) / 1000));
    }, 250);
    r.start(1000);
  };

  const stopRecording = () => {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  };

  const reset = () => {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    setBlob(null);
    setPreviewUrl(null);
    setChunks([]);
    setDuration(0);
    setStage('ready');
  };

  const upload = async () => {
    if (!blob) return;
    setStage('uploading');
    setError('');
    setUploadPct(0);
    try {
      const ext  = blob.type.includes('mp4') ? 'mp4' : 'webm';
      const fn   = `module${mod.module_number}-${Date.now()}.${ext}`;
      const { uploadUrl, key } = await callFn('sign-upload', {
        filename:    fn,
        contentType: blob.type,
        moduleId:    mod.id
      });

      // PUT to DO Spaces with XHR for progress reporting
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', uploadUrl);
        xhr.setRequestHeader('Content-Type', blob.type);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) setUploadPct(Math.round((e.loaded / e.total) * 100));
        };
        xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error(`Upload failed (${xhr.status})`));
        xhr.onerror = () => reject(new Error('Upload network error'));
        xhr.send(blob);
      });

      // Insert submission record
      const { data, error: dbErr } = await supabase
        .from('competency_submissions')
        .insert({
          apprentice_id:    profile.id,
          module_id:        mod.id,
          video_path:       key,
          video_mime:       blob.type,
          duration_seconds: duration,
          size_bytes:       blob.size,
          apprentice_notes: notes.trim() || null,
          status:           'submitted'
        })
        .select()
        .single();
      if (dbErr) throw dbErr;
      setStage('done');
      onSubmitted && onSubmitted(data);
    } catch (e) {
      setError(e.message || 'Upload failed');
      setStage('error');
    }
  };

  const fmtTime = (s) => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.6)', backdropFilter: 'blur(6px)' }}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div className="p-6 border-b flex items-center justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1">Module {String(mod.module_number).padStart(2, '0')} · OJL Submission</div>
            <div className="font-display text-xl font-semibold">{mod.title}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>

        <div className="p-6">
          {stage === 'ready' && (
            <div className="space-y-5">
              <p className="text-sm leading-relaxed" style={{ color: 'var(--gic-muted)' }}>
                Record a short video (target: 2–10 minutes) demonstrating the competency. Show the work — a mock client conversation, a walk-through of an analysis, or a portfolio review. Your mentor will review and sign off on OJL hours.
              </p>
              <div className="p-4 rounded-lg" style={{ background: 'var(--gic-bone)' }}>
                <div className="text-xs font-semibold mb-1">Before you start:</div>
                <ul className="text-xs space-y-1" style={{ color: 'var(--gic-muted)' }}>
                  <li>· Find a quiet, well-lit space</li>
                  <li>· Do not use real client data — use anonymized or fictional scenarios</li>
                  <li>· Keep recordings under 30 minutes</li>
                </ul>
              </div>
              {!stream ? (
                <button onClick={startCamera} className="btn-primary w-full flex items-center justify-center gap-2">
                  <Video size={16}/> Enable camera & microphone
                </button>
              ) : (
                <>
                  <div className="aspect-video rounded-lg overflow-hidden bg-stone-900">
                    <video ref={videoRef} autoPlay muted playsInline className="w-full h-full object-cover" />
                  </div>
                  <button onClick={startRecording} className="btn-primary w-full flex items-center justify-center gap-2">
                    <Mic size={16}/> Start recording
                  </button>
                </>
              )}
              {error && (
                <div className="text-sm p-3 border-l-2 flex items-start gap-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                  <AlertCircle size={16} className="flex-shrink-0 mt-0.5"/>
                  <span>{error}</span>
                </div>
              )}
            </div>
          )}

          {stage === 'recording' && (
            <div className="space-y-5">
              <div className="aspect-video rounded-lg overflow-hidden bg-stone-900 relative">
                <video ref={videoRef} autoPlay muted playsInline className="w-full h-full object-cover" />
                <div className="absolute top-4 left-4 flex items-center gap-2 px-3 py-1.5 rounded-full" style={{ background: 'rgba(184,61,92,0.95)' }}>
                  <div className="w-2 h-2 rounded-full bg-white animate-pulse" />
                  <span className="text-xs font-mono font-semibold text-white">REC {fmtTime(duration)}</span>
                </div>
              </div>
              <button onClick={stopRecording} className="btn-primary w-full flex items-center justify-center gap-2" style={{ background: 'var(--gic-rose)' }}>
                <Square size={14}/> Stop recording
              </button>
            </div>
          )}

          {stage === 'preview' && previewUrl && (
            <div className="space-y-5">
              <div className="aspect-video rounded-lg overflow-hidden bg-stone-900">
                <video src={previewUrl} controls className="w-full h-full"/>
              </div>
              <div>
                <label className="eyebrow block mb-2">Notes for your mentor</label>
                <textarea
                  className="gic-input min-h-[100px] resize-y"
                  placeholder="What did you demonstrate? What scenario? Anything you want feedback on?"
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  maxLength={2000}
                />
                <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>
                  {notes.length}/2000 · Duration {fmtTime(duration)} · {(blob.size / (1024*1024)).toFixed(1)} MB
                </div>
              </div>
              <div className="flex gap-3">
                <button onClick={reset} className="btn-secondary flex-1 flex items-center justify-center gap-2">
                  <RotateCcw size={14}/> Re-record
                </button>
                <button onClick={upload} className="btn-primary flex-1 flex items-center justify-center gap-2">
                  <Upload size={14}/> Submit for review
                </button>
              </div>
            </div>
          )}

          {stage === 'uploading' && (
            <div className="space-y-5 py-8 text-center">
              <Loader2 size={32} className="animate-spin mx-auto" style={{ color: 'var(--gic-blue)' }}/>
              <div className="font-display text-xl font-semibold">Uploading…</div>
              <div className="w-full max-w-sm mx-auto h-2 rounded-full overflow-hidden" style={{ background: 'var(--gic-line)' }}>
                <div className="h-full transition-all duration-300" style={{ width: `${uploadPct}%`, background: 'var(--gic-blue)' }}/>
              </div>
              <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>{uploadPct}%</div>
            </div>
          )}

          {stage === 'done' && (
            <div className="space-y-4 py-8 text-center">
              <div className="w-16 h-16 mx-auto rounded-full flex items-center justify-center" style={{ background: 'rgba(31,122,74,0.1)' }}>
                <CheckCircle2 size={32} style={{ color: 'var(--gic-green)' }}/>
              </div>
              <div className="font-display text-xl font-semibold">Submitted for review</div>
              <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                Your mentor has been notified. You'll see feedback here once reviewed.
              </p>
              <button onClick={onClose} className="btn-primary">Done</button>
            </div>
          )}

          {stage === 'error' && (
            <div className="space-y-4 py-4">
              <div className="text-sm p-3 border-l-2 flex items-start gap-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                <AlertCircle size={16} className="flex-shrink-0 mt-0.5"/>
                <span>{error}</span>
              </div>
              <button onClick={() => setStage('preview')} className="btn-primary w-full">Try again</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// SUBMISSION VIEWER — apprentice or mentor views one submission
// ============================================================
function SubmissionViewer({ submission, mod, profile, onClose, onUpdated }) {
  const [videoUrl, setVideoUrl] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]   = useState('');
  const [feedback, setFeedback] = useState(submission.mentor_feedback || '');
  const [hours, setHours]   = useState(submission.ojl_hours_credited || mod?.ojl_hours || 0);
  const [saving, setSaving] = useState(false);

  const canReview = profile?.role === 'mentor' || profile?.role === 'admin' || profile?.role === 'approver';

  useEffect(() => {
    (async () => {
      try {
        const { url } = await callFn('sign-read', { submissionId: submission.id });
        setVideoUrl(url);
      } catch (e) {
        setError(e.message || 'Could not load video');
      } finally {
        setLoading(false);
      }
    })();
  }, [submission.id]);

  const decide = async (status) => {
    setSaving(true);
    try {
      const updates = {
        status,
        mentor_feedback: feedback.trim() || null,
        mentor_id: profile.id,
        reviewed_at: new Date().toISOString(),
        ojl_hours_credited: status === 'approved' ? Number(hours) || 0 : 0,
        updated_at: new Date().toISOString()
      };
      const { data, error: e } = await supabase
        .from('competency_submissions')
        .update(updates)
        .eq('id', submission.id)
        .select()
        .single();
      if (e) throw e;
      onUpdated && onUpdated(data);
      onClose();
    } catch (e) {
      setError(e.message || 'Update failed');
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.6)', backdropFilter: 'blur(6px)' }}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
        <div className="p-6 border-b flex items-center justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1">
              {mod ? `Module ${String(mod.module_number).padStart(2,'0')} · ` : ''}Submission
            </div>
            <div className="font-display text-xl font-semibold">{mod?.title || 'Apprentice submission'}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>

        <div className="p-6 space-y-5">
          <div className="aspect-video rounded-lg overflow-hidden bg-stone-900">
            {loading
              ? <div className="w-full h-full flex items-center justify-center text-stone-400"><Loader2 className="animate-spin"/></div>
              : videoUrl
                ? <video src={videoUrl} controls className="w-full h-full"/>
                : <div className="w-full h-full flex items-center justify-center text-stone-400 text-sm">{error || 'Video unavailable'}</div>
            }
          </div>

          <div className="grid grid-cols-3 gap-4 text-center text-sm">
            <div>
              <div className="eyebrow mb-1">Status</div>
              <div className="font-medium" style={{
                color: submission.status === 'approved' ? 'var(--gic-green)'
                     : submission.status === 'needs_revision' ? 'var(--gic-rose)'
                     : 'var(--gic-blue)'
              }}>
                {submission.status.replace('_', ' ')}
              </div>
            </div>
            <div>
              <div className="eyebrow mb-1">Submitted</div>
              <div>{fmtRelative(submission.submitted_at)}</div>
            </div>
            <div>
              <div className="eyebrow mb-1">Duration</div>
              <div>{Math.floor((submission.duration_seconds||0)/60)}m {(submission.duration_seconds||0)%60}s</div>
            </div>
          </div>

          {submission.apprentice_notes && (
            <div>
              <div className="eyebrow mb-2">Apprentice notes</div>
              <div className="text-sm leading-relaxed p-3 rounded-lg whitespace-pre-wrap" style={{ background: 'var(--gic-bone)' }}>
                {submission.apprentice_notes}
              </div>
            </div>
          )}

          {submission.mentor_feedback && !canReview && (
            <div>
              <div className="eyebrow mb-2">Mentor feedback</div>
              <div className="text-sm leading-relaxed p-3 rounded-lg whitespace-pre-wrap" style={{ background: 'rgba(31,122,74,0.05)' }}>
                {submission.mentor_feedback}
              </div>
              {submission.status === 'approved' && submission.ojl_hours_credited > 0 && (
                <div className="text-xs mt-2 flex items-center gap-1" style={{ color: 'var(--gic-green)' }}>
                  <CheckCircle2 size={12}/> {submission.ojl_hours_credited} OJL hours credited
                </div>
              )}
            </div>
          )}

          {canReview && submission.status !== 'approved' && (
            <div className="border-t pt-5" style={{ borderColor: 'var(--gic-line)' }}>
              <div className="eyebrow mb-3">Mentor review</div>
              <textarea
                className="gic-input min-h-[100px] resize-y mb-3"
                placeholder="What was strong? What should they refine? Be specific."
                value={feedback}
                onChange={e => setFeedback(e.target.value)}
                maxLength={3000}
              />
              <div className="flex items-center gap-3 mb-4">
                <label className="eyebrow">OJL hours to credit</label>
                <input
                  type="number"
                  step="0.25"
                  min="0"
                  max={mod?.ojl_hours || 24}
                  className="gic-input w-24"
                  value={hours}
                  onChange={e => setHours(e.target.value)}
                />
                <span className="text-xs" style={{ color: 'var(--gic-muted)' }}>
                  of {mod?.ojl_hours || '—'}h required
                </span>
              </div>
              {error && (
                <div className="text-sm p-3 border-l-2 mb-3" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                  {error}
                </div>
              )}
              <div className="flex gap-3">
                <button onClick={() => decide('needs_revision')} disabled={saving}
                        className="btn-secondary flex-1 flex items-center justify-center gap-2"
                        style={{ borderColor: 'var(--gic-rose)', color: 'var(--gic-rose)' }}>
                  <RotateCcw size={14}/> Request revision
                </button>
                <button onClick={() => decide('approved')} disabled={saving}
                        className="btn-primary flex-1 flex items-center justify-center gap-2"
                        style={{ background: 'var(--gic-green)' }}>
                  {saving ? <Loader2 size={14} className="animate-spin"/> : <Check size={14}/>} Approve & credit
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// COACH DRAWER — AI study coach sidebar
// ============================================================
function CoachDrawer({ open, onClose, profile, lessonContext, moduleTitle }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, busy]);

  const send = async (text) => {
    const q = (text || input).trim();
    if (!q || busy) return;
    setError('');
    const history = messages.map(m => ({ role: m.role, content: m.content }));
    setMessages(prev => [...prev, { role: 'user', content: q }]);
    setInput('');
    setBusy(true);
    try {
      const { answer } = await callFn('ai-coach', {
        question: q,
        lessonContext: lessonContext || '',
        apprenticeName: profile?.full_name || '',
        history
      });
      setMessages(prev => [...prev, { role: 'assistant', content: answer }]);
    } catch (e) {
      setError(e.message || 'Coach unavailable');
    } finally {
      setBusy(false);
    }
  };

  if (!open) return null;

  const quickPrompts = [
    'Explain this in plain English.',
    'Give me a real-world example.',
    'Quiz me on this — one question.',
    'Compare this with what we did last lesson.'
  ];

  return (
    <>
      <div className="fixed inset-0 z-40" style={{ background: 'rgba(15,22,49,0.4)', backdropFilter: 'blur(2px)' }} onClick={onClose}/>
      <div className="fixed top-0 right-0 bottom-0 z-50 w-full sm:w-[420px] bg-white shadow-2xl flex flex-col animate-fade-in">
        <div className="p-5 border-b flex items-start justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1 flex items-center gap-1.5"><Sparkles size={11}/> Study Coach</div>
            <div className="font-display text-lg font-semibold leading-tight">
              {moduleTitle || 'Ask anything about your lesson'}
            </div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={16}/></button>
        </div>

        <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 space-y-4">
          {messages.length === 0 && (
            <div className="text-sm leading-relaxed" style={{ color: 'var(--gic-muted)' }}>
              <p className="mb-4">
                I'm your study coach — I'll explain concepts, give examples, and quiz you. I'm not a financial advisor, just a learning tool.
              </p>
              <div className="space-y-2">
                {quickPrompts.map((p, i) => (
                  <button key={i} onClick={() => send(p)}
                          className="w-full text-left text-sm p-3 rounded-lg border hover:bg-stone-50 transition-colors"
                          style={{ borderColor: 'var(--gic-line)' }}>
                    {p}
                  </button>
                ))}
              </div>
            </div>
          )}

          {messages.map((m, i) => (
            <div key={i} className={m.role === 'user' ? 'flex justify-end' : 'flex justify-start'}>
              <div className={'max-w-[85%] p-3 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ' +
                (m.role === 'user' ? 'text-white' : '')}
                style={m.role === 'user'
                  ? { background: 'var(--gic-blue)' }
                  : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
                {m.content}
              </div>
            </div>
          ))}
          {busy && (
            <div className="flex justify-start">
              <div className="p-3 rounded-2xl text-sm flex items-center gap-2" style={{ background: 'var(--gic-bone)', color: 'var(--gic-muted)' }}>
                <Loader2 size={14} className="animate-spin"/> Thinking…
              </div>
            </div>
          )}
          {error && (
            <div className="text-sm p-3 border-l-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
              {error}
            </div>
          )}
        </div>

        <div className="p-4 border-t" style={{ borderColor: 'var(--gic-line)' }}>
          <form onSubmit={e => { e.preventDefault(); send(); }} className="flex gap-2">
            <input
              type="text"
              className="gic-input flex-1"
              placeholder="Ask about this lesson…"
              value={input}
              onChange={e => setInput(e.target.value)}
              disabled={busy}
            />
            <button type="submit" disabled={busy || !input.trim()} className="btn-primary px-3">
              <Send size={16}/>
            </button>
          </form>
          <div className="text-[10px] mt-2 leading-relaxed" style={{ color: 'var(--gic-warm)' }}>
            Coach is for learning support, not financial advice. Always verify against approved curriculum.
          </div>
        </div>
      </div>
    </>
  );
}

// MENTOR DASHBOARD — lists submissions to review
// ============================================================
function MentorDashboard({ profile, modules, onViewSubmission }) {
  const [submissions, setSubmissions] = useState([]);
  const [profilesById, setProfilesById] = useState({});
  const [filter, setFilter] = useState('pending'); // pending | all
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!profile) return;
    let mounted = true;
    (async () => {
      // Mentor sees: submissions where they're the assigned mentor OR
      // submissions from apprentices whose mentor_id === their id.
      // Admin/approver sees all.
      let q = supabase.from('competency_submissions').select('*').order('submitted_at', { ascending: false });
      const { data: subs } = await q;
      if (!mounted) return;

      let visible = subs || [];
      if (profile.role === 'mentor') {
        const { data: mentees } = await supabase.from('profiles').select('id').eq('mentor_id', profile.id);
        const menteeIds = new Set((mentees || []).map(m => m.id));
        visible = visible.filter(s => menteeIds.has(s.apprentice_id) || s.mentor_id === profile.id);
      }
      setSubmissions(visible);

      // Fetch apprentice profiles for display
      const ids = Array.from(new Set(visible.map(s => s.apprentice_id)));
      if (ids.length > 0) {
        const { data: pp } = await supabase.from('profiles').select('id,full_name,email').in('id', ids);
        const map = {}; (pp || []).forEach(p => { map[p.id] = p; });
        setProfilesById(map);
      }
      setLoading(false);
    })();

    const channel = supabase
      .channel('submissions-mentor')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'competency_submissions' }, payload => {
        if (payload.eventType === 'INSERT') setSubmissions(prev => [payload.new, ...prev]);
        else if (payload.eventType === 'UPDATE') setSubmissions(prev => prev.map(s => s.id === payload.new.id ? payload.new : s));
      })
      .subscribe();

    return () => { mounted = false; supabase.removeChannel(channel); };
  }, [profile?.id, profile?.role]);

  const pending = submissions.filter(s => s.status === 'submitted' || s.status === 'under_review');
  const display = filter === 'pending' ? pending : submissions;

  if (loading) return <LoadingScreen/>;

  return (
    <main className="max-w-6xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <div className="eyebrow mb-3">Mentor Review</div>
      <h1 className="font-display text-4xl font-semibold mb-2">Apprentice submissions</h1>
      <p className="text-base mb-10" style={{ color: 'var(--gic-muted)' }}>
        Review demonstrated competencies and sign off on On-the-Job Learning hours.
      </p>

      <div className="flex items-center gap-2 mb-6">
        <button onClick={() => setFilter('pending')}
                className={'px-4 py-2 rounded-full text-sm font-medium ' + (filter === 'pending' ? 'text-white' : '')}
                style={filter === 'pending' ? { background: 'var(--gic-blue)' } : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
          Pending review ({pending.length})
        </button>
        <button onClick={() => setFilter('all')}
                className={'px-4 py-2 rounded-full text-sm font-medium ' + (filter === 'all' ? 'text-white' : '')}
                style={filter === 'all' ? { background: 'var(--gic-blue)' } : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
          All ({submissions.length})
        </button>
      </div>

      {display.length === 0 ? (
        <div className="gic-card p-12 text-center">
          <ClipboardCheck size={28} className="mx-auto mb-4" style={{ color: 'var(--gic-warm)' }}/>
          <div className="font-display text-xl font-semibold mb-2">
            {filter === 'pending' ? 'Nothing pending' : 'No submissions yet'}
          </div>
          <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>
            {filter === 'pending'
              ? 'All caught up. New submissions will appear here in real time.'
              : 'When your apprentices submit recordings, they appear here.'}
          </p>
        </div>
      ) : (
        <div className="space-y-3">
          {display.map(s => {
            const apprentice = profilesById[s.apprentice_id];
            const mod = modules.find(m => m.id === s.module_id);
            return (
              <button key={s.id}
                      onClick={() => onViewSubmission(s, mod)}
                      className="w-full text-left gic-card p-5 hover:shadow-lg transition-all flex items-center justify-between">
                <div className="flex items-start gap-4 flex-1">
                  <div className="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0"
                       style={{
                         background: s.status === 'approved' ? 'rgba(31,122,74,0.08)'
                                   : s.status === 'needs_revision' ? 'rgba(184,61,92,0.08)'
                                   : 'rgba(45,31,177,0.06)',
                         color:      s.status === 'approved' ? 'var(--gic-green)'
                                   : s.status === 'needs_revision' ? 'var(--gic-rose)'
                                   : 'var(--gic-blue)'
                       }}>
                    {s.status === 'approved' ? <CheckCircle2 size={20}/>
                     : s.status === 'needs_revision' ? <RotateCcw size={20}/>
                     : <Video size={20}/>}
                  </div>
                  <div className="flex-1">
                    <div className="font-medium">{apprentice?.full_name || apprentice?.email || 'Apprentice'}</div>
                    <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                      {mod ? `Module ${String(mod.module_number).padStart(2,'0')} · ${mod.title}` : 'Unknown module'}
                    </div>
                    <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>
                      Submitted {fmtRelative(s.submitted_at)}
                      {s.duration_seconds ? ` · ${Math.floor(s.duration_seconds/60)}m ${s.duration_seconds%60}s` : ''}
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <span className="badge" style={
                    s.status === 'approved' ? { color: 'var(--gic-green)', background: 'rgba(31,122,74,0.08)' }
                    : s.status === 'needs_revision' ? { color: 'var(--gic-rose)', background: 'rgba(184,61,92,0.08)' }
                    : { color: 'var(--gic-blue)' }
                  }>
                    {s.status.replace('_', ' ')}
                  </span>
                  <ChevronRight size={16} style={{ color: 'var(--gic-warm)' }}/>
                </div>
              </button>
            );
          })}
        </div>
      )}
    </main>
  );
}

// SPONSORS ADMIN — manage employer sponsors + tokens
// ============================================================
function SponsorsAdmin({ profile }) {
  const [sponsors, setSponsors] = useState([]);
  const [tokens, setTokens]     = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showSponsorForm, setShowSponsorForm] = useState(false);
  const [showTokenForm, setShowTokenForm]     = useState(null); // sponsor object
  const [copiedId, setCopiedId] = useState(null);

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [{ data: s }, { data: t }] = await Promise.all([
        supabase.from('employer_sponsors').select('*').order('created_at', { ascending: false }),
        supabase.from('sponsorship_tokens').select('*').order('created_at', { ascending: false })
      ]);
      if (!mounted) return;
      setSponsors(s || []);
      setTokens(t || []);
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, []);

  const addSponsor = async (form) => {
    const { data, error } = await supabase
      .from('employer_sponsors')
      .insert({ ...form, created_by: profile.id })
      .select()
      .single();
    if (error) { alert('Failed: ' + error.message); return; }
    setSponsors(prev => [data, ...prev]);
    setShowSponsorForm(false);
  };

  const addToken = async (sponsor, form) => {
    // Generate token: GIC-XXXX-XXXX (random base32)
    const rand = () => Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4).padEnd(4, 'X');
    const token = `GIC-${rand()}-${rand()}`;
    const { data, error } = await supabase
      .from('sponsorship_tokens')
      .insert({
        token,
        employer_sponsor_id: sponsor.id,
        max_uses: form.max_uses,
        expires_at: form.expires_at || null,
        created_by: profile.id
      })
      .select()
      .single();
    if (error) { alert('Failed: ' + error.message); return; }
    setTokens(prev => [data, ...prev]);
    setShowTokenForm(null);
  };

  const copyToken = (t) => {
    navigator.clipboard.writeText(t.token);
    setCopiedId(t.id);
    setTimeout(() => setCopiedId(null), 1500);
  };

  if (loading) return <LoadingScreen/>;

  return (
    <main className="max-w-6xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <div className="eyebrow mb-3">Administration</div>
      <h1 className="font-display text-4xl font-semibold mb-2">Employer sponsors</h1>
      <p className="text-base mb-10" style={{ color: 'var(--gic-muted)' }}>
        Manage sponsoring organizations and generate enrollment codes for their apprentices.
      </p>

      {/* Sponsors */}
      <div className="mb-12">
        <div className="flex items-center justify-between mb-5">
          <div className="font-display text-xl font-semibold">Sponsoring organizations</div>
          <button onClick={() => setShowSponsorForm(true)} className="btn-primary flex items-center gap-2">
            <Plus size={14}/> Add sponsor
          </button>
        </div>

        {sponsors.length === 0 ? (
          <div className="gic-card p-10 text-center text-sm" style={{ color: 'var(--gic-muted)' }}>
            No sponsors yet. Add the first organization to begin generating enrollment codes.
          </div>
        ) : (
          <div className="space-y-3">
            {sponsors.map(s => {
              const sponsorTokens = tokens.filter(t => t.employer_sponsor_id === s.id);
              return (
                <div key={s.id} className="gic-card p-5">
                  <div className="flex items-start justify-between mb-4">
                    <div>
                      <div className="font-display text-lg font-semibold">{s.name}</div>
                      <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                        {[s.contact_name, s.contact_email, s.contact_phone].filter(Boolean).join(' · ')}
                      </div>
                      {s.address && <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>{s.address}</div>}
                    </div>
                    <button onClick={() => setShowTokenForm(s)} className="btn-secondary flex items-center gap-2 text-sm">
                      <KeySquare size={12}/> Generate code
                    </button>
                  </div>
                  {sponsorTokens.length > 0 && (
                    <div className="space-y-1.5 pt-3 border-t" style={{ borderColor: 'var(--gic-line)' }}>
                      {sponsorTokens.map(t => (
                        <div key={t.id} className="flex items-center justify-between text-sm py-1">
                          <code className="font-mono px-2 py-1 rounded" style={{ background: 'var(--gic-bone)' }}>{t.token}</code>
                          <div className="flex items-center gap-3 text-xs" style={{ color: 'var(--gic-muted)' }}>
                            <span>{t.uses}/{t.max_uses} used</span>
                            {t.expires_at && <span>· expires {new Date(t.expires_at).toLocaleDateString()}</span>}
                            <button onClick={() => copyToken(t)} className="btn-ghost flex items-center gap-1">
                              {copiedId === t.id ? <><Check size={12}/> Copied</> : <><Copy size={12}/> Copy</>}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showSponsorForm && (
        <SponsorForm onSave={addSponsor} onClose={() => setShowSponsorForm(false)}/>
      )}
      {showTokenForm && (
        <TokenForm sponsor={showTokenForm} onSave={(form) => addToken(showTokenForm, form)} onClose={() => setShowTokenForm(null)}/>
      )}
    </main>
  );
}
