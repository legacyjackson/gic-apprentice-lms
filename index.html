// SUBMISSION VIEWER — apprentice or mentor views one submission
// ============================================================
function SubmissionViewer({ submission, mod, profile, onClose, onUpdated }) {
  const [videoUrl, setVideoUrl] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]   = useState('');
  const [feedback, setFeedback] = useState(submission.mentor_feedback || '');
  const [hours, setHours]   = useState(submission.ojl_hours_credited || mod?.ojl_hours || 0);
  const [saving, setSaving] = useState(false);

  const canReview = profile?.role === 'mentor' || profile?.role === 'admin' || profile?.role === 'approver';

  useEffect(() => {
    (async () => {
      try {
        const { url } = await callFn('sign-read', { submissionId: submission.id });
        setVideoUrl(url);
      } catch (e) {
        setError(e.message || 'Could not load video');
      } finally {
        setLoading(false);
      }
    })();
  }, [submission.id]);

  const decide = async (status) => {
    setSaving(true);
    try {
      const updates = {
        status,
        mentor_feedback: feedback.trim() || null,
        mentor_id: profile.id,
        reviewed_at: new Date().toISOString(),
        ojl_hours_credited: status === 'approved' ? Number(hours) || 0 : 0,
        updated_at: new Date().toISOString()
      };
      const { data, error: e } = await supabase
        .from('competency_submissions')
        .update(updates)
        .eq('id', submission.id)
        .select()
        .single();
      if (e) throw e;
      onUpdated && onUpdated(data);
      onClose();
    } catch (e) {
      setError(e.message || 'Update failed');
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(15,22,49,0.6)', backdropFilter: 'blur(6px)' }}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
        <div className="p-6 border-b flex items-center justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1">
              {mod ? `Module ${String(mod.module_number).padStart(2,'0')} · ` : ''}Submission
            </div>
            <div className="font-display text-xl font-semibold">{mod?.title || 'Apprentice submission'}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>

        <div className="p-6 space-y-5">
          <div className="aspect-video rounded-lg overflow-hidden bg-stone-900">
            {loading
              ? <div className="w-full h-full flex items-center justify-center text-stone-400"><Loader2 className="animate-spin"/></div>
              : videoUrl
                ? <video src={videoUrl} controls className="w-full h-full"/>
                : <div className="w-full h-full flex items-center justify-center text-stone-400 text-sm">{error || 'Video unavailable'}</div>
            }
          </div>

          <div className="grid grid-cols-3 gap-4 text-center text-sm">
            <div>
              <div className="eyebrow mb-1">Status</div>
              <div className="font-medium" style={{
                color: submission.status === 'approved' ? 'var(--gic-green)'
                     : submission.status === 'needs_revision' ? 'var(--gic-rose)'
                     : 'var(--gic-blue)'
              }}>
                {submission.status.replace('_', ' ')}
              </div>
            </div>
            <div>
              <div className="eyebrow mb-1">Submitted</div>
              <div>{fmtRelative(submission.submitted_at)}</div>
            </div>
            <div>
              <div className="eyebrow mb-1">Duration</div>
              <div>{Math.floor((submission.duration_seconds||0)/60)}m {(submission.duration_seconds||0)%60}s</div>
            </div>
          </div>

          {submission.apprentice_notes && (
            <div>
              <div className="eyebrow mb-2">Apprentice notes</div>
              <div className="text-sm leading-relaxed p-3 rounded-lg whitespace-pre-wrap" style={{ background: 'var(--gic-bone)' }}>
                {submission.apprentice_notes}
              </div>
            </div>
          )}

          {submission.mentor_feedback && !canReview && (
            <div>
              <div className="eyebrow mb-2">Mentor feedback</div>
              <div className="text-sm leading-relaxed p-3 rounded-lg whitespace-pre-wrap" style={{ background: 'rgba(31,122,74,0.05)' }}>
                {submission.mentor_feedback}
              </div>
              {submission.status === 'approved' && submission.ojl_hours_credited > 0 && (
                <div className="text-xs mt-2 flex items-center gap-1" style={{ color: 'var(--gic-green)' }}>
                  <CheckCircle2 size={12}/> {submission.ojl_hours_credited} OJL hours credited
                </div>
              )}
            </div>
          )}

          {canReview && submission.status !== 'approved' && (
            <div className="border-t pt-5" style={{ borderColor: 'var(--gic-line)' }}>
              <div className="eyebrow mb-3">Mentor review</div>
              <textarea
                className="gic-input min-h-[100px] resize-y mb-3"
                placeholder="What was strong? What should they refine? Be specific."
                value={feedback}
                onChange={e => setFeedback(e.target.value)}
                maxLength={3000}
              />
              <div className="flex items-center gap-3 mb-4">
                <label className="eyebrow">OJL hours to credit</label>
                <input
                  type="number"
                  step="0.25"
                  min="0"
                  max={mod?.ojl_hours || 24}
                  className="gic-input w-24"
                  value={hours}
                  onChange={e => setHours(e.target.value)}
                />
                <span className="text-xs" style={{ color: 'var(--gic-muted)' }}>
                  of {mod?.ojl_hours || '—'}h required
                </span>
              </div>
              {error && (
                <div className="text-sm p-3 border-l-2 mb-3" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
                  {error}
                </div>
              )}
              <div className="flex gap-3">
                <button onClick={() => decide('needs_revision')} disabled={saving}
                        className="btn-secondary flex-1 flex items-center justify-center gap-2"
                        style={{ borderColor: 'var(--gic-rose)', color: 'var(--gic-rose)' }}>
                  <RotateCcw size={14}/> Request revision
                </button>
                <button onClick={() => decide('approved')} disabled={saving}
                        className="btn-primary flex-1 flex items-center justify-center gap-2"
                        style={{ background: 'var(--gic-green)' }}>
                  {saving ? <Loader2 size={14} className="animate-spin"/> : <Check size={14}/>} Approve & credit
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// COACH DRAWER — AI study coach sidebar
// ============================================================
function CoachDrawer({ open, onClose, profile, lessonContext, moduleTitle }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, busy]);

  const send = async (text) => {
    const q = (text || input).trim();
    if (!q || busy) return;
    setError('');
    const history = messages.map(m => ({ role: m.role, content: m.content }));
    setMessages(prev => [...prev, { role: 'user', content: q }]);
    setInput('');
    setBusy(true);
    try {
      const { answer } = await callFn('ai-coach', {
        question: q,
        lessonContext: lessonContext || '',
        apprenticeName: profile?.full_name || '',
        history
      });
      setMessages(prev => [...prev, { role: 'assistant', content: answer }]);
    } catch (e) {
      setError(e.message || 'Coach unavailable');
    } finally {
      setBusy(false);
    }
  };

  if (!open) return null;

  const quickPrompts = [
    'Explain this in plain English.',
    'Give me a real-world example.',
    'Quiz me on this — one question.',
    'Compare this with what we did last lesson.'
  ];

  return (
    <>
      <div className="fixed inset-0 z-40" style={{ background: 'rgba(15,22,49,0.4)', backdropFilter: 'blur(2px)' }} onClick={onClose}/>
      <div className="fixed top-0 right-0 bottom-0 z-50 w-full sm:w-[420px] bg-white shadow-2xl flex flex-col animate-fade-in">
        <div className="p-5 border-b flex items-start justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <div>
            <div className="eyebrow mb-1 flex items-center gap-1.5"><Sparkles size={11}/> Study Coach</div>
            <div className="font-display text-lg font-semibold leading-tight">
              {moduleTitle || 'Ask anything about your lesson'}
            </div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={16}/></button>
        </div>

        <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 space-y-4">
          {messages.length === 0 && (
            <div className="text-sm leading-relaxed" style={{ color: 'var(--gic-muted)' }}>
              <p className="mb-4">
                I'm your study coach — I'll explain concepts, give examples, and quiz you. I'm not a financial advisor, just a learning tool.
              </p>
              <div className="space-y-2">
                {quickPrompts.map((p, i) => (
                  <button key={i} onClick={() => send(p)}
                          className="w-full text-left text-sm p-3 rounded-lg border hover:bg-stone-50 transition-colors"
                          style={{ borderColor: 'var(--gic-line)' }}>
                    {p}
                  </button>
                ))}
              </div>
            </div>
          )}

          {messages.map((m, i) => (
            <div key={i} className={m.role === 'user' ? 'flex justify-end' : 'flex justify-start'}>
              <div className={'max-w-[85%] p-3 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ' +
                (m.role === 'user' ? 'text-white' : '')}
                style={m.role === 'user'
                  ? { background: 'var(--gic-blue)' }
                  : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
                {m.content}
              </div>
            </div>
          ))}
          {busy && (
            <div className="flex justify-start">
              <div className="p-3 rounded-2xl text-sm flex items-center gap-2" style={{ background: 'var(--gic-bone)', color: 'var(--gic-muted)' }}>
                <Loader2 size={14} className="animate-spin"/> Thinking…
              </div>
            </div>
          )}
          {error && (
            <div className="text-sm p-3 border-l-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
              {error}
            </div>
          )}
        </div>

        <div className="p-4 border-t" style={{ borderColor: 'var(--gic-line)' }}>
          <form onSubmit={e => { e.preventDefault(); send(); }} className="flex gap-2">
            <input
              type="text"
              className="gic-input flex-1"
              placeholder="Ask about this lesson…"
              value={input}
              onChange={e => setInput(e.target.value)}
              disabled={busy}
            />
            <button type="submit" disabled={busy || !input.trim()} className="btn-primary px-3">
              <Send size={16}/>
            </button>
          </form>
          <div className="text-[10px] mt-2 leading-relaxed" style={{ color: 'var(--gic-warm)' }}>
            Coach is for learning support, not financial advice. Always verify against approved curriculum.
          </div>
        </div>
      </div>
    </>
  );
}

// ============================================================
// MENTOR DASHBOARD — lists submissions to review + questions tab
// ============================================================
function MentorDashboard({ profile, modules, onViewSubmission }) {
  const [activeTab, setActiveTab] = useState('submissions'); // submissions | questions | certificates
  const [allCerts, setAllCerts] = useState([]);
  const [certsLoading, setCertsLoading] = useState(false);
  const [viewingCert, setViewingCert] = useState(null);
  const [submissions, setSubmissions] = useState([]);
  const [profilesById, setProfilesById] = useState({});
  const [filter, setFilter] = useState('pending'); // pending | all
  const [loading, setLoading] = useState(true);
  // Questions tab state
  const [questions, setQuestions] = useState([]);
  const [questionsLoading, setQuestionsLoading] = useState(false);
  const [answerTexts, setAnswerTexts] = useState({}); // question_id -> text
  const [answerSending, setAnswerSending] = useState({}); // question_id -> bool
  const [qProfilesById, setQProfilesById] = useState({});

  useEffect(() => {
    if (!profile) return;
    let mounted = true;
    (async () => {
      // Mentor sees: submissions where they're the assigned mentor OR
      // submissions from apprentices whose mentor_id === their id.
      // Admin/approver sees all.
      let q = supabase.from('competency_submissions').select('*').order('submitted_at', { ascending: false });
      const { data: subs } = await q;
      if (!mounted) return;

      let visible = subs || [];
      if (profile.role === 'mentor') {
        const { data: mentees } = await supabase.from('profiles').select('id').eq('mentor_id', profile.id);
        const menteeIds = new Set((mentees || []).map(m => m.id));
        visible = visible.filter(s => menteeIds.has(s.apprentice_id) || s.mentor_id === profile.id);
      }
      setSubmissions(visible);

      // Fetch apprentice profiles for display
      const ids = Array.from(new Set(visible.map(s => s.apprentice_id)));
      if (ids.length > 0) {
        const { data: pp } = await supabase.from('profiles').select('id,full_name,email').in('id', ids);
        const map = {}; (pp || []).forEach(p => { map[p.id] = p; });
        setProfilesById(map);
      }
      setLoading(false);
    })();

    const channel = supabase
      .channel('submissions-mentor')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'competency_submissions' }, payload => {
        if (payload.eventType === 'INSERT') setSubmissions(prev => [payload.new, ...prev]);
        else if (payload.eventType === 'UPDATE') setSubmissions(prev => prev.map(s => s.id === payload.new.id ? payload.new : s));
      })
      .subscribe();

    return () => { mounted = false; supabase.removeChannel(channel); };
  }, [profile?.id, profile?.role]);

  // Load certificates when tab becomes active
  useEffect(() => {
    if (activeTab !== 'certificates' || !supabase) return;
    setCertsLoading(true);
    supabase.from('certificates').select('*').order('issued_at', { ascending: false })
      .then(({ data }) => { setAllCerts(data || []); setCertsLoading(false); });
  }, [activeTab]);

  // Load questions when tab becomes active
  useEffect(() => {
    if (activeTab !== 'questions' || !supabase) return;
    let mounted = true;
    setQuestionsLoading(true);
    (async () => {
      const { data: qs } = await supabase
        .from('questions')
        .select('*')
        .order('created_at', { ascending: false });
      if (!mounted) return;
      setQuestions(qs || []);
      // Fetch asker profiles
      const ids = Array.from(new Set((qs||[]).map(q => q.asker_id)));
      if (ids.length > 0) {
        const { data: pp } = await supabase.from('profiles').select('id,full_name,email').in('id', ids);
        const map = {}; (pp||[]).forEach(p => { map[p.id] = p; });
        if (mounted) setQProfilesById(map);
      }
      if (mounted) setQuestionsLoading(false);
    })();
    return () => { mounted = false; };
  }, [activeTab]);

  const sendAnswer = async (q) => {
    const text = (answerTexts[q.id] || '').trim();
    if (!text || !supabase) return;
    setAnswerSending(prev => ({ ...prev, [q.id]: true }));
    const { error } = await supabase.from('question_answers').insert({
      question_id: q.id,
      responder_id: profile.id,
      responder_name: profile.full_name || profile.email || 'Mentor',
      answer_text: text
    });
    if (!error) {
      await supabase.from('questions').update({ status: 'resolved', updated_at: new Date().toISOString() }).eq('id', q.id);
      setQuestions(prev => prev.map(x => x.id === q.id ? { ...x, status: 'resolved' } : x));
      setAnswerTexts(prev => ({ ...prev, [q.id]: '' }));
    }
    setAnswerSending(prev => ({ ...prev, [q.id]: false }));
  };

  const markResolved = async (q) => {
    if (!supabase) return;
    await supabase.from('questions').update({ status: 'resolved', updated_at: new Date().toISOString() }).eq('id', q.id);
    setQuestions(prev => prev.map(x => x.id === q.id ? { ...x, status: 'resolved' } : x));
  };

  const pending = submissions.filter(s => s.status === 'submitted' || s.status === 'under_review');
  const display = filter === 'pending' ? pending : submissions;

  if (loading) return <LoadingScreen/>;

  return (
    <main className="max-w-6xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <div className="eyebrow mb-3">Mentor Review</div>
      <h1 className="font-display text-4xl font-semibold mb-2">Apprentice submissions</h1>
      <p className="text-base mb-8" style={{ color: 'var(--gic-muted)' }}>
        Review demonstrated competencies, answer questions, and sign off on On-the-Job Learning hours.
      </p>

      {/* Tab bar */}
      <div className="flex gap-1 mb-8 border-b" style={{ borderColor: 'var(--gic-line)' }}>
        {[['submissions','Submissions'],['questions','Questions'],['certificates','Certificates']].map(([id,label]) => (
          <button key={id} onClick={() => setActiveTab(id)}
            className="px-5 py-3 text-sm font-medium"
            style={{ borderBottom: activeTab===id ? '2px solid var(--gic-blue)' : '2px solid transparent',
                     color: activeTab===id ? 'var(--gic-blue)' : 'var(--gic-muted)', marginBottom: '-1px' }}>
            {label}
            {id==='submissions' && pending.length > 0 && (
              <span className="ml-2 text-xs font-bold" style={{ color: 'var(--gic-amber)' }}>{pending.length}</span>
            )}
            {id==='questions' && questions.filter(q=>q.status==='open').length > 0 && (
              <span className="ml-2 text-xs font-bold" style={{ color: 'var(--gic-amber)' }}>{questions.filter(q=>q.status==='open').length}</span>
            )}
          </button>
        ))}
      </div>

      {activeTab === 'submissions' && <>
        <div className="flex items-center gap-2 mb-6">
          <button onClick={() => setFilter('pending')}
                  className={'px-4 py-2 rounded-full text-sm font-medium ' + (filter === 'pending' ? 'text-white' : '')}
                  style={filter === 'pending' ? { background: 'var(--gic-blue)' } : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
            Pending review ({pending.length})
          </button>
          <button onClick={() => setFilter('all')}
                  className={'px-4 py-2 rounded-full text-sm font-medium ' + (filter === 'all' ? 'text-white' : '')}
                  style={filter === 'all' ? { background: 'var(--gic-blue)' } : { background: 'var(--gic-bone)', color: 'var(--gic-ink)' }}>
            All ({submissions.length})
          </button>
        </div>

        {display.length === 0 ? (
          <div className="gic-card p-12 text-center">
            <ClipboardCheck size={28} className="mx-auto mb-4" style={{ color: 'var(--gic-warm)' }}/>
            <div className="font-display text-xl font-semibold mb-2">
              {filter === 'pending' ? 'Nothing pending' : 'No submissions yet'}
            </div>
            <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>
              {filter === 'pending'
                ? 'All caught up. New submissions will appear here in real time.'
                : 'When your apprentices submit recordings, they appear here.'}
            </p>
          </div>
        ) : (
          <div className="space-y-3">
            {display.map(s => {
              const apprentice = profilesById[s.apprentice_id];
              const mod = modules.find(m => m.id === s.module_id);
              return (
                <button key={s.id}
                        onClick={() => onViewSubmission(s, mod)}
                        className="w-full text-left gic-card p-5 hover:shadow-lg transition-all flex items-center justify-between">
                  <div className="flex items-start gap-4 flex-1">
                    <div className="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0"
                         style={{
                           background: s.status === 'approved' ? 'rgba(31,122,74,0.08)'
                                     : s.status === 'needs_revision' ? 'rgba(184,61,92,0.08)'
                                     : 'rgba(45,31,177,0.06)',
                           color:      s.status === 'approved' ? 'var(--gic-green)'
                                     : s.status === 'needs_revision' ? 'var(--gic-rose)'
                                     : 'var(--gic-blue)'
                         }}>
                      {s.status === 'approved' ? <CheckCircle2 size={20}/>
                       : s.status === 'needs_revision' ? <RotateCcw size={20}/>
                       : <Video size={20}/>}
                    </div>
                    <div className="flex-1">
                      <div className="font-medium">{apprentice?.full_name || apprentice?.email || 'Apprentice'}</div>
                      <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                        {mod ? `Module ${String(mod.module_number).padStart(2,'0')} · ${mod.title}` : 'Unknown module'}
                      </div>
                      <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>
                        Submitted {fmtRelative(s.submitted_at)}
                        {s.duration_seconds ? ` · ${Math.floor(s.duration_seconds/60)}m ${s.duration_seconds%60}s` : ''}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="badge" style={
                      s.status === 'approved' ? { color: 'var(--gic-green)', background: 'rgba(31,122,74,0.08)' }
                      : s.status === 'needs_revision' ? { color: 'var(--gic-rose)', background: 'rgba(184,61,92,0.08)' }
                      : { color: 'var(--gic-blue)' }
                    }>
                      {s.status.replace('_', ' ')}
                    </span>
                    <ChevronRight size={16} style={{ color: 'var(--gic-warm)' }}/>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </>}

      {activeTab === 'certificates' && (
        certsLoading ? <LoadingScreen /> : allCerts.length === 0 ? (
          <div className="gic-card p-12 text-center">
            <Award size={28} className="mx-auto mb-4" style={{ color: 'var(--gic-warm)' }}/>
            <div className="font-display text-xl font-semibold mb-2">No certificates issued yet</div>
            <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>Certificates appear here once apprentices pass the final exam.</p>
          </div>
        ) : (
          <div className="space-y-3">
            {allCerts.map(c => (
              <div key={c.id} className="gic-card p-5 flex items-center justify-between">
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 rounded-full flex items-center justify-center" style={{ background: 'rgba(45,31,177,0.08)', color: 'var(--gic-blue)' }}>
                    <Award size={20}/>
                  </div>
                  <div>
                    <div className="font-semibold">{c.user_name}</div>
                    <div className="text-xs mt-0.5" style={{ color: 'var(--gic-muted)' }}>{c.user_email} · Score: {c.exam_score}%</div>
                    <div className="text-xs mt-0.5" style={{ color: 'var(--gic-warm)' }}>
                      Issued {new Date(c.issued_at).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })} · {c.certificate_number}
                    </div>
                  </div>
                </div>
                <button onClick={() => setViewingCert(c)} className="btn-ghost flex items-center gap-1.5 text-sm" style={{ color: 'var(--gic-blue)' }}>
                  <Download size={13}/> View / Print
                </button>
              </div>
            ))}
            {viewingCert && <CertificateView cert={viewingCert} onClose={() => setViewingCert(null)} />}
          </div>
        )
      )}

      {activeTab === 'questions' && <>
        {questionsLoading ? <LoadingScreen /> : questions.length === 0 ? (
          <div className="gic-card p-12 text-center">
            <MessageSquare size={28} className="mx-auto mb-4" style={{ color: 'var(--gic-warm)' }}/>
            <div className="font-display text-xl font-semibold mb-2">No questions yet</div>
            <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>Apprentice questions from their lesson pages will appear here.</p>
          </div>
        ) : (
          <div className="space-y-4">
            {questions.map(q => {
              const asker = qProfilesById[q.asker_id];
              return (
                <div key={q.id} className="gic-card p-6">
                  <div className="flex items-start justify-between gap-4 mb-3">
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1">
                        {asker && <span className="text-xs font-semibold">{asker.full_name || asker.email}</span>}
                        {q.lesson_title && <span className="eyebrow">{q.lesson_title}</span>}
                        {q.module_number && <span className="text-xs" style={{ color: 'var(--gic-warm)' }}>Module {String(q.module_number).padStart(2,'0')}</span>}
                      </div>
                      <div className="font-semibold text-sm leading-relaxed">{q.question_text}</div>
                      <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>{fmtRelative(q.created_at)}</div>
                    </div>
                    <span className="badge flex-shrink-0"
                      style={q.status === 'resolved'
                        ? { color: 'var(--gic-green)', background: 'rgba(31,122,74,0.08)' }
                        : { color: 'var(--gic-amber)', background: 'rgba(200,132,28,0.08)' }}>
                      {q.status === 'resolved' ? 'Answered' : 'Open'}
                    </span>
                  </div>
                  {q.status === 'open' && (
                    <div className="mt-4 pt-4 border-t" style={{ borderColor: 'var(--gic-line)' }}>
                      <textarea
                        value={answerTexts[q.id] || ''}
                        onChange={e => setAnswerTexts(prev => ({ ...prev, [q.id]: e.target.value }))}
                        placeholder="Type your answer here…"
                        rows={3}
                        className="w-full border rounded-lg p-3 text-sm mb-3 resize-none"
                        style={{ borderColor: 'var(--gic-line)' }}
                      />
                      <div className="flex items-center gap-2">
                        <button onClick={() => sendAnswer(q)}
                          disabled={!(answerTexts[q.id]||'').trim() || answerSending[q.id]}
                          className="btn-primary flex items-center gap-2 text-sm">
                          <Send size={13}/> {answerSending[q.id] ? 'Sending…' : 'Send response'}
                        </button>
                        <button onClick={() => markResolved(q)} className="btn-ghost text-sm" style={{ color: 'var(--gic-muted)' }}>
                          Mark resolved
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </>}
    </main>
  );
}

// SPONSORS ADMIN — manage employer sponsors + tokens
// ============================================================
function SponsorsAdmin({ profile }) {
  const [sponsors, setSponsors] = useState([]);
  const [tokens, setTokens]     = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showSponsorForm, setShowSponsorForm] = useState(false);
  const [showTokenForm, setShowTokenForm]     = useState(null); // sponsor object
  const [copiedId, setCopiedId] = useState(null);

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [{ data: s }, { data: t }] = await Promise.all([
        supabase.from('employer_sponsors').select('*').order('created_at', { ascending: false }),
        supabase.from('sponsorship_tokens').select('*').order('created_at', { ascending: false })
      ]);
      if (!mounted) return;
      setSponsors(s || []);
      setTokens(t || []);
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, []);

  const addSponsor = async (form) => {
    const { data, error } = await supabase
      .from('employer_sponsors')
      .insert({ ...form, created_by: profile.id })
      .select()
      .single();
    if (error) { alert('Failed: ' + error.message); return; }
    setSponsors(prev => [data, ...prev]);
    setShowSponsorForm(false);
  };

  const addToken = async (sponsor, form) => {
    // Generate token: GIC-XXXX-XXXX (random base32)
    const rand = () => Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4).padEnd(4, 'X');
    const token = `GIC-${rand()}-${rand()}`;
    const { data, error } = await supabase
      .from('sponsorship_tokens')
      .insert({
        token,
        employer_sponsor_id: sponsor.id,
        max_uses: form.max_uses,
        expires_at: form.expires_at || null,
        created_by: profile.id
      })
      .select()
      .single();
    if (error) { alert('Failed: ' + error.message); return; }
    setTokens(prev => [data, ...prev]);
    setShowTokenForm(null);
  };

  const copyToken = (t) => {
    navigator.clipboard.writeText(t.token);
    setCopiedId(t.id);
    setTimeout(() => setCopiedId(null), 1500);
  };

  if (loading) return <LoadingScreen/>;

  return (
    <main className="max-w-6xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <div className="eyebrow mb-3">Administration</div>
      <h1 className="font-display text-4xl font-semibold mb-2">Employer sponsors</h1>
      <p className="text-base mb-10" style={{ color: 'var(--gic-muted)' }}>
        Manage sponsoring organizations and generate enrollment codes for their apprentices.
      </p>

      {/* Sponsors */}
      <div className="mb-12">
        <div className="flex items-center justify-between mb-5">
          <div className="font-display text-xl font-semibold">Sponsoring organizations</div>
          <button onClick={() => setShowSponsorForm(true)} className="btn-primary flex items-center gap-2">
            <Plus size={14}/> Add sponsor
          </button>
        </div>

        {sponsors.length === 0 ? (
          <div className="gic-card p-10 text-center text-sm" style={{ color: 'var(--gic-muted)' }}>
            No sponsors yet. Add the first organization to begin generating enrollment codes.
          </div>
        ) : (
          <div className="space-y-3">
            {sponsors.map(s => {
              const sponsorTokens = tokens.filter(t => t.employer_sponsor_id === s.id);
              return (
                <div key={s.id} className="gic-card p-5">
                  <div className="flex items-start justify-between mb-4">
                    <div>
                      <div className="font-display text-lg font-semibold">{s.name}</div>
                      <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                        {[s.contact_name, s.contact_email, s.contact_phone].filter(Boolean).join(' · ')}
                      </div>
                      {s.address && <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>{s.address}</div>}
                    </div>
                    <button onClick={() => setShowTokenForm(s)} className="btn-secondary flex items-center gap-2 text-sm">
                      <KeySquare size={12}/> Generate code
                    </button>
                  </div>
                  {sponsorTokens.length > 0 && (
                    <div className="space-y-1.5 pt-3 border-t" style={{ borderColor: 'var(--gic-line)' }}>
                      {sponsorTokens.map(t => (
                        <div key={t.id} className="flex items-center justify-between text-sm py-1">
                          <code className="font-mono px-2 py-1 rounded" style={{ background: 'var(--gic-bone)' }}>{t.token}</code>
                          <div className="flex items-center gap-3 text-xs" style={{ color: 'var(--gic-muted)' }}>
                            <span>{t.uses}/{t.max_uses} used</span>
                            {t.expires_at && <span>· expires {new Date(t.expires_at).toLocaleDateString()}</span>}
                            <button onClick={() => copyToken(t)} className="btn-ghost flex items-center gap-1">
                              {copiedId === t.id ? <><Check size={12}/> Copied</> : <><Copy size={12}/> Copy</>}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showSponsorForm && (
        <SponsorForm onSave={addSponsor} onClose={() => setShowSponsorForm(false)}/>
      )}
      {showTokenForm && (
        <TokenForm sponsor={showTokenForm} onSave={(form) => addToken(showTokenForm, form)} onClose={() => setShowTokenForm(null)}/>
      )}
    </main>
  );
}

// READ ALONG BAR — text-to-speech with word highlight
// ============================================================
// ============================================================
// SELECTION READER — floating "Read selection" button on highlight
// ============================================================
function SelectionReader() {
  const [selText, setSelText] = useState('');
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const [show, setShow] = useState(false);

  useEffect(() => {
    const onUp = () => {
      const sel = window.getSelection();
      const selected = sel?.toString().trim();
      if (selected && selected.length > 3) {
        try {
          const rect = sel.getRangeAt(0).getBoundingClientRect();
          setPos({ x: rect.left + rect.width / 2, y: rect.top + window.scrollY - 48 });
          setSelText(selected);
          setShow(true);
        } catch {}
      } else {
        setShow(false);
      }
    };
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
    return () => { document.removeEventListener('mouseup', onUp); document.removeEventListener('touchend', onUp); };
  }, []);

  if (!show) return null;
  return (
    <div style={{ position: 'absolute', left: pos.x, top: pos.y, transform: 'translateX(-50%)', zIndex: 999 }}>
      <button
        onClick={() => {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(selText), { rate: 1 }));
          setShow(false);
        }}
        onMouseDown={e => e.preventDefault()}
        className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-white shadow-lg"
        style={{ background: 'var(--gic-blue)', whiteSpace: 'nowrap' }}>
        <Headphones size={11}/> Read selection
      </button>
    </div>
  );
}

// ============================================================
// LESSON PLAYER — block-by-block TTS with controls
// ============================================================
function LessonPlayer({ blocks, activeBlock, setActiveBlock }) {
  const [open, setOpen]       = useState(false);
  const [playing, setPlaying] = useState(false);
  const [paused, setPaused]   = useState(false);
  const [rate, setRate]       = useState(1);
  const [words, setWords]     = useState([]);
  const [wordIdx, setWordIdx] = useState(-1);
  const synth = window.speechSynthesis;

  const blockText = useCallback((b) => {
    if (!b) return '';
    const clean = h => (h||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    switch (b.type) {
      case 'paragraph': case 'heading': case 'subheading': return clean(b.text);
      case 'list': case 'numbered': return (b.items||[]).map(clean).join('. ');
      case 'callout': return [b.title, clean(b.text)].filter(Boolean).join('. ');
      case 'glossary': return (b.terms||[]).map(t=>`${t.term}: ${t.definition}`).join('. ');
      case 'activity': return [b.title, b.prompt, ...(b.steps||[])].filter(Boolean).map(clean).join('. ');
      case 'case_study': return [b.title, b.scenario, b.discussion].filter(Boolean).map(clean).join('. ');
      default: return '';
    }
  }, []);

  const speakFrom = useCallback((startIdx, r) => {
    const spRate = r ?? rate;
    synth.cancel(); setPaused(false);
    let idx = startIdx;
    while (idx < blocks.length && !blockText(blocks[idx])) idx++;
    if (idx >= blocks.length) { setPlaying(false); setActiveBlock(-1); setWordIdx(-1); return; }
    setActiveBlock(idx);
    const text = blockText(blocks[idx]);
    const ws = text.split(/\s+/).filter(Boolean);
    setWords(ws); setWordIdx(0);
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = spRate;
    let wi = 0;
    utt.onboundary = e => { if (e.name === 'word') setWordIdx(wi++); };
    utt.onend = () => { setWordIdx(-1); speakFrom(idx + 1, spRate); };
    utt.onerror = () => { setPlaying(false); setWordIdx(-1); };
    setPlaying(true);
    synth.speak(utt);
    // Scroll active block into view
    setTimeout(() => document.getElementById(`tts-block-${idx}`)?.scrollIntoView({ behavior:'smooth', block:'center' }), 80);
  }, [blocks, rate, blockText]);

  const handlePlay   = () => paused ? (synth.resume(), setPlaying(true), setPaused(false)) : speakFrom(activeBlock >= 0 ? activeBlock : 0);
  const handlePause  = () => { synth.pause(); setPlaying(false); setPaused(true); };
  const handleStop   = () => { synth.cancel(); setPlaying(false); setPaused(false); setWordIdx(-1); setActiveBlock(-1); };
  const handlePrev   = () => speakFrom(Math.max(0, (activeBlock > 0 ? activeBlock : 0) - 1));
  const handleNext   = () => speakFrom((activeBlock >= 0 ? activeBlock : 0) + 1);
  const handleRate   = r  => { setRate(r); if (playing || paused) speakFrom(activeBlock >= 0 ? activeBlock : 0, r); };

  useEffect(() => () => synth.cancel(), []);

  const readable = blocks.filter(b => blockText(b)).length;

  if (!open) return (
    <button onClick={() => setOpen(true)}
      className="mb-6 flex items-center gap-2 text-sm font-medium px-4 py-2 rounded-full border transition hover:opacity-80"
      style={{ borderColor:'var(--gic-blue)', color:'var(--gic-blue)', background:'rgba(45,31,177,0.04)' }}>
      <Headphones size={14}/> Listen to this lesson
    </button>
  );

  return (
    <div className="mb-6 rounded-xl border overflow-hidden" style={{ borderColor:'var(--gic-blue)', background:'rgba(45,31,177,0.03)' }}>
      <div className="flex items-center gap-2 px-4 py-3">
        {/* Prev */}
        <button onClick={handlePrev} disabled={activeBlock <= 0} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-stone-100 disabled:opacity-30 transition">
          <SkipBack size={14}/>
        </button>
        {/* Play / Pause */}
        {playing
          ? <button onClick={handlePause} className="w-10 h-10 rounded-full flex items-center justify-center text-white flex-shrink-0" style={{ background:'var(--gic-blue)' }}><Pause size={16}/></button>
          : <button onClick={handlePlay}  className="w-10 h-10 rounded-full flex items-center justify-center text-white flex-shrink-0" style={{ background:'var(--gic-blue)' }}><Play  size={16}/></button>
        }
        {/* Next */}
        <button onClick={handleNext} disabled={activeBlock >= blocks.length - 1} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-stone-100 disabled:opacity-30 transition">
          <SkipForward size={14}/>
        </button>

        {/* Caption / status */}
        <div className="flex-1 min-w-0 ml-1">
          {playing && wordIdx >= 0 && words.length > 0 ? (
            <div className="text-xs leading-relaxed truncate" style={{ color:'var(--gic-ink)' }}>
              {words.slice(Math.max(0, wordIdx - 3), wordIdx + 8).map((w, i) => {
                const cur = Math.max(0, wordIdx - 3) + i === wordIdx;
                return <span key={i} style={cur ? { background:'rgba(45,31,177,0.2)', borderRadius:'3px', padding:'1px 3px', fontWeight:600 } : {}}>{w} </span>;
              })}
            </div>
          ) : (
            <div className="text-xs" style={{ color:'var(--gic-muted)' }}>
              {paused ? 'Paused — press play to continue' : `${readable} sections · Press play to listen`}
            </div>
          )}
        </div>

        {/* Block counter + speed + close */}
        <div className="flex items-center gap-2 flex-shrink-0">
          {activeBlock >= 0 && (
            <span className="text-xs font-mono" style={{ color:'var(--gic-warm)' }}>{activeBlock + 1}/{blocks.length}</span>
          )}
          <select value={rate} onChange={e => handleRate(parseFloat(e.target.value))}
            className="text-xs border rounded px-1.5 py-1" style={{ borderColor:'var(--gic-line)' }}>
            <option value={0.75}>0.75×</option>
            <option value={1}>1×</option>
            <option value={1.25}>1.25×</option>
            <option value={1.5}>1.5×</option>
            <option value={2}>2×</option>
          </select>
          <button onClick={() => { handleStop(); setOpen(false); }}
            className="w-6 h-6 flex items-center justify-center rounded hover:bg-stone-100" style={{ color:'var(--gic-muted)' }}>
            <X size={12}/>
          </button>
        </div>
      </div>

      {/* Block progress dots — click any to jump */}
      <div className="flex gap-1.5 px-4 pb-3 flex-wrap">
        {blocks.map((b, i) => {
          const has = !!blockText(b);
          const isActive = i === activeBlock;
          return (
            <button key={i} onClick={() => speakFrom(i)} title={b.title || b.type}
              style={{ width:8, height:8, borderRadius:'50%', flexShrink:0, transition:'all 0.2s',
                background: isActive ? 'var(--gic-blue)' : has ? 'var(--gic-line)' : 'rgba(0,0,0,0.06)',
                transform: isActive ? 'scale(1.4)' : 'scale(1)' }} />
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// ASK QUESTION BUTTON — submit a question from within a lesson
// ============================================================
function AskQuestionButton({ profile, moduleNumber, lessonIndex, lessonTitle }) {
  const [open, setOpen] = useState(false);
  const [text, setText] = useState('');
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);

  const submit = async () => {
    if (!text.trim() || !supabase) return;
    setSending(true);
    const { error } = await supabase.from('questions').insert({
      asker_id: profile.id,
      module_number: moduleNumber,
      lesson_index: lessonIndex,
      lesson_title: lessonTitle,
      question_text: text.trim()
    });
    setSending(false);
    if (!error) { setSent(true); setText(''); setTimeout(() => { setSent(false); setOpen(false); }, 2000); }
  };

  return (
    <div className="mt-10 mb-6">
      <div className="gic-rule mb-6"><span className="font-display italic text-sm">?</span></div>
      {!open && !sent && (
        <button onClick={() => setOpen(true)} className="btn-ghost flex items-center gap-2 text-sm" style={{ color: 'var(--gic-blue)' }}>
          <MessageSquare size={14} /> Have a question about this lesson?
        </button>
      )}
      {sent && <div className="text-sm text-green-700">✓ Question sent to your mentor. You'll see the response in My Progress.</div>}
      {open && (
        <div className="gic-card p-6">
          <div className="eyebrow mb-3 flex items-center gap-1.5"><MessageSquare size={11}/> Ask your mentor</div>
          <div className="font-display text-lg font-semibold mb-1">Have a question?</div>
          <p className="text-sm mb-4" style={{ color: 'var(--gic-muted)' }}>Your question will be sent to your instructor or mentor for review.</p>
          <textarea
            value={text} onChange={e => setText(e.target.value)}
            placeholder="Type your question here..."
            rows={4}
            className="w-full border rounded-lg p-3 text-sm mb-4 resize-none"
            style={{ borderColor: 'var(--gic-line)' }}
          />
          <div className="flex items-center gap-3">
            <button onClick={submit} disabled={!text.trim() || sending} className="btn-primary flex items-center gap-2 text-sm">
              <Send size={13}/> {sending ? 'Sending…' : 'Send question'}
            </button>
            <button onClick={() => { setOpen(false); setText(''); }} className="btn-ghost text-sm">Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// QUESTIONS PAGE — apprentice view of their questions & answers
// ============================================================
function QuestionsPage({ profile }) {
  const [questions, setQuestions] = useState([]);
  const [answers, setAnswers] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!supabase || !profile?.id) return;
    let mounted = true;
    (async () => {
      const { data: qs } = await supabase
        .from('questions')
        .select('*')
        .eq('asker_id', profile.id)
        .order('created_at', { ascending: false });
      if (!mounted || !qs) return;
      setQuestions(qs);
      const ids = qs.map(q => q.id);
      if (ids.length > 0) {
        const { data: ans } = await supabase.from('question_answers').select('*').in('question_id', ids);
        if (ans && mounted) {
          const map = {};
          ans.forEach(a => { if (!map[a.question_id]) map[a.question_id] = []; map[a.question_id].push(a); });
          setAnswers(map);
        }
      }
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, [profile?.id]);

  if (loading) return <div className="py-12 text-center"><LoadingScreen /></div>;

  return (
    <div className="animate-fade-in">
      <div className="eyebrow mb-3">My Questions</div>
      <h2 className="font-display text-2xl font-semibold mb-2">Questions & Responses</h2>
      <p className="text-sm mb-8" style={{ color: 'var(--gic-muted)' }}>Questions you've sent to your mentors and their responses.</p>
      {questions.length === 0 ? (
        <div className="gic-card p-10 text-center">
          <MessageSquare size={28} className="mx-auto mb-3" style={{ color: 'var(--gic-warm)' }} />
          <div className="font-display text-xl font-semibold mb-2">No questions yet</div>
          <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>When you have questions during a lesson, use the "Ask your mentor" button at the bottom of each lesson.</p>
        </div>
      ) : (
        <div className="space-y-4">
          {questions.map(q => (
            <div key={q.id} className="gic-card p-6">
              <div className="flex items-start justify-between gap-4 mb-3">
                <div>
                  {q.lesson_title && <div className="eyebrow mb-1">{q.lesson_title}</div>}
                  <div className="font-semibold text-sm">{q.question_text}</div>
                </div>
                <span className="badge flex-shrink-0"
                  style={q.status === 'resolved'
                    ? { color: 'var(--gic-green)', background: 'rgba(31,122,74,0.08)' }
                    : { color: 'var(--gic-amber)', background: 'rgba(200,132,28,0.08)' }}>
                  {q.status === 'resolved' ? 'Answered' : 'Pending'}
                </span>
              </div>
              <div className="text-xs mb-3" style={{ color: 'var(--gic-warm)' }}>{fmtRelative(q.created_at)}</div>
              {(answers[q.id] || []).map(a => (
                <div key={a.id} className="mt-3 pl-4 border-l-2 text-sm" style={{ borderColor: 'var(--gic-blue)' }}>
                  <div className="font-semibold mb-0.5" style={{ color: 'var(--gic-blue)' }}>{a.responder_name || 'Mentor'}</div>
                  <div className="leading-relaxed">{a.answer_text}</div>
                </div>
              ))}
              {!(answers[q.id]||[]).length && (
                <div className="text-xs mt-2 italic" style={{ color: 'var(--gic-muted)' }}>Awaiting response from your mentor…</div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  switch (block.type) {

      return (

      return (
        <div className="space-y-2">
          <input value={block.title||''} onChange={e=>onUpdate({title:e.target.value})} className={ic} style={fs} placeholder="Case study title" />
          <textarea value={block.scenario||''} onChange={e=>onUpdate({scenario:e.target.value})} rows={3} className={tc} style={fs} placeholder="Scenario description..." />
          <textarea value={block.discussion||''} onChange={e=>onUpdate({discussion:e.target.value})} rows={3} className={tc} style={fs} placeholder="Discussion / analysis..." />
        </div>
      );
    case 'divider':
      return <div className="text-xs text-center py-1" style={{color:'var(--gic-muted)'}}>— section break —</div>;
    default:
      return <div className="text-xs" style={{color:'var(--gic-muted)'}}>Unknown block type: {block.type}</div>;
  }
}

function BlockEditor({ block, onUpdate, onDelete, onMove, isFirst, isLast, bIdx, onReorder }) {
  const [isDragging, setIsDragging] = useState(false);
  const label = { paragraph:'Text', heading:'Heading', subheading:'Subheading', list:'Bullet List',
    numbered:'Numbered List', callout:'Callout', video:'Video', image:'Image',
    audio:'Audio', glossary:'Glossary', activity:'Activity', case_study:'Case Study', divider:'Divider' }[block.type] || block.type;
  const color = BLOCK_COLORS[block.type] || '#6b7280';

  return (
    <div className="border rounded-lg overflow-hidden"
      style={{borderColor:'rgba(0,0,0,0.1)', opacity: isDragging ? 0.5 : 1, cursor:'grab'}}
      draggable="true"
      onDragStart={e => { e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', String(bIdx)); setIsDragging(true); }}
      onDragEnd={() => setIsDragging(false)}
      onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; }}
      onDrop={e => { e.preventDefault(); const from = parseInt(e.dataTransfer.getData('text/plain')); if (from !== bIdx && onReorder) onReorder(from, bIdx); }}
    >
      <div className="flex items-center gap-2 px-3 py-2" style={{background:'rgba(0,0,0,0.02)'}}>
        <span className="text-xs select-none" style={{color:'var(--gic-warm)',letterSpacing:'0.05em'}}>⠿</span>
        <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{background:color+'18', color}}>{label}</span>
        <div className="flex-1" />
        <button onClick={()=>onMove(-1)} disabled={isFirst} className="w-5 h-5 flex items-center justify-center rounded hover:bg-stone-100 disabled:opacity-25 text-xs">↑</button>
        <button onClick={()=>onMove(1)} disabled={isLast} className="w-5 h-5 flex items-center justify-center rounded hover:bg-stone-100 disabled:opacity-25 text-xs">↓</button>
        <button onClick={onDelete} className="w-5 h-5 flex items-center justify-center rounded hover:bg-red-50" style={{color:'var(--gic-rose)'}}><X size={11}/></button>
      </div>
      <div className="p-3">
        <BlockFields block={block} onUpdate={onUpdate} />
      </div>
    </div>
  );
}

function ModuleEditor({ mod, onClose, onSaved }) {
  const [title, setTitle] = useState(mod.title || '');
  const [desc, setDesc] = useState(mod.short_description || '');
  const [objectives, setObjectives] = useState((mod.learning_objectives || []).join('\n'));
  const [activeTab, setActiveTab] = useState('meta');
  const [lessonMode, setLessonMode] = useState('visual'); // visual | json
  const [lessonsData, setLessonsData] = useState(() => JSON.parse(JSON.stringify(mod.content?.lessons || [])));
  const [lessonsJson, setLessonsJson] = useState(() => JSON.stringify(mod.content?.lessons || [], null, 2));
  const [jsonError, setJsonError] = useState('');
  const [expandedLesson, setExpandedLesson] = useState(0);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  const switchToJson = () => { setLessonsJson(JSON.stringify(lessonsData, null, 2)); setJsonError(''); setLessonMode('json'); };
  const switchToVisual = () => {
    try { setLessonsData(JSON.parse(lessonsJson)); setJsonError(''); setLessonMode('visual'); }
    catch(e) { setJsonError('Fix the JSON error before switching: ' + e.message); }
  };

  // Lesson-level helpers
  const updateLesson = (idx, patch) => setLessonsData(prev => prev.map((l,i) => i===idx ? {...l,...patch} : l));
  const addLesson = () => {
    setLessonsData(prev => [...prev, {title:'New Lesson', summary:'', read_time:'', blocks:[]}]);
    setExpandedLesson(lessonsData.length);
  };
  const deleteLesson = (idx) => {
    if (!confirm('Delete this lesson and all its content?')) return;
    setLessonsData(prev => prev.filter((_,i) => i!==idx));
    setExpandedLesson(prev => Math.max(0, prev > idx ? prev-1 : prev));
  };
  const moveLesson = (idx, dir) => {
    setLessonsData(prev => { const a=[...prev], to=idx+dir; if(to<0||to>=a.length)return a; [a[idx],a[to]]=[a[to],a[idx]]; return a; });
    setExpandedLesson(idx+dir);
  };

  // Block-level helpers
  const updateBlock = (lIdx, bIdx, patch) =>
    updateLesson(lIdx, { blocks: lessonsData[lIdx].blocks.map((b,i) => i===bIdx ? {...b,...patch} : b) });
  const deleteBlock = (lIdx, bIdx) =>
    updateLesson(lIdx, { blocks: lessonsData[lIdx].blocks.filter((_,i) => i!==bIdx) });
  const moveBlock = (lIdx, bIdx, dir) => {
    const blocks = [...lessonsData[lIdx].blocks];
    const to = bIdx+dir;
    if (to<0||to>=blocks.length) return;
    [blocks[bIdx],blocks[to]] = [blocks[to],blocks[bIdx]];
    updateLesson(lIdx, { blocks });
  };
  const addBlock = (lIdx, type) =>
    updateLesson(lIdx, { blocks: [...lessonsData[lIdx].blocks, {...(BLOCK_DEFAULTS[type]||{type})}] });

  const save = async () => {
    setSaving(true); setError('');
    let finalLessons = lessonsData;
    if (lessonMode === 'json') {
      try { finalLessons = JSON.parse(lessonsJson); }
      catch(e) { setError('JSON is invalid: ' + e.message); setSaving(false); return; }
    }
    const objs = objectives.split('\n').map(s=>s.trim()).filter(Boolean);
    const { data, error: err } = await supabase.from('modules').update({
      title, short_description: desc, learning_objectives: objs,
      content: { ...(mod.content||{}), lessons: finalLessons },
      updated_at: new Date().toISOString()
    }).eq('id', mod.id).select().single();
    setSaving(false);
    if (err) { setError(err.message); return; }
    if (data) onSaved(data);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center" style={{background:'rgba(15,22,49,0.6)',overflowY:'auto',paddingTop:'40px',paddingBottom:'40px'}}>
      <div className="gic-card w-full max-w-3xl mx-4 animate-fade-in">

        {/* Header */}
        <div className="flex items-center justify-between p-6 border-b" style={{borderColor:'var(--gic-line)'}}>
          <div>
            <div className="eyebrow mb-1">Admin · Module Editor</div>
            <div className="font-display text-xl font-semibold">Module {String(mod.module_number).padStart(2,'0')} — {mod.title}</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>

        {/* Tab bar */}
        <div className="flex border-b" style={{borderColor:'var(--gic-line)'}}>
          {[['meta','Overview'],['lessons','Lesson Content']].map(([id,label]) => (
            <button key={id} onClick={() => setActiveTab(id)} className="px-6 py-3 text-sm font-medium"
              style={{borderBottom: activeTab===id ? '2px solid var(--gic-blue)' : '2px solid transparent',
                      color: activeTab===id ? 'var(--gic-blue)' : 'var(--gic-muted)'}}>
              {label}
            </button>
          ))}
        </div>

        <div className="p-6">

          {/* ── OVERVIEW TAB ── */}
          {activeTab === 'meta' && (
            <div className="space-y-5">
              <div>
                <label className="eyebrow mb-1 block">Module Title</label>
                <input value={title} onChange={e=>setTitle(e.target.value)} className="w-full border rounded-lg p-3 text-sm" style={{borderColor:'var(--gic-line)'}} />
              </div>
              <div>
                <label className="eyebrow mb-1 block">Short Description <span style={{color:'var(--gic-muted)',fontWeight:'normal'}}>— shown on the modules page</span></label>
                <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={3} className="w-full border rounded-lg p-3 text-sm resize-none" style={{borderColor:'var(--gic-line)'}} />
              </div>
              <div>
                <label className="eyebrow mb-1 block">Learning Objectives <span style={{color:'var(--gic-muted)',fontWeight:'normal'}}>— one per line</span></label>
                <textarea value={objectives} onChange={e=>setObjectives(e.target.value)} rows={8} className="w-full border rounded-lg p-3 text-sm resize-none" style={{borderColor:'var(--gic-line)'}}
                  placeholder={"Explain the difference between gross and net income\nIdentify fixed, variable, and periodic expenses\nConstruct a household net worth statement"} />
              </div>
            </div>
          )}

          {/* ── LESSONS TAB ── */}
          {activeTab === 'lessons' && (
            <div>
              {/* Mode toggle pill */}
              <div className="flex items-center justify-between mb-5">
                <div className="text-sm font-medium" style={{color:'var(--gic-ink)'}}>
                  {lessonMode==='visual' ? `${lessonsData.length} lesson${lessonsData.length!==1?'s':''}` : 'Editing raw JSON'}
                </div>
                <div className="flex items-center p-1 rounded-lg" style={{background:'var(--gic-ink)'}}>
                  <button onClick={() => lessonMode==='json' ? switchToVisual() : null}
                    className="px-3 py-1.5 rounded text-xs font-semibold transition"
                    style={{background: lessonMode==='visual'?'white':'transparent',
                            color: lessonMode==='visual'?'var(--gic-blue)':'rgba(255,255,255,0.5)',
                            boxShadow: lessonMode==='visual'?'0 1px 3px rgba(0,0,0,0.15)':'none'}}>
                    Visual Editor
                  </button>
                  <button onClick={() => lessonMode==='visual' ? switchToJson() : null}
                    className="px-3 py-1.5 rounded text-xs font-semibold transition"
                    style={{background: lessonMode==='json'?'white':'transparent',
                            color: lessonMode==='json'?'var(--gic-blue)':'rgba(255,255,255,0.5)',
                            boxShadow: lessonMode==='json'?'0 1px 3px rgba(0,0,0,0.15)':'none'}}>
                    JSON
                  </button>
                </div>
              </div>

              {jsonError && <div className="text-xs p-3 mb-4 rounded" style={{background:'rgba(184,61,92,0.08)',color:'var(--gic-rose)'}}>{jsonError}</div>}

              {/* JSON MODE */}
              {lessonMode === 'json' && (
                <textarea value={lessonsJson} onChange={e=>setLessonsJson(e.target.value)} rows={24}
                  className="w-full border rounded-lg p-3 text-xs font-mono resize-none"
                  style={{borderColor:'var(--gic-line)',lineHeight:'1.5'}} />
              )}

              {/* VISUAL MODE */}
              {lessonMode === 'visual' && (
                <div className="space-y-2">
                  {lessonsData.map((lesson, lIdx) => (
                    <div key={lIdx} className="border rounded-lg overflow-hidden" style={{borderColor:'var(--gic-line)'}}>
                      {/* Lesson row */}
                      <div className="flex items-center gap-2 p-3 cursor-pointer select-none hover:bg-stone-50 transition"
                           style={{background: expandedLesson===lIdx ? 'rgba(45,31,177,0.03)' : 'white'}}
                           onClick={() => setExpandedLesson(expandedLesson===lIdx ? -1 : lIdx)}>
                        <span className="font-mono text-xs w-6 text-center flex-shrink-0" style={{color:'var(--gic-warm)'}}>{String(lIdx+1).padStart(2,'0')}</span>
                        <span className="flex-1 font-semibold text-sm truncate">{lesson.title || 'Untitled lesson'}</span>
                        <span className="text-xs mr-1" style={{color:'var(--gic-muted)'}}>{(lesson.blocks||[]).length} block{(lesson.blocks||[]).length!==1?'s':''}</span>
                        <button onClick={e=>{e.stopPropagation();moveLesson(lIdx,-1);}} disabled={lIdx===0} className="w-6 h-6 flex items-center justify-center rounded hover:bg-stone-100 disabled:opacity-25 text-xs">↑</button>
                        <button onClick={e=>{e.stopPropagation();moveLesson(lIdx,1);}} disabled={lIdx===lessonsData.length-1} className="w-6 h-6 flex items-center justify-center rounded hover:bg-stone-100 disabled:opacity-25 text-xs">↓</button>
                        <button onClick={e=>{e.stopPropagation();deleteLesson(lIdx);}} className="w-6 h-6 flex items-center justify-center rounded hover:bg-red-50" style={{color:'var(--gic-rose)'}}><X size={12}/></button>
                        <span className="text-xs" style={{color:'var(--gic-muted)'}}>{expandedLesson===lIdx ? '▲' : '▼'}</span>
                      </div>

                      {/* Lesson detail */}
                      {expandedLesson === lIdx && (
                        <div className="border-t p-4 space-y-4 bg-stone-50" style={{borderColor:'var(--gic-line)'}}>
                          {/* Lesson metadata */}
                          <div className="grid grid-cols-2 gap-3 p-4 bg-white rounded-lg border" style={{borderColor:'var(--gic-line)'}}>
                            <div className="col-span-2">
                              <label className="text-xs font-semibold block mb-1" style={{color:'var(--gic-warm)'}}>Lesson Title</label>
                              <input value={lesson.title||''} onChange={e=>updateLesson(lIdx,{title:e.target.value})}
                                className="w-full border rounded p-2 text-sm" style={{borderColor:'var(--gic-line)'}} />
                            </div>
                            <div className="col-span-2">
                              <label className="text-xs font-semibold block mb-1" style={{color:'var(--gic-warm)'}}>One-line summary <span style={{fontWeight:'normal',opacity:0.7}}>(shown in the lesson list)</span></label>
                              <input value={lesson.summary||''} onChange={e=>updateLesson(lIdx,{summary:e.target.value})}
                                className="w-full border rounded p-2 text-sm" style={{borderColor:'var(--gic-line)'}} />
                            </div>
                            <div>
                              <label className="text-xs font-semibold block mb-1" style={{color:'var(--gic-warm)'}}>Read time</label>
                              <input value={lesson.read_time||''} onChange={e=>updateLesson(lIdx,{read_time:e.target.value})}
                                className="w-full border rounded p-2 text-sm" style={{borderColor:'var(--gic-line)'}} placeholder='e.g. "8 min read"' />
                            </div>
                            <div>
                              <label className="text-xs font-semibold block mb-1" style={{color:'var(--gic-warm)'}}>Watch / listen time</label>
                              <input value={lesson.watch_time||lesson.listen_time||''} onChange={e=>updateLesson(lIdx,{watch_time:e.target.value})}
                                className="w-full border rounded p-2 text-sm" style={{borderColor:'var(--gic-line)'}} placeholder='e.g. "12 min"' />
                            </div>
                          </div>

                          {/* Blocks */}
                          <div>
                            <div className="text-xs font-semibold mb-2" style={{color:'var(--gic-warm)'}}>Content Blocks</div>
                            <div className="space-y-2">
                              {(lesson.blocks||[]).map((block, bIdx) => (
                                <BlockEditor key={bIdx} block={block}
                                  bIdx={bIdx}
                                  onUpdate={patch => updateBlock(lIdx,bIdx,patch)}
                                  onDelete={() => deleteBlock(lIdx,bIdx)}
                                  onMove={dir => moveBlock(lIdx,bIdx,dir)}
                                  isFirst={bIdx===0} isLast={bIdx===(lesson.blocks||[]).length-1}
                                  onReorder={(from, to) => {
                                    const blocks = [...lessonsData[lIdx].blocks];
                                    const [moved] = blocks.splice(from, 1);
                                    blocks.splice(to, 0, moved);
                                    updateLesson(lIdx, { blocks });
                                  }} />
                              ))}
                            </div>
                            <AddBlockMenu onAdd={type => addBlock(lIdx,type)} />
                          </div>
                        </div>
                      )}
                    </div>
                  ))}

                  <button onClick={addLesson}
                    className="w-full p-3 border-2 border-dashed rounded-lg text-sm font-medium flex items-center justify-center gap-2 hover:bg-stone-50 transition"
                    style={{borderColor:'var(--gic-line)',color:'var(--gic-muted)'}}>
                    <Plus size={14}/> Add lesson
                  </button>
                </div>
              )}
            </div>
          )}

          {error && <div className="text-sm p-3 mt-4 rounded" style={{background:'rgba(184,61,92,0.08)',color:'var(--gic-rose)'}}>{error}</div>}
        </div>

        {/* Footer */}
        <div className="flex items-center justify-between p-6 border-t" style={{borderColor:'var(--gic-line)'}}>
          <button onClick={onClose} className="btn-ghost">Cancel</button>
          <button onClick={save} disabled={saving} className="btn-primary flex items-center gap-2">
            <Save size={14}/> {saving ? 'Saving…' : 'Save changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

function SiteSettings({ profile, onClose, onBrandingSaved }) {
  const [primary, setPrimary]   = useState('#2D1FB1');
  const [secondary, setSecondary] = useState('#1A1080');
  const [logoUrl, setLogoUrl]   = useState('');
  const [orgName, setOrgName]   = useState('Global Investment Company');
  const [loading, setLoading]   = useState(true);
  const [saving, setSaving]     = useState(false);
  const [uploading, setUploading] = useState(false);
  const [cropFile, setCropFile] = useState(null);
  const [ok, setOk] = useState('');
  const [err, setErr] = useState('');

  useEffect(() => {
    supabase.from('site_config').select('*').eq('id',1).single().then(({data}) => {
      if (data) {
        setPrimary(data.primary_color||'#2D1FB1');
        setSecondary(data.secondary_color||'#1A1080');
        setLogoUrl(data.logo_url||'');
        setOrgName(data.org_name||'Global Investment Company');
      }
      setLoading(false);
    });
  }, []);

  const save = async () => {
    setSaving(true); setErr(''); setOk('');
    const { error } = await supabase.from('site_config').upsert({
      id: 1, primary_color: primary, secondary_color: secondary,
      logo_url: logoUrl, org_name: orgName,
      updated_by: profile.id, updated_at: new Date().toISOString()
    });
    setSaving(false);
    if (error) { setErr(error.message); return; }
    // Apply colors immediately
    document.documentElement.style.setProperty('--gic-blue', primary);
    document.documentElement.style.setProperty('--gic-blue-2', secondary);
    // Apply logo immediately sitewide — no reload needed
    onBrandingSaved && onBrandingSaved(logoUrl);
    setOk('Saved and applied sitewide.');
  };

  const reset = () => { setPrimary('#2D1FB1'); setSecondary('#1A1080'); setLogoUrl(''); };

  const handleLogoCrop = async (blob) => {
    setCropFile(null);
    setUploading(true); setErr('');
    const path = `logos/site-logo-${Date.now()}.png`;
    const { error } = await supabase.storage.from('media').upload(path, blob, { upsert: true, contentType: 'image/png' });
    if (error) { setErr('Upload failed: ' + error.message); setUploading(false); return; }
    const { data: urlData } = supabase.storage.from('media').getPublicUrl(path);
    if (urlData?.publicUrl) setLogoUrl(urlData.publicUrl);
    setUploading(false);
    setOk('Logo uploaded — hit Save & apply to go live.');

  return (
    <>

      <div className="gic-card w-full max-w-lg mx-4 animate-fade-in">

            <div className="eyebrow mb-1">Super Admin</div>
            <div className="font-display text-xl font-semibold">Site Settings</div>
          </div>
          <button onClick={onClose} className="btn-ghost"><X size={18}/></button>
        </div>
        <div className="p-6 space-y-5">
          <div>
            <label className="eyebrow block mb-2">Organization Name</label>
            <input value={orgName} onChange={e=>setOrgName(e.target.value)} className="gic-input" />
          </div>

          {/* Logo upload */}
          <div>
            <label className="eyebrow block mb-2">Logo</label>
            <div className="flex items-start gap-4">
              {/* Current logo preview */}
              <div className="w-20 h-20 rounded-lg border flex items-center justify-center flex-shrink-0 overflow-hidden"
                style={{ borderColor: 'var(--gic-line)', background: '#f9f9f9' }}>
                {logoUrl
                  ? <img src={logoUrl} alt="Logo" style={{ width:'100%', height:'100%', objectFit:'contain', padding:'4px' }} onError={e=>e.target.style.display='none'} />
                  : <div className="text-xs text-center" style={{ color:'var(--gic-muted)', padding:'8px' }}>No logo</div>
                }
              </div>
              <div className="flex-1 space-y-2">
                {/* Upload button */}
                <label className="btn-primary flex items-center gap-2 text-sm cursor-pointer w-full justify-center"
                  style={{ display:'flex' }}>
                  {uploading ? <><Loader2 size={14} className="animate-spin"/> Uploading…</> : <><Upload size={14}/> Upload logo PNG</>}
                  <input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" className="sr-only"
                    disabled={uploading}

                </label>
                {/* URL fallback */}
                <input value={logoUrl} onChange={e=>setLogoUrl(e.target.value)}

          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="eyebrow block mb-2">Primary Color</label>

              </div>
              <div className="mt-2 h-6 rounded" style={{background:secondary}} />
            </div>
          </div>
          <div className="p-3 rounded text-xs" style={{background:'rgba(200,132,28,0.08)',color:'var(--gic-amber)'}}>
            These colors apply globally to all users who don't have a sponsor-specific brand. Sponsors can override with their own colors.

          {ok && <div className="text-sm p-3 rounded" style={{background:'rgba(31,122,74,0.08)',color:'var(--gic-green)'}}>{ok}</div>}
        </div>
        <div className="flex items-center justify-between p-6 border-t" style={{borderColor:'var(--gic-line)'}}>
          <button onClick={reset} className="btn-ghost text-sm flex items-center gap-1.5"><RefreshCw size={13}/> Reset to defaults</button>
          <button onClick={save} disabled={saving} className="btn-primary flex items-center gap-2"><Save size={14}/>{saving?'Saving…':'Save & apply'}</button>
        </div>
      </div>
    </div>
    {cropFile && <LogoCrop file={cropFile} onSave={handleLogoCrop} onClose={() => setCropFile(null)} />}
    </>
  );
}

// ============================================================
// useBranding — fetches site_config / sponsor brand, applies CSS vars
// ============================================================
function useBranding(profile) {
  const [logo, setLogo]             = useState(null);
  const [refreshKey, setRefreshKey] = useState(0);

  const refresh = useCallback(() => setRefreshKey(k => k + 1), []);

  const applyBranding = useCallback((branding) => {
    if (!branding) return;
    if (branding.primary_color) {
      document.documentElement.style.setProperty('--gic-blue', branding.primary_color);
      document.documentElement.style.setProperty('--gic-blue-2', branding.secondary_color || branding.primary_color);
    }
    setLogo(branding.logo_url || null);
  }, []);

  // Fetch on mount / profile change / manual refresh
  useEffect(() => {
    if (!supabase || !profile) return;
    let mounted = true;
    (async () => {
      const { data: cfg } = await supabase.from('site_config').select('*').eq('id', 1).single();
      let branding = cfg ? { primary_color: cfg.primary_color, secondary_color: cfg.secondary_color, logo_url: cfg.logo_url } : null;
      if (profile.sponsor_id) {
        const { data: sp } = await supabase.from('employer_sponsors')
          .select('brand_primary,brand_secondary,brand_logo_url')
          .eq('id', profile.sponsor_id).single();
        if (sp?.brand_primary) branding = { primary_color: sp.brand_primary, secondary_color: sp.brand_secondary, logo_url: sp.brand_logo_url };
      }
      if (mounted) applyBranding(branding);
    })();
    return () => { mounted = false; };
  }, [profile?.id, profile?.sponsor_id, refreshKey, applyBranding]);

  // Realtime: update instantly when site_config is saved by any admin
  useEffect(() => {
    if (!supabase) return;
    const channel = supabase.channel('branding-live')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'site_config' }, payload => {
        if (!profile?.sponsor_id && payload.new) {
          applyBranding({ primary_color: payload.new.primary_color, secondary_color: payload.new.secondary_color, logo_url: payload.new.logo_url });
        }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'employer_sponsors' }, payload => {
        if (profile?.sponsor_id && payload.new?.id === profile.sponsor_id && payload.new?.brand_primary) {
          applyBranding({ primary_color: payload.new.brand_primary, secondary_color: payload.new.brand_secondary, logo_url: payload.new.brand_logo_url });
        }
      })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [profile?.id, profile?.sponsor_id, applyBranding]);

  return { logo, refresh, setLogo };
}

      .eq('dismissed', false).order('created_at', { ascending: false }).limit(50);
    setUpdates(data || []);
    setLoading(false);

  useEffect(() => { load(); }, []);

    await supabase.from('industry_updates').update({ dismissed: true }).eq('id', id);
    setUpdates(prev => prev.filter(u => u.id !== id));
