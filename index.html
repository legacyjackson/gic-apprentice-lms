import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';

  Plus, Edit3, Trash2, Copy, UserCheck, Users, KeySquare,
  ClipboardCheck, RotateCcw, ExternalLink, Save,

const CFG = window.GIC_CONFIG || {};
const SUPABASE_READY =
  CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes('PASTE') &&

const supabase = SUPABASE_READY

      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }

// UTILITIES

const formatHours = (h) => h == null ? '—' : `${h}h`;
const moduleIcon = (n) => {
  const icons = [BookOpen, BarChart3, FileText, Layers, Brain, ShieldCheck, Target, MessageSquare, Briefcase,
                 UserIcon, FileText, BarChart3, Award, FileText, FileText, ListChecks, MessageSquare,
                 ShieldCheck, BarChart3, Search, Globe, FileText, ShieldCheck, BarChart3, FileText,
                 CheckCircle2, FileText, FileText, ListChecks, ShieldCheck];
  return icons[(n - 1) % icons.length] || BookOpen;
};

const competencyColor = (n) => {
  if (n <= 9)  return 'core';        // CORE-1 through CORE-9
  if (n <= 18) return 'ojl-a';       // OJL-1 through OJL-9

};

const COLOR_BANDS = {
  'core':  { label: 'Core Instruction',     accent: 'var(--gic-blue)',  pale: 'rgba(45,31,177,0.06)' },
  'ojl-a': { label: 'On-the-Job Learning',  accent: 'var(--gic-ink)',   pale: 'rgba(15,22,49,0.05)' },
  'ojl-b': { label: 'Advanced OJL',         accent: 'var(--gic-amber)', pale: 'rgba(200,132,28,0.06)' }
};

// ============================================================
// API HELPER — call Netlify Functions with current session JWT
// ============================================================
async function callFn(name, body) {
  const { data: { session } } = await supabase.auth.getSession();
  const r = await fetch(`/.netlify/functions/${name}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(session?.access_token ? { 'Authorization': 'Bearer ' + session.access_token } : {})
    },
    body: JSON.stringify(body || {})
  });
  const text = await r.text();
  let json; try { json = JSON.parse(text); } catch { json = { raw: text }; }
  if (!r.ok) throw new Error(json.error || text || `HTTP ${r.status}`);
  return json;
}

function recordLoginEvent(userId) {
  if (!supabase || !userId) return;
  supabase.from('login_events').insert({ user_id: userId }).then(() => {}, () => {});
}

async function callPublicFn(name, body) {
  const r = await fetch(`/.netlify/functions/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const text = await r.text();
  let json; try { json = JSON.parse(text); } catch { json = { raw: text }; }
  if (!r.ok) throw new Error(json.error || text || `HTTP ${r.status}`);
  return json;
}

const fmtRelative = (ts) => {
  if (!ts) return '';
  const d = new Date(ts);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  if (diff < 604800)return `${Math.floor(diff/86400)}d ago`;
  return d.toLocaleDateString();
};

// ============================================================
// AUTH HOOK
// ============================================================
function useAuth() {
  const [session, setSession]   = useState(null);
  const [profile, setProfile]   = useState(null);
  const [loading, setLoading]   = useState(true);

  useEffect(() => {
    if (!supabase) { setLoading(false); return; }
    let mounted = true;

    // Hard deadline: if auth never resolves (stale token, network issue, RLS hang) clear the spinner
    const deadline = setTimeout(() => { if (mounted) setLoading(false); }, 6000);
    const done = () => { clearTimeout(deadline); };

    supabase.auth.getSession()
      .then(({ data }) => {
        if (!mounted) return;
        setSession(data.session || null);
        if (!data.session) { done(); setLoading(false); }
      })
      .catch(() => { if (mounted) { done(); setLoading(false); } });

    const { data: sub } = supabase.auth.onAuthStateChange((_event, sess) => {
      if (!mounted) return;
      setSession(sess || null);
      if (!sess) { done(); setProfile(null); setLoading(false); }
    });

    return () => { mounted = false; clearTimeout(deadline); sub.subscription.unsubscribe(); };
  }, []);

  useEffect(() => {
    if (!session) return;
    let mounted = true;
    (async () => {
      try {
        const { data } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', session.user.id)
          .maybeSingle();
        if (!mounted) return;
        if (data) setProfile(data);
        else setProfile({ id: session.user.id, email: session.user.email, role: 'apprentice', full_name: session.user.email.split('@')[0] });
      } catch (_) {
        if (mounted) setProfile({ id: session.user.id, email: session.user.email, role: 'apprentice', full_name: session.user.email.split('@')[0] });
      } finally {
        if (mounted) setLoading(false);
      }
    })();
    return () => { mounted = false; };
  }, [session]);

  const signOut = useCallback(async () => {
    if (supabase) await supabase.auth.signOut();
  }, []);

  return { session, profile, loading, signOut };
}

function LoginScreen({ onApply }) {

  // Live token validation (debounced)
  useEffect(() => {
    if (mode !== 'enroll') return;
    const t = token.trim();
    if (t.length < 4) { setTokenPreview(null); return; }
    const id = setTimeout(async () => {
      try {
        const { data, error } = await supabase.rpc('peek_token_validity', { p_token: t });

        if (data && data.length > 0) setTokenPreview(data[0]);

        setTokenPreview({ valid: false, reason: 'Could not check code.' });

          password

        <div>
          <div className="gic-rule mb-4" style={{ '--gic-line': 'rgba(255,255,255,0.15)' }}>
            <span className="font-display italic text-sm" style={{ color: 'rgba(255,255,255,0.5)' }}>{CFG.ORG_VALUES}</span>
          </div>
          <div className="text-xs" style={{ color: 'rgba(255,255,255,0.5)' }}>{CFG.PROGRAM_RAPIDS}</div>

      {/* RIGHT — Form */}

function AppField({ def, value, onChange, hint }) {
  const base = "gic-input";
  const label = (
    <label className="eyebrow block mb-2">{def.label}{def.required ? ' *' : ''}</label>
  );
  if (def.type === 'textarea') {
    return (
      <div className={def.colSpan === 2 ? 'md:col-span-2' : ''}>
        {label}
        <textarea className={base + " min-h-[80px]"} value={value || ''} placeholder={def.placeholder || ''}
          onChange={e => onChange(e.target.value)} required={def.required} />
      </div>
    );
  }
  if (def.type === 'select') {
    return (
      <div>
        {label}
        <select className={base} value={value || ''} onChange={e => onChange(e.target.value)} required={def.required}>
          <option value="">— Select —</option>
          {def.options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    );
  }
  if (def.type === 'yesno') {
    return (
      <div>
        {label}
        <div className="flex gap-2">
          {[['Yes', true], ['No', false]].map(([lbl, v]) => (
            <button key={lbl} type="button" onClick={() => onChange(v)}
              className="flex-1 text-sm py-2.5 rounded-lg border transition"
              style={value === v
                ? { borderColor: 'var(--gic-blue)', background: 'rgba(45,31,177,0.06)', color: 'var(--gic-blue)', fontWeight: 600 }
                : { borderColor: 'var(--gic-line)', color: 'var(--gic-muted)' }}>
              {lbl}
            </button>
          ))}
        </div>
      </div>
    );
  }
  return (
    <div className={def.colSpan === 2 ? 'md:col-span-2' : ''}>
      {label}
      <input type={def.type || 'text'} className={base} value={value ?? ''} placeholder={def.placeholder || ''}
        onChange={e => onChange(e.target.value)} required={def.required} />
      {hint && <div className="text-xs mt-1">{hint}</div>}
    </div>
  );
}

function ApplicationForm({ onDone }) {
  const [stepIdx, setStepIdx] = useState(0);
  const [form, setForm] = useState(APPLICATION_EMPTY);
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);

  const set = (key, val) => setForm(f => ({ ...f, [key]: val }));
  const setSkill = (key, val) => setForm(f => ({ ...f, skills: { ...f.skills, [key]: val } }));
  const setDoc = (key, val) => setForm(f => ({ ...f, eligibility_docs: { ...f.eligibility_docs, [key]: val } }));
  const toggleRace = (opt) => setForm(f => ({
    ...f, race: f.race.includes(opt) ? f.race.filter(r => r !== opt) : [...f.race, opt]
  }));

  // Auto-detect county from the address via the free U.S. Census Bureau geocoder.
  // Never overwrites a county the applicant has typed in themselves.
  const [countyStatus, setCountyStatus] = useState(''); // '' | 'looking' | 'done' | 'error'
  const autoCountyRef = useRef('');
  useEffect(() => {
    const { address, city, state, zip } = form;
    if (!city || !state || !zip) return;
    setCountyStatus('looking');
    const t = setTimeout(async () => {
      try {
        const { county } = await callPublicFn('lookup-county', { address, city, state, zip });
        if (county) {
          setForm(f => (f.county === '' || f.county === autoCountyRef.current) ? { ...f, county } : f);
          autoCountyRef.current = county;
          setCountyStatus('done');
        } else {
          setCountyStatus('error');
        }
      } catch {
        setCountyStatus('error');
      }
    }, 800);
    return () => clearTimeout(t);
  }, [form.address, form.city, form.state, form.zip]);

  const step = APPLICATION_STEPS[stepIdx];
  const isLast = stepIdx === APPLICATION_STEPS.length - 1;

  const validateStep = () => {
    if (step.fields) {
      for (const f of step.fields) {
        if (f.required && !form[f.key] && form[f.key] !== 0) return `Please fill in "${f.label}".`;
      }
    }
    if (step.custom === 'review') {
      if (!form.agreed_to_commitment) return 'Please agree to the Student Commitment Agreement.';
      if (!form.signature_name.trim()) return 'Please type your name as your signature.';
    }
    return '';
  };

  const next = () => {
    const err = validateStep();
    if (err) { setError(err); return; }
    setError('');
    setStepIdx(i => Math.min(i + 1, APPLICATION_STEPS.length - 1));
  };
  const back = () => { setError(''); setStepIdx(i => Math.max(i - 1, 0)); };

  const submit = async () => {
    const err = validateStep();
    if (err) { setError(err); return; }
    setSubmitting(true); setError('');
    try {
      const payload = {
        ...form,
        experience_years: form.experience_years === '' ? null : parseInt(form.experience_years, 10),
        signed_at: new Date().toISOString()
      };
      const { error } = await supabase.from('registrants').insert(payload);
      if (error) throw error;
      setSubmitted(true);
    } catch (e) {
      setError(e.message || 'Something went wrong submitting your application.');
    } finally {
      setSubmitting(false);
    }
  };

  if (submitted) {
    return (
      <div className="min-h-screen flex items-center justify-center p-8" style={{ background: 'var(--gic-bone)' }}>
        <div className="max-w-xl w-full gic-card p-12 text-center animate-fade-in">
          <CheckCircle2 size={40} className="mx-auto mb-5" style={{ color: 'var(--gic-green)' }} />
          <div className="eyebrow mb-3">Application received</div>
          <h1 className="font-display text-3xl font-semibold mb-4">Thank you, {form.full_name.split(' ')[0] || 'applicant'}.</h1>
          <p className="text-base mb-8" style={{ color: 'var(--gic-muted)' }}>
            The GIC team will review your application. Once approved, you'll receive a sponsorship code to complete your enrollment and set up your account.
          </p>
          <button onClick={onDone} className="btn-primary">Return to sign in</button>
          <ComplianceFooter />
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen p-4 lg:p-10" style={{ background: 'var(--gic-bone)' }}>
      <div className="max-w-3xl mx-auto animate-fade-in">
        <div className="flex items-center justify-between mb-6">
          <div className="font-display text-xl font-semibold">Wealth Solutions Counselor Apprenticeship</div>
          <button onClick={onDone} className="btn-ghost flex items-center gap-1 text-sm"><X size={14}/> Cancel</button>
        </div>

        {/* Progress */}
        <div className="flex items-center gap-1 mb-8">
          {APPLICATION_STEPS.map((s, i) => (
            <div key={i} className="flex-1 h-1 rounded-full" style={{ background: i <= stepIdx ? 'var(--gic-blue)' : 'var(--gic-line)' }} />
          ))}
        </div>

        <div className="gic-card p-6 lg:p-10">
          <div className="eyebrow mb-2">Step {stepIdx + 1} of {APPLICATION_STEPS.length}</div>
          <h2 className="font-display text-2xl lg:text-3xl font-semibold mb-2">{step.title}</h2>
          {step.subtitle && <p className="text-sm mb-8" style={{ color: 'var(--gic-muted)' }}>{step.subtitle}</p>}

          {step.fields && (
            <div className="grid md:grid-cols-2 gap-5">
              {step.fields.map(f => (
                <AppField key={f.key} def={f} value={form[f.key]} onChange={v => set(f.key, v)}
                  hint={f.key === 'county' ? (
                    countyStatus === 'looking'
                      ? <span className="flex items-center gap-1" style={{ color: 'var(--gic-muted)' }}><Loader2 size={10} className="animate-spin"/> Detecting county from your address…</span>
                      : countyStatus === 'done'
                      ? <span style={{ color: 'var(--gic-green)' }}>Auto-filled from your address — edit if this isn't right.</span>
                      : null
                  ) : null} />
              ))}
            </div>
          )}

          {step.custom === 'skills' && (
            <div className="space-y-8">
              <div className="space-y-4">
                {SKILLS_LIST.map(([key, label]) => (
                  <div key={key} className="flex items-center justify-between gap-4">
                    <div className="text-sm flex-1">{label}</div>
                    <div className="flex gap-1.5">
                      {[1,2,3,4,5].map(n => (
                        <button key={n} type="button" onClick={() => setSkill(key, n)}

              </div>
              <AppField def={{ key: 'disability', label: 'Disability', type: 'select', options: ['Yes', 'No', 'Prefer not to answer'] }}
                value={form.disability} onChange={v => set('disability', v)} />
              <AppField def={{ key: 'veteran_status', label: 'Veteran status', type: 'select',
                options: ['Non-Veteran', 'Veteran', 'Non-Veteran, Other Eligible Individual', 'Veteran, Eligible', 'Prefer not to answer'] }}
                value={form.veteran_status} onChange={v => set('veteran_status', v)} />
              <AppField def={{ key: 'education_level_dol', label: 'Education level', type: 'select',
                options: ['Not High School graduate', 'High School graduate (including equivalency)', "Some College or Associate's degree", "Bachelor's degree", "Master's degree", 'Doctorate or professional degree', 'Prefer not to answer'] }}
                value={form.education_level_dol} onChange={v => set('education_level_dol', v)} />
              <AppField def={{ key: 'employment_status', label: 'Employment status', type: 'select', options: ['New Employee', 'Current Employee'] }}
                value={form.employment_status} onChange={v => set('employment_status', v)} />
              <AppField def={{ key: 'pre_apprenticeship_program', label: 'Did you complete a pre-apprenticeship program?', type: 'yesno' }}
                value={form.pre_apprenticeship_program} onChange={v => set('pre_apprenticeship_program', v)} />
            </div>
          )}

          {step.custom === 'review' && (
            <div className="space-y-6">
              <div className="gic-card p-5" style={{ background: 'var(--gic-bone)' }}>
                <div className="font-display font-semibold mb-3">Application summary</div>
                <div className="grid md:grid-cols-2 gap-x-6 gap-y-1 text-sm">
                  <div><span style={{ color: 'var(--gic-muted)' }}>Name:</span> {form.full_name || '—'}</div>
                  <div><span style={{ color: 'var(--gic-muted)' }}>Email:</span> {form.email || '—'}</div>
                  <div><span style={{ color: 'var(--gic-muted)' }}>County:</span> {form.county || '—'}</div>
                  <div><span style={{ color: 'var(--gic-muted)' }}>DOB:</span> {form.dob || '—'}</div>
                  <div><span style={{ color: 'var(--gic-muted)' }}>Education:</span> {form.education_level || '—'}</div>
                  <div><span style={{ color: 'var(--gic-muted)' }}>Experience level:</span> {form.experience_level || '—'}</div>
                </div>
              </div>
              <div className="border-t pt-6" style={{ borderColor: 'var(--gic-line)' }}>
                <div className="font-display font-semibold mb-3">Student Commitment Agreement</div>
                <p className="text-sm mb-4" style={{ color: 'var(--gic-muted)' }}>
                  I understand that the Wealth Solutions Counselor Apprenticeship Program requires completion of up to 2,000 OJT hours and 144+ RSI hours, attendance at all scheduled trainings, a professional conduct agreement on file, participation in evaluations, and communication with instructors and case managers. I agree to follow program policies and commit to completing the apprenticeship.
                </p>
                <label className="flex items-center gap-2 text-sm mb-4">
                  <input type="checkbox" checked={form.agreed_to_commitment} onChange={e => set('agreed_to_commitment', e.target.checked)} />
                  I agree to the Student Commitment Agreement above.
                </label>
                <AppField def={{ key: 'signature_name', label: 'Type your full legal name as your signature', required: true }}
                  value={form.signature_name} onChange={v => set('signature_name', v)} />
              </div>
              <ComplianceFooter />
            </div>
          )}

          {error && (
            <div className="mt-6 text-sm p-3 border-l-2 flex items-start gap-2" style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.06)', color: 'var(--gic-rose)' }}>
              <AlertCircle size={16} className="flex-shrink-0 mt-0.5" />
              <span>{error}</span>
            </div>
          )}

          <div className="flex items-center justify-between mt-8 pt-6 border-t" style={{ borderColor: 'var(--gic-line)' }}>
            <button type="button" onClick={back} disabled={stepIdx === 0} className="btn-secondary flex items-center gap-1.5 disabled:opacity-40">
              <ChevronLeft size={14}/> Back
            </button>
            {isLast ? (
              <button type="button" onClick={submit} disabled={submitting} className="btn-primary flex items-center gap-2">
                {submitting ? <Loader2 size={16} className="animate-spin"/> : <ClipboardCheck size={16}/>}
                {submitting ? 'Submitting…' : 'Submit application'}
              </button>
            ) : (
              <button type="button" onClick={next} className="btn-primary flex items-center gap-1.5">
                Next <ChevronRight size={14}/>
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function ModuleCard({ module: mod, progress, onOpen, isAdmin, locked, waiverStatus }) {
  const Icon = moduleIcon(mod.module_number);
  const band = competencyColor(mod.module_number);
  const palette = COLOR_BANDS[band];

  const status = progress?.status || 'not_started';
  const pct = progress?.best_quiz_score || 0;
  const isCompleted = status === 'completed';
  const isInProgress = status === 'in_progress';
  const isApproved = mod.status === 'approved';

  return (
    <button onClick={() => onOpen(mod)}
            className="gic-card gic-card-hover p-6 text-left flex flex-col group transition-all animate-fade-in"
            style={locked ? { opacity: 0.7 } : {}}>
      <div className="flex items-start justify-between mb-4">
        <div className="w-12 h-12 rounded flex items-center justify-center"
             style={{ background: palette.pale, color: palette.accent }}>
          <Icon size={20} />
        </div>
        <div className="text-right">
          <div className="font-mono text-xs" style={{ color: 'var(--gic-warm)' }}>
            {String(mod.module_number).padStart(2, '0')}
          </div>
          {mod.competency_id && (
            <div className="font-mono text-[10px] mt-0.5" style={{ color: 'var(--gic-warm)' }}>
              {mod.competency_id}
            </div>
          )}
        </div>
      </div>

      <div className="eyebrow mb-2" style={{ color: palette.accent }}>{palette.label}</div>
      <h3 className="font-display text-xl font-semibold leading-tight mb-2 group-hover:text-[color:var(--gic-blue)]">
        {mod.title}
      </h3>
      {mod.short_description && (
        <p className="text-sm leading-relaxed mb-4 flex-1" style={{ color: 'var(--gic-muted)' }}>
          {mod.short_description}
        </p>
      )}

      <div className="mt-auto pt-4 border-t flex items-center justify-between" style={{ borderColor: 'var(--gic-line)' }}>
        <div className="flex items-center gap-3 text-xs" style={{ color: 'var(--gic-warm)' }}>
          {mod.ri_hours > 0 && <span>{formatHours(mod.ri_hours)} RI</span>}
          {mod.ojl_hours > 0 && <span>{formatHours(mod.ojl_hours)} OJL</span>}
        </div>
        <div className="flex items-center gap-2">
          {isAdmin && mod.status !== 'approved' && (
            <span className="badge badge-ai">
              <Sparkles size={10} />Awaiting Review
            </span>
          )}
          {locked && (
            <span className="badge flex items-center gap-1" style={{ color: 'var(--gic-amber)', background: 'rgba(200,132,28,0.08)' }}>
              <Lock size={9}/>
              {waiverStatus === 'pending' ? 'Requested' : 'Locked'}
            </span>
          )}
          {!locked && isCompleted && <CheckCircle2 size={18} style={{ color: 'var(--gic-green)' }} />}
          {!locked && isInProgress && !isCompleted && (
            <span className="text-xs font-semibold" style={{ color: 'var(--gic-blue)' }}>
              {pct ? `${pct}%` : 'In progress'}
            </span>
          )}
          {!locked && !isCompleted && !isInProgress && !isApproved && (
            <Lock size={14} style={{ color: 'var(--gic-warm)' }} />
          )}
        </div>
      </div>
    </button>
  );
}

function ApprenticeDashboard({ modules, progress, profile, onOpenModule, waivers }) {
  const isAdmin = profile?.role === 'admin' || profile?.role === 'approver';

  // Group modules by competency band
  const core    = modules.filter(m => m.module_number <= 9);
  const ojlA    = modules.filter(m => m.module_number > 9 && m.module_number <= 18);
  const ojlB    = modules.filter(m => m.module_number > 18);

  const progressBy = useMemo(() => {
    const map = {};
    progress.forEach(p => { map[p.module_id] = p; });
    return map;
  }, [progress]);

  const totalCompleted = progress.filter(p => p.status === 'completed').length;
  const totalInProgress = progress.filter(p => p.status === 'in_progress').length;

  const visibleModules = isAdmin ? modules : modules.filter(m => m.status === 'approved');

  return (
    <main className="max-w-7xl mx-auto px-6 lg:px-10 py-12 lg:py-16 animate-fade-in">
      {/* Welcome hero */}
      <section className="mb-16">
        <div className="eyebrow mb-3">Welcome, {(profile?.full_name || profile?.email || '').split('@')[0]}</div>
        <h1 className="font-display text-4xl lg:text-6xl font-medium leading-tight mb-6 max-w-3xl">
          The work of an advisor begins with <em>understanding.</em>
        </h1>
        <p className="text-lg leading-relaxed max-w-2xl" style={{ color: 'var(--gic-muted)' }}>
          You're building the knowledge, skills, and habits of a professional Wealth Solutions Counselor. Complete each module at your own pace, pass the assessments, and log your on-the-job practice hours to demonstrate competency.
        </p>
      </section>

      {/* Stats strip */}
      <section className="grid grid-cols-2 lg:grid-cols-4 gap-px mb-16 border" style={{ borderColor: 'var(--gic-line)', background: 'var(--gic-line)' }}>
        <Stat label="Modules Completed" value={totalCompleted} max={visibleModules.length} />
        <Stat label="In Progress" value={totalInProgress} />
        <Stat label="Core Competencies" value={`${core.filter(m => m.status === 'approved').length}/${core.length}`} />
        <Stat label="Avg. Quiz Score" value={
          progress.filter(p => p.best_quiz_score).length
            ? Math.round(progress.filter(p => p.best_quiz_score).reduce((a, p) => a + p.best_quiz_score, 0) / progress.filter(p => p.best_quiz_score).length) + '%'
            : '—'
        } />
      </section>

      {/* Final Exam card */}
      {!isAdmin && (() => {
        const approvedMods = modules.filter(m => m.status === 'approved');
        const completedCount = progress.filter(p => p.status === 'completed' && approvedMods.find(m => m.id === p.module_id)).length;
        const allDone = approvedMods.length > 0 && completedCount >= approvedMods.length;
        const earlyAccess = profile?.exam_early_access === true;
        const pct = approvedMods.length > 0 ? Math.round((completedCount / approvedMods.length) * 100) : 0;
        const unlocked = allDone || earlyAccess;
        if (approvedMods.length === 0) return null;
        return (
          <section className="mb-12 gic-card p-8" style={{
            background: unlocked ? 'rgba(45,31,177,0.03)' : 'rgba(45,31,177,0.015)',
            borderColor: unlocked ? 'var(--gic-blue)' : 'var(--gic-line)'
          }}>
            <div className="flex items-center justify-between gap-6">
              <div>
                <div className="eyebrow mb-2 flex items-center gap-2" style={{ color: unlocked ? 'var(--gic-blue)' : 'var(--gic-muted)' }}>
                  <Award size={12}/> Final Assessment
                  {earlyAccess && !allDone && (
                    <span className="badge" style={{ color: 'var(--gic-green)', background: 'rgba(31,122,74,0.08)' }}>Early access granted</span>
                  )}
                </div>
                <div className="font-display text-2xl font-semibold mb-1">
                  {unlocked ? (allDone ? "You've completed all modules." : "Early exam access granted.") : `${pct}% complete — almost there.`}
                </div>
                <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                  {unlocked
                    ? 'Take the final comprehensive exam to earn your Wealth Solutions Counselor certificate.'
                    : `Complete all ${approvedMods.length} modules to unlock the final exam. You can also request early access from your mentor.`}
                </div>
              </div>
              <div className="flex flex-col gap-2 flex-shrink-0">
                {unlocked ? (
                  <button onClick={() => onOpenModule({ __finalExam: true })} className="btn-primary flex items-center gap-2">
                    <Award size={15}/> Take Final Exam
                  </button>
                ) : (
                  <button onClick={() => onOpenModule({ __examAccessRequest: true })} className="btn-secondary flex items-center gap-2 text-sm">
                    <Send size={13}/> Request early access

                </div>
              </div>
            )}
          </section>
        );
      })()}

      {/* Module sections */}
      <ModuleSection
        eyebrow="Core Instruction · 144 Related Instruction Hours"
        title="Foundations"
        subtitle="Start here. These modules build the financial vocabulary, planning frameworks, and client skills you'll use in every client engagement."
        modules={core.filter(m => isAdmin || m.status === 'approved')}

      <ModuleSection
        eyebrow="On-the-Job Learning · Client-Facing"
        title="Working with Clients"
        subtitle="Discovery, documents, planning, and the practitioner skills that turn knowledge into service."
        modules={ojlA.filter(m => isAdmin || m.status === 'approved')}
        progressBy={progressBy}
        onOpen={onOpenModule}
        isAdmin={isAdmin}
        waivers={waivers}
      />

      <ModuleSection
        eyebrow="On-the-Job Learning · Operations &amp; Investment"
        title="Investment, Compliance &amp; Operations"
        subtitle="The technical work that supports a firm: research, reporting, reconciliation, and audit-readiness."
        modules={ojlB.filter(m => isAdmin || m.status === 'approved')}
        progressBy={progressBy}
        onOpen={onOpenModule}
        isAdmin={isAdmin}
        waivers={waivers}
      />

      {/* Curriculum-in-development notice */}
      {!isAdmin && modules.filter(m => m.status !== 'approved').length > 0 && (
        <section className="mt-12 gic-card p-8 max-w-3xl">
          <div className="flex items-start gap-4">
            <Clock size={20} style={{ color: 'var(--gic-amber)' }} className="flex-shrink-0 mt-1" />
            <div>
              <div className="font-display text-xl font-semibold mb-2">More modules unlock as they're approved</div>
              <p className="text-sm leading-relaxed" style={{ color: 'var(--gic-muted)' }}>
                {modules.filter(m => m.status !== 'approved').length} additional competencies are currently in curriculum development, undergoing review by Cathy Jackson-Gent, our Related Supplemental Instruction Provider. You'll see them appear here as they're approved for instruction.
              </p>

          </div>
        </section>

}

function Stat({ label, value, max }) {
  return (
    <div className="bg-white p-6">
      <div className="eyebrow mb-2">{label}</div>
      <div className="font-display text-3xl font-semibold">
        {value}
        {max != null && <span className="text-base ml-1" style={{ color: 'var(--gic-warm)' }}>/ {max}</span>}
      </div>
    </div>
  );
}

function ModuleSection({ eyebrow, title, subtitle, modules, progressBy, onOpen, isAdmin, waivers }) {
  if (!modules.length) return null;
  const sortedApproved = [...modules].filter(m => m.status === 'approved').sort((a,b) => a.module_number - b.module_number);
  return (
    <section className="mb-20">
      <div className="mb-8 max-w-2xl">
        <div className="eyebrow mb-2">{eyebrow}</div>
        <h2 className="font-display text-3xl font-semibold mb-3" dangerouslySetInnerHTML={{ __html: title }} />
        <p className="text-base leading-relaxed" style={{ color: 'var(--gic-muted)' }}>{subtitle}</p>
      </div>
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
        {modules.map(m => {
          let locked = false;
          let waiverStatus = null;
          if (!isAdmin && m.status === 'approved' && m.module_number > 1) {
            const prevApproved = sortedApproved.filter(x => x.module_number < m.module_number).slice(-1)[0];
            if (prevApproved) {
              const prevDone = progressBy[prevApproved.id]?.status === 'completed';
              const waiver = (waivers || []).find(w => w.module_id === m.id);
              if (!prevDone && waiver?.status !== 'approved') {
                locked = true;
                waiverStatus = waiver?.status || null;
              }
            }
          }
          return (
          <ModuleCard
            key={m.id}
            module={m}
            progress={progressBy[m.id]}
            onOpen={onOpen}
            isAdmin={isAdmin}
            locked={locked}
            waiverStatus={waiverStatus}
          />
          );
        })}
      </div>
    </section>
  );
}

// ============================================================
// MODULE VIEW — Lessons + Quiz + Completion
// ============================================================
function ModuleView({ module: mod, progress, profile, onBack, onProgressUpdate, submissions, onOpenRecorder, onViewSubmission }) {
  const [view, setView]               = useState('overview'); // overview | lesson | quiz | results
  const [currentLesson, setCurrentLesson] = useState(progress?.current_lesson || 0);
  const [completedLessons, setCompletedLessons] = useState(progress?.lessons_completed || []);
  const [ttsBlock, setTtsBlock] = useState(-1);
  const [noteText, setNoteText]       = useState('');
  const [noteSaved, setNoteSaved]     = useState(true);
  const [showNotes, setShowNotes]     = useState(false);
  const [lessonReads, setLessonReads] = useState(new Set());
  const noteTimer = useRef(null);

  // Load which lessons have been opened
  useEffect(() => {
    if (!supabase || !profile?.id || isAdmin) return;
    supabase.from('lesson_reads').select('lesson_index').eq('user_id', profile.id).eq('module_id', mod.id)
      .then(({ data }) => { if (data) setLessonReads(new Set(data.map(r => r.lesson_index))); });
  }, [mod.id, profile?.id]);
  const isAdmin = profile?.role === 'admin' || profile?.role === 'approver';
  const isApproved = mod.status === 'approved';
  const content = mod.content || {};
  const lessons = content.lessons || [];
  const quiz = content.quiz || null;
  const hasContent = lessons.length > 0;

  // Load study note when lesson changes
  useEffect(() => {
    if (!supabase || !profile?.id || view !== 'lesson') return;
    setNoteText('');
    setNoteSaved(true);
    supabase.from('lesson_notes')
      .select('note_text')
      .eq('user_id', profile.id)
      .eq('module_id', mod.id)
      .eq('lesson_index', currentLesson)
      .maybeSingle()
      .then(({ data }) => { if (data) setNoteText(data.note_text || ''); });
    // Track lesson read
    supabase.from('lesson_reads')
      .upsert({ user_id: profile.id, module_id: mod.id, lesson_index: currentLesson }, { onConflict: 'user_id,module_id,lesson_index', ignoreDuplicates: true });
  }, [currentLesson, view, profile?.id, mod.id]);

  // Track time spent on this lesson — flushed to the server whenever the
  // lesson/view changes or the component unmounts.
  const lessonStartRef = useRef(null);
  useEffect(() => {
    if (!supabase || !profile?.id || view !== 'lesson' || isAdmin) return;
    lessonStartRef.current = Date.now();
    const lessonAtStart = currentLesson;
    return () => {
      if (!lessonStartRef.current) return;
      const seconds = Math.round((Date.now() - lessonStartRef.current) / 1000);
      lessonStartRef.current = null;
      // Sanity cap — ignore outliers from a tab left open in the background.
      if (seconds > 0 && seconds < 3600) {
        supabase.rpc('increment_lesson_time', { p_module_id: mod.id, p_lesson_index: lessonAtStart, p_seconds: seconds }).then(() => {}, () => {});
      }
    };
  }, [currentLesson, view, profile?.id, mod.id]);

  const saveNote = async (text) => {
    if (!supabase || !profile?.id) return;
    await supabase.from('lesson_notes').upsert(
      { user_id: profile.id, module_id: mod.id, lesson_index: currentLesson, note_text: text, updated_at: new Date().toISOString() },
      { onConflict: 'user_id,module_id,lesson_index' }
    );
    setNoteSaved(true);
  };

  const handleNoteChange = (text) => {
    setNoteText(text);
    setNoteSaved(false);
    if (noteTimer.current) clearTimeout(noteTimer.current);
    noteTimer.current = setTimeout(() => saveNote(text), 1200);
  };

  const markLessonComplete = async (idx) => {
    const next = Array.from(new Set([...completedLessons, idx]));
    setCompletedLessons(next);
    await onProgressUpdate(mod.id, {
      status: 'in_progress',
      current_lesson: idx,
      lessons_completed: next
    });
  };

  if (!hasContent) {
    return (
      <main className="max-w-4xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
        <button onClick={onBack} className="btn-ghost flex items-center gap-1.5 mb-8">
          <ArrowLeft size={14} /> All modules
        </button>

        <div className="eyebrow mb-3">{mod.competency_id} · Module {String(mod.module_number).padStart(2, '0')}</div>
        <h1 className="font-display text-4xl font-semibold mb-4">{mod.title}</h1>
        <p className="text-lg leading-relaxed mb-8" style={{ color: 'var(--gic-muted)' }}>
          {mod.short_description}
        </p>

        <div className="gic-card p-10 text-center">
          <Clock size={28} style={{ color: 'var(--gic-amber)' }} className="mx-auto mb-4" />
          <div className="font-display text-2xl font-semibold mb-2">Curriculum in development</div>
          <p className="text-sm leading-relaxed max-w-md mx-auto" style={{ color: 'var(--gic-muted)' }}>
            This module is currently being authored. It will be reviewed and approved by Cathy Jackson-Gent before being made available to apprentices.
          </p>
        </div>
      </main>
    );
  }

  // OVERVIEW SCREEN
  if (view === 'overview') {
    const completedCount = completedLessons.length;
    const allLessonsComplete = lessons.length > 0 && completedCount >= lessons.length;
    return (
      <main className="max-w-5xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
        <button onClick={onBack} className="btn-ghost flex items-center gap-1.5 mb-8">
          <ArrowLeft size={14} /> All modules
        </button>

        {isAdmin && !isApproved && (
          <div className="mb-6 p-4 border-l-2 flex items-start gap-3"
               style={{ borderColor: 'var(--gic-rose)', background: 'rgba(184,61,92,0.04)' }}>
            <Sparkles size={16} style={{ color: 'var(--gic-rose)' }} className="flex-shrink-0 mt-0.5" />
            <div className="text-sm">
              <strong style={{ color: 'var(--gic-rose)' }}>Drafted for review.</strong>
              <span style={{ color: 'var(--gic-ink)' }}> This module's content is in draft and requires approval by a licensed fiduciary expert at Global Investment Company before publication to apprentices.</span>
            </div>
          </div>
        )}

        <div className="eyebrow mb-3">{mod.competency_id} · Module {String(mod.module_number).padStart(2, '0')}</div>
        <h1 className="font-display text-4xl lg:text-5xl font-semibold leading-tight mb-4">{mod.title}</h1>
        <p className="text-lg leading-relaxed max-w-3xl mb-8" style={{ color: 'var(--gic-muted)' }}>
          {mod.short_description}
        </p>

        <div className="grid lg:grid-cols-3 gap-8 mb-10">
          <div className="lg:col-span-2 gic-card p-8">
            <div className="eyebrow mb-3">Learning Objectives</div>
            <p className="text-sm mb-4" style={{ color: 'var(--gic-muted)' }}>By the end of this module, you will be able to:</p>
            <ul className="space-y-3">
              {(mod.learning_objectives || []).map((obj, i) => (
                <li key={i} className="flex items-start gap-3 text-sm leading-relaxed">
                  <div className="font-mono text-xs flex-shrink-0 mt-0.5 w-6" style={{ color: 'var(--gic-blue)' }}>
                    {String(i + 1).padStart(2, '0')}
                  </div>
                  <span>{obj}</span>
                </li>
              ))}
            </ul>
          </div>

          <div className="gic-card p-8">
            <div className="eyebrow mb-3">At a Glance</div>
            <div className="space-y-4 text-sm">
              <div>
                <div style={{ color: 'var(--gic-warm)' }}>Lessons</div>
                <div className="font-display text-2xl font-semibold">{lessons.length}</div>
              </div>
              {quiz && (
                <div>
                  <div style={{ color: 'var(--gic-warm)' }}>Assessment</div>
                  <div className="font-display text-2xl font-semibold">{quiz.questions?.length || 0}<span className="text-sm ml-1" style={{ color: 'var(--gic-warm)' }}>questions</span></div>
                  <div className="text-xs mt-1" style={{ color: 'var(--gic-muted)' }}>Pass threshold: {quiz.passing_score || 80}%</div>
                </div>
              )}
              {mod.ri_hours > 0 && (
                <div>
                  <div style={{ color: 'var(--gic-warm)' }}>RI Hours</div>
                  <div className="font-display text-2xl font-semibold">{mod.ri_hours}h</div>
                </div>
              )}
              {mod.ojl_hours > 0 && (
                <div>
                  <div style={{ color: 'var(--gic-warm)' }}>OJL Hours</div>
                  <div className="font-display text-2xl font-semibold">{mod.ojl_hours}h</div>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* Lesson list */}
        <div className="mb-10">
          <div className="eyebrow mb-4">Lessons</div>
          <div className="gic-card divide-y" style={{ borderColor: 'var(--gic-line)' }}>
            {lessons.map((lesson, idx) => {
              const done = completedLessons.includes(idx);
              const read = lessonReads.has(idx);
              return (
                <button key={idx}
                  onClick={() => { setCurrentLesson(idx); setTtsBlock(-1); window.speechSynthesis.cancel(); setView('lesson'); }}
                  className="w-full p-5 text-left flex items-center gap-4 hover:bg-stone-50 transition-colors">
                  <div className="font-mono text-xs w-8" style={{ color: 'var(--gic-warm)' }}>
                    {String(idx + 1).padStart(2, '0')}
                  </div>
                  <div className="flex-1">
                    <div className="font-display text-lg font-semibold">{lesson.title}</div>
                    {lesson.summary && (
                      <div className="text-sm mt-0.5" style={{ color: 'var(--gic-muted)' }}>{lesson.summary}</div>
                    )}
                  </div>
                  <div className="flex items-center gap-3">
                    {lesson.read_time && (
                      <span className="text-xs" style={{ color: 'var(--gic-warm)' }}>{lesson.read_time}</span>
                    )}
                    {done ? (
                      <CheckCircle2 size={18} style={{ color: 'var(--gic-green)' }} />
                    ) : read ? (
                      <BookOpen size={16} style={{ color: 'var(--gic-blue)', opacity: 0.6 }} title="In progress" />
                    ) : (
                      <Circle size={18} style={{ color: 'var(--gic-line)' }} />
                    )}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Module-end assessment */}
        {quiz && (
          <div className="gic-card p-8 flex items-center justify-between">
            <div>
              <div className="eyebrow mb-2">Module Assessment</div>
              <div className="font-display text-2xl font-semibold mb-1">Demonstrate competency</div>
              <div className="text-sm" style={{ color: 'var(--gic-muted)' }}>
                Complete all lessons first, then take the assessment to mark this module complete.
              </div>
            </div>
            <button
              onClick={() => setView('quiz')}
              disabled={!allLessonsComplete}
              className="btn-primary flex items-center gap-2">
              {progress?.best_quiz_score ? 'Retake' : 'Start'} assessment
              <ArrowRight size={16} />
            </button>
          </div>
        )}

        {/* OJL submissions — only for modules with on-the-job-learning hours */}
        {(mod.ojl_hours || 0) > 0 && profile?.role === 'apprentice' && (
          <div className="gic-card p-8 mt-6">
            <div className="flex items-start justify-between mb-5">
              <div>
                <div className="eyebrow mb-2 flex items-center gap-1.5">
                  <Video size={11} /> On-the-Job Demonstration
                </div>
                <div className="font-display text-2xl font-semibold mb-1">Record competency in practice</div>
                <div className="text-sm leading-relaxed" style={{ color: 'var(--gic-muted)' }}>
                  This module requires {mod.ojl_hours} hour{mod.ojl_hours === 1 ? '' : 's'} of demonstrated practice.
                  Record a video showing the competency, add context, and submit for mentor review.
                </div>
              </div>
              <button onClick={() => onOpenRecorder(mod)} className="btn-primary flex items-center gap-2">
                <Mic size={14} /> Record submission
              </button>
            </div>

            {submissions && submissions.length > 0 && (
              <div className="border-t pt-5" style={{ borderColor: 'var(--gic-line)' }}>
                <div className="eyebrow mb-3">Your submissions</div>
                <div className="space-y-2">
                  {submissions.map(s => (
                    <button key={s.id}
                            onClick={() => onViewSubmission(s)}
                            className="w-full text-left flex items-center justify-between p-3 rounded-lg hover:bg-stone-50 border"
                            style={{ borderColor: 'var(--gic-line)' }}>
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-lg flex items-center justify-center"
                             style={{
                               background: s.status === 'approved' ? 'rgba(31,122,74,0.08)'
                                         : s.status === 'needs_revision' ? 'rgba(184,61,92,0.08)'
                                         : 'rgba(45,31,177,0.06)',
                               color: s.status === 'approved' ? 'var(--gic-green)'
                                    : s.status === 'needs_revision' ? 'var(--gic-rose)'
                                    : 'var(--gic-blue)'
                             }}>
                          {s.status === 'approved' ? <CheckCircle2 size={16}/>
                           : s.status === 'needs_revision' ? <RotateCcw size={16}/>
                           : <Clock size={16}/>}
                        </div>
                        <div>
                          <div className="font-medium text-sm">
                            {s.status === 'approved' ? 'Approved' :
                             s.status === 'needs_revision' ? 'Needs revision' :
                             s.status === 'under_review' ? 'Under review' : 'Submitted'}
                          </div>
                          <div className="text-xs" style={{ color: 'var(--gic-muted)' }}>
                            {fmtRelative(s.submitted_at)}{s.ojl_hours_credited ? ` · ${s.ojl_hours_credited}h credited` : ''}
                          </div>
                        </div>
                      </div>
                      <ChevronRight size={16} style={{ color: 'var(--gic-warm)' }} />
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* Approval footer for approved modules */}
        {isApproved && (
          <div className="mt-12 pt-6 border-t text-xs flex items-center gap-2" style={{ borderColor: 'var(--gic-line)', color: 'var(--gic-warm)' }}>
            <ShieldCheck size={14} />
            Reviewed and approved by {mod.approved_by_email === 'cathy@globalinvestmentcompanies.com' ? 'Cathy Jackson-Gent' : mod.approved_by_email}, Global Investment Company.
          </div>
        )}
      </main>
    );
  }

  // LESSON SCREEN
  if (view === 'lesson') {
    const lesson = lessons[currentLesson];
    if (!lesson) return null;
    const lessonBlocks = lesson.blocks || [];

    return (
      <main className="max-w-3xl mx-auto px-6 lg:px-10 py-12 animate-fade-in" style={{ position:'relative' }}>
        <SelectionReader />

        <button onClick={() => setView('overview')} className="btn-ghost flex items-center gap-1.5 mb-8">
          <ArrowLeft size={14} /> Module overview
        </button>

        <div className="mb-2 flex items-center gap-3">
          <div className="eyebrow">Lesson {String(currentLesson + 1).padStart(2, '0')} of {lessons.length}</div>
          {lesson.read_time && <span className="text-xs" style={{ color: 'var(--gic-warm)' }}>· {lesson.read_time}</span>}
          {lesson.watch_time && <span className="text-xs" style={{ color: 'var(--gic-warm)' }}>· ▶ {lesson.watch_time} watch</span>}
          {lesson.listen_time && <span className="text-xs" style={{ color: 'var(--gic-warm)' }}>· 🎧 {lesson.listen_time} listen</span>}
        </div>
        <h1 className="font-display text-4xl font-semibold leading-tight mb-8">{lesson.title}</h1>

        <LessonPlayer
          blocks={lessonBlocks}
          activeBlock={ttsBlock}
          setActiveBlock={setTtsBlock}
        />

        <div className="prose-gic">
          {lessonBlocks.map((block, i) => (
            <div key={i} id={`tts-block-${i}`}
              style={{
                transition: 'background 0.3s, border-color 0.3s',
                borderLeft: ttsBlock === i ? '3px solid var(--gic-blue)' : '3px solid transparent',
                paddingLeft: ttsBlock === i ? '12px' : '0',
                borderRadius: '0 4px 4px 0',
                background: ttsBlock === i ? 'rgba(45,31,177,0.04)' : 'transparent',
              }}>
              <LessonBlock block={block} />
            </div>
          ))}
        </div>

        <AskQuestionButton profile={profile} moduleNumber={mod.module_number} lessonIndex={currentLesson} lessonTitle={lesson.title} />

          <div className="mt-10 border rounded-xl overflow-hidden" style={{ borderColor: 'var(--gic-line)' }}>

              className="w-full flex items-center justify-between px-5 py-3 text-sm font-medium"
              style={{ background: 'var(--gic-bone)' }}>
              <span className="flex items-center gap-2">
                <Edit3 size={13} style={{ color: 'var(--gic-blue)' }}/> My notes for this lesson
                {noteText && <span className="badge" style={{ color: 'var(--gic-green)', background: 'rgba(31,122,74,0.08)' }}>saved</span>}
              </span>
              <ChevronRight size={14} style={{ transform: showNotes ? 'rotate(90deg)' : 'none', transition: 'transform 0.2s', color: 'var(--gic-warm)' }}/>
            </button>
            {showNotes && (
              <div className="p-4">
                <textarea
                  className="w-full text-sm leading-relaxed resize-none border-0 outline-none bg-transparent"
                  style={{ minHeight: 120, color: 'var(--gic-ink)' }}
                  placeholder="Type your notes here — they're saved automatically and private to you…"
                  value={noteText}
                  onChange={e => handleNoteChange(e.target.value)}
                />
                <div className="text-xs mt-1" style={{ color: 'var(--gic-warm)' }}>
                  {noteSaved ? 'Saved' : 'Saving…'}
                </div>
              </div>
            )}
          </div>
        )}

        {/* Nav */}
        <div className="mt-10 pt-8 border-t flex items-center justify-between" style={{ borderColor: 'var(--gic-line)' }}>
          <button
            onClick={() => { setCurrentLesson(Math.max(0, currentLesson - 1)); setTtsBlock(-1); window.speechSynthesis.cancel(); }}
            disabled={currentLesson === 0}
            className="btn-ghost flex items-center gap-1.5 disabled:opacity-30">
            <ArrowLeft size={14} /> Previous
          </button>

          <button
            onClick={async () => {
              await markLessonComplete(currentLesson);
              if (currentLesson < lessons.length - 1) {
                setCurrentLesson(currentLesson + 1); setTtsBlock(-1); window.speechSynthesis.cancel();
                window.scrollTo({ top: 0, behavior: 'smooth' });
              } else {
                setView('overview');
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            }}
            className="btn-primary flex items-center gap-2">
            {currentLesson < lessons.length - 1 ? 'Mark complete & next' : 'Mark complete'}
            <ArrowRight size={16} />
          </button>
        </div>
      </main>
    );
  }

  // QUIZ SCREEN
  if (view === 'quiz' && quiz) {
    return <QuizRunner
      mod={mod}
      quiz={quiz}
      profile={profile}
      onClose={() => setView('overview')}
      onComplete={async (score, passed) => {
        await onProgressUpdate(mod.id, {
          status: passed ? 'completed' : 'in_progress',
          best_quiz_score: Math.max(score, progress?.best_quiz_score || 0),
          attempt_count: (progress?.attempt_count || 0) + 1,
          ...(passed ? { completed_at: new Date().toISOString() } : {})
        });
      }}
    />;
  }

  return null;
}

function LessonBlock({ block }) {
  switch (block.type) {
    case 'heading':
      return <h2>{block.text}</h2>;
    case 'subheading':
      return <h3>{block.text}</h3>;
    case 'paragraph':
      return <p dangerouslySetInnerHTML={{ __html: block.text }} />;
    case 'list':
      return (
        <ul>{(block.items || []).map((item, i) => <li key={i} dangerouslySetInnerHTML={{ __html: item }} />)}</ul>
      );
    case 'numbered':
      return (
        <ol>{(block.items || []).map((item, i) => <li key={i} dangerouslySetInnerHTML={{ __html: item }} />)}</ol>
      );
    case 'callout': {
      const colors = {
        key:    { border: 'var(--gic-blue)',  bg: 'rgba(45,31,177,0.04)', icon: Sparkles },
        warn:   { border: 'var(--gic-amber)', bg: 'rgba(200,132,28,0.06)', icon: AlertTriangle },
        do:     { border: 'var(--gic-green)', bg: 'rgba(31,122,74,0.06)', icon: CheckCircle2 },
        note:   { border: 'var(--gic-warm)',  bg: 'rgba(138,116,94,0.06)', icon: Bookmark }
      };
      const c = colors[block.kind] || colors.note;
      const Icon = c.icon;
      return (
        <div className="my-6 p-5 border-l-2 flex items-start gap-3" style={{ borderColor: c.border, background: c.bg }}>
          <Icon size={18} className="flex-shrink-0 mt-0.5" style={{ color: c.border }} />
          <div className="flex-1">
            {block.title && <div className="font-semibold mb-1" style={{ color: c.border }}>{block.title}</div>}
            <div className="text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: block.text }} />
          </div>
        </div>
      );
    }
    case 'glossary':
      return (
        <div className="my-8 gic-card p-6">
          <div className="eyebrow mb-4">Glossary</div>
          <dl className="space-y-3">
            {(block.terms || []).map((t, i) => (
              <div key={i} className="grid md:grid-cols-[180px_1fr] gap-2 md:gap-4 pb-3 border-b last:border-0" style={{ borderColor: 'var(--gic-line)' }}>
                <dt className="font-semibold" style={{ color: 'var(--gic-blue)' }}>{t.term}</dt>
                <dd className="text-sm leading-relaxed" style={{ color: 'var(--gic-ink)' }}>{t.definition}</dd>
              </div>
            ))}
          </dl>
        </div>
      );
    case 'activity':
      return (
        <div className="my-8 gic-card p-6" style={{ background: 'rgba(45,31,177,0.03)', borderColor: 'var(--gic-blue)' }}>
          <div className="eyebrow mb-2" style={{ color: 'var(--gic-blue)' }}>Activity</div>
          <div className="font-display text-xl font-semibold mb-3">{block.title}</div>
          <div className="text-sm leading-relaxed mb-4" dangerouslySetInnerHTML={{ __html: block.prompt || '' }} />
          {block.steps && (
            <ol className="text-sm space-y-2 pl-0 list-none">
              {block.steps.map((step, i) => (
                <li key={i} className="flex gap-3">
                  <span className="font-mono text-xs flex-shrink-0 w-6" style={{ color: 'var(--gic-blue)' }}>{String(i + 1).padStart(2, '0')}</span>
                  <span dangerouslySetInnerHTML={{ __html: step }} />
                </li>
              ))}
            </ol>
          )}
        </div>
      );
    case 'case_study':
      return (
        <div className="my-8 border-l-2 pl-6" style={{ borderColor: 'var(--gic-ink)' }}>
          <div className="eyebrow mb-2">Case Study</div>
          <div className="font-display text-xl font-semibold mb-3">{block.title}</div>
          <div className="text-sm leading-relaxed italic mb-4" style={{ color: 'var(--gic-muted)' }} dangerouslySetInnerHTML={{ __html: block.scenario || '' }} />
          {block.discussion && (
            <div className="text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: block.discussion }} />
          )}
        </div>
      );
    case 'divider':
      return <div className="gic-rule my-12"><span className="font-display italic text-sm">§</span></div>;
    case 'video':
      return (
        <div className="my-8">
          {block.title && <div className="eyebrow mb-2">{block.title}</div>}
          {block.watch_time && <div className="text-xs mb-2" style={{color:'var(--gic-warm)'}}>▶ {block.watch_time} watch</div>}
          {block.url && (
            block.url.includes('youtube.com') || block.url.includes('youtu.be') || block.url.includes('vimeo.com')
              ? <div style={{position:'relative',paddingBottom:'56.25%',height:0,overflow:'hidden',borderRadius:'8px'}}>
                  <iframe src={
                    block.url.includes('youtu.be')
                      ? 'https://www.youtube.com/embed/' + block.url.split('youtu.be/')[1]?.split('?')[0]
                      : block.url.includes('watch?v=')
                      ? 'https://www.youtube.com/embed/' + block.url.split('watch?v=')[1]?.split('&')[0]
                      : block.url.replace('vimeo.com/','player.vimeo.com/video/')
                  } style={{position:'absolute',top:0,left:0,width:'100%',height:'100%'}}
                    frameBorder="0" allowFullScreen title={block.title||'Video'} />
                </div>
              : <video src={block.url} controls style={{width:'100%',borderRadius:'8px'}} />
          )}
          {block.caption && <p className="text-xs mt-2" style={{color:'var(--gic-muted)'}}>{block.caption}</p>}
        </div>
      );
    case 'image':
      return (
        <div className="my-8">
          {block.url && <img src={block.url} alt={block.caption||block.title||''} style={{width:'100%',borderRadius:'8px',objectFit:'cover'}} />}
          {block.caption && <p className="text-xs mt-2 text-center" style={{color:'var(--gic-muted)'}}>{block.caption}</p>}
        </div>
      );
    case 'audio':
      return (
        <div className="my-6 p-4 border rounded-lg flex items-center gap-4" style={{borderColor:'var(--gic-line)'}}>
          <div style={{color:'var(--gic-blue)'}}>🎧</div>
          <div className="flex-1">
            {block.title && <div className="font-semibold text-sm mb-1">{block.title}</div>}
            {block.listen_time && <div className="text-xs mb-2" style={{color:'var(--gic-warm)'}}>{block.listen_time} listen</div>}
            {block.url && <audio src={block.url} controls style={{width:'100%'}} />}
          </div>
        </div>
      );
    default:
      return null;
  }
}

// ============================================================
// QUIZ RUNNER
// ============================================================
function QuizRunner({ mod, quiz, profile, onClose, onComplete }) {
  const [idx, setIdx]           = useState(0);
  const [answers, setAnswers]   = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore]       = useState(0);

  const questions = quiz.questions || [];
  const passingScore = quiz.passing_score || 80;

  const select = (qIdx, choiceIdx) => {
    if (submitted) return;
    setAnswers(a => ({ ...a, [qIdx]: choiceIdx }));
  };

  const submit = async () => {
    let correct = 0;
    questions.forEach((q, i) => {
      if (answers[i] === q.correct) correct++;
    });
    const finalScore = Math.round((correct / questions.length) * 100);
    setScore(finalScore);
    setSubmitted(true);
    const passed = finalScore >= passingScore;

    // Log attempt
    if (supabase && profile) {
      await supabase.from('quiz_attempts').insert({
        user_id: profile.id,
        module_id: mod.id,
        quiz_type: 'module_exam',
        score: correct,
        max_score: questions.length,
        passed,
        answers
      });
    }

    await onComplete(finalScore, passed);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  if (submitted) {
    const passed = score >= passingScore;
    return (
      <main className="max-w-2xl mx-auto px-6 lg:px-10 py-16 text-center animate-fade-in">
        <div className="mb-8">
          {passed ? (
            <div className="w-20 h-20 mx-auto rounded-full flex items-center justify-center"
                 style={{ background: 'rgba(31,122,74,0.1)', color: 'var(--gic-green)' }}>
              <Award size={36} />
            </div>
          ) : (
            <div className="w-20 h-20 mx-auto rounded-full flex items-center justify-center"
                 style={{ background: 'rgba(184,61,92,0.1)', color: 'var(--gic-rose)' }}>
              <RefreshCw size={32} />
            </div>
          )}
        </div>

        <div className="eyebrow mb-3">{passed ? 'Competency Demonstrated' : 'Not Yet'}</div>
        <h1 className="font-display text-4xl font-semibold mb-3">
          {passed ? 'Module complete.' : 'Close — but not yet.'}
        </h1>
        <p className="text-base mb-2" style={{ color: 'var(--gic-muted)' }}>
          You scored <strong style={{ color: 'var(--gic-ink)' }}>{score}%</strong> on this assessment.
        </p>
        <p className="text-sm" style={{ color: 'var(--gic-muted)' }}>
          Passing threshold: {passingScore}%
        </p>

        <div className="mt-10 flex items-center justify-center gap-3">
          <button onClick={onClose} className="btn-secondary">
            {passed ? 'Return to module' : 'Review lessons'}
          </button>
          {!passed && (
            <button onClick={() => { setSubmitted(false); setAnswers({}); setIdx(0); }}
                    className="btn-primary">Try again</button>
          )}
        </div>
      </main>
    );
  }

  const q = questions[idx];
  const totalAnswered = Object.keys(answers).length;
  const allAnswered = totalAnswered === questions.length;

  return (
    <main className="max-w-2xl mx-auto px-6 lg:px-10 py-12 animate-fade-in">
      <button onClick={onClose} className="btn-ghost flex items-center gap-1.5 mb-8">
        <ArrowLeft size={14} /> Leave assessment
      </button>

      <div className="mb-6 flex items-center justify-between">
        <div className="eyebrow">Question {idx + 1} of {questions.length}</div>
        <div className="text-xs" style={{ color: 'var(--gic-warm)' }}>{totalAnswered} answered</div>
      </div>

      {/* Progress bar */}
      <div className="h-1 mb-10" style={{ background: 'var(--gic-line)' }}>
        <div className="h-full transition-all"
             style={{ width: `${((idx + 1) / questions.length) * 100}%`, background: 'var(--gic-blue)' }} />
      </div>

      <h2 className="font-display text-2xl leading-snug mb-8">{q.prompt}</h2>

      <div className="space-y-3 mb-10">
        {q.options.map((opt, i) => {
          const isSelected = answers[idx] === i;
          return (
            <button
              key={i}
              onClick={() => select(idx, i)}
              className={`quiz-option ${isSelected ? 'selected' : ''}`}>
              <div className="flex items-start gap-3">
                <div className="font-mono text-xs mt-1 flex-shrink-0"
                     style={{ color: isSelected ? 'var(--gic-blue)' : 'var(--gic-warm)' }}>
                  {String.fromCharCode(65 + i)}
                </div>
                <div className="text-sm leading-relaxed">{opt}</div>
              </div>
            </button>
          );
        })}
      </div>

      <div className="flex items-center justify-between">
        <button
          onClick={() => setIdx(Math.max(0, idx - 1))}
          disabled={idx === 0}
          className="btn-ghost flex items-center gap-1.5 disabled:opacity-30">
          <ArrowLeft size={14} /> Previous
        </button>

        {idx < questions.length - 1 ? (
          <button
            onClick={() => setIdx(idx + 1)}
            disabled={answers[idx] == null}
            className="btn-primary flex items-center gap-2 disabled:opacity-30">
            Next <ArrowRight size={16} />
          </button>
        ) : (
          <button
            onClick={submit}
            disabled={!allAnswered}
            className="btn-primary flex items-center gap-2 disabled:opacity-30">
            Submit assessment <Check size={16} />
          </button>
        )}
      </div>
    </main>
  );
}
