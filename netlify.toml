[build]
  publish = "."

# Keep deep links working — every route serves index.html (React handles routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache index.html — always serve the latest version
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(self), microphone=(self), geolocation=()"

[[scheduled-functions]]
  name = "industry-check"
  cron = "0 8 * * *"

[[scheduled-functions]]
  name = "cleanup-videos"
  cron = "0 0 * * *"
